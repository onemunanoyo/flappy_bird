<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Flappy Chick 🐥 — a cute canvas flapping game</title>
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='88'>🐥</text></svg>" />
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none}
  body{
    touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
    font-family:"Baloo 2","Nunito","Segoe UI Rounded","Comic Sans MS","Chalkboard SE",ui-rounded,"Trebuchet MS",system-ui,sans-serif;
    color:#4a3630;
    background:linear-gradient(135deg,#ffe3f1 0%,#cfeeff 24%,#ffe9c4 48%,#ffd3ec 72%,#cbe7ff 100%);
    background-size:320% 320%;animation:drift 26s ease-in-out infinite alternate;
  }
  @keyframes drift{from{background-position:0% 0%}to{background-position:100% 100%}}
  .bgfx{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
  .bgfx span{position:absolute;left:var(--x,50%);bottom:-70px;font-size:var(--fs,24px);line-height:1;opacity:0;animation:rise var(--dur,14s) linear var(--del,0s) infinite;filter:drop-shadow(0 8px 10px rgba(60,30,40,.13))}
  @keyframes rise{0%{transform:translateY(0) rotate(-10deg) scale(.85);opacity:0}14%{opacity:.42}74%{opacity:.32}100%{transform:translateY(calc(-1 * var(--rise,86vh))) rotate(28deg) scale(1.12);opacity:0}}
  .wrap{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px}
  .brand{margin:0;font-size:clamp(15px,3.1vh,22px);font-weight:900;letter-spacing:.05em;color:#5d4136;text-shadow:0 2px 0 rgba(255,255,255,.85),0 8px 22px rgba(120,60,60,.22)}
  .stage{position:relative;width:480px;height:640px;border-radius:calc(var(--u,1)*26px);box-shadow:0 calc(var(--u,1)*22px) calc(var(--u,1)*54px) rgba(120,70,80,.35),0 0 0 calc(var(--u,1)*7px) #ffeecf,0 0 0 calc(var(--u,1)*9px) rgba(255,255,255,.5)}
  canvas{display:block;width:100%;height:100%;border-radius:inherit;background:#7fe3f6;touch-action:none}
  .ui{position:absolute;top:calc(var(--u,1)*12px);right:calc(var(--u,1)*12px);z-index:6;display:flex;gap:calc(var(--u,1)*6px)}
  button.pill{all:unset;display:inline-flex;align-items:center;gap:calc(var(--u,1)*6px);cursor:pointer;padding:calc(var(--u,1)*5px) calc(var(--u,1)*12px);border-radius:999px;font-weight:800;font-size:calc(var(--u,1)*14px);line-height:1;color:#fff;background:linear-gradient(180deg,rgba(255,255,255,.62),rgba(255,255,255,.24));box-shadow:0 calc(var(--u,1)*4px) calc(var(--u,1)*12px) rgba(90,50,60,.25),inset 0 0 0 2px rgba(255,255,255,.55);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);transition:transform .14s ease,filter .14s ease}
  button.pill:hover{transform:translateY(-2px) scale(1.05);filter:brightness(1.08)}
  button.pill:active{transform:scale(.93)}
  button.pill:focus-visible{outline:3px solid rgba(255,255,255,.95);outline-offset:2px}
  .hint{margin:0;font-size:clamp(11px,2vh,14.5px);font-weight:800;letter-spacing:.03em;color:#ffeef9;background:rgba(66,42,52,.42);padding:6px 14px;border-radius:999px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.28),0 6px 16px rgba(70,40,50,.18)}
  kbd{background:rgba(255,255,255,.78);color:#4a3340;border-radius:6px;padding:2px 7px;font-family:inherit;font-size:.86em;font-weight:900;box-shadow:inset 0 -2px 0 rgba(120,90,110,.35)}
  @media (max-height:540px){.brand{font-size:13px}.hint{font-size:11px}.wrap{gap:6px}}
  @media (prefers-reduced-motion:reduce){body{animation:none}.bgfx{display:none}button.pill{transition:none}}
</style>
</head>
<body>
<div class="bgfx" id="bgfx"></div>
<main class="wrap">
  <h1 class="brand" id="brand">🐥 Flappy&nbsp;Chick</h1>
  <div class="stage" id="stage">
    <canvas id="game" width="480" height="640"></canvas>
    <div class="ui">
      <button class="pill" id="btnSound" title="Sound on/off — key M"><span class="i">🔊</span><span class="t">sound</span></button>
      <button class="pill" id="btnPause" title="Pause / resume — key P"><span class="i">⏸</span><span class="t">pause</span></button>
      <button class="pill" id="btnFs" title="Fullscreen — key F"><span class="i">⛶</span></button>
    </div>
  </div>
  <p class="hint" id="hint"><kbd>Space</kbd> / <kbd>tap</kbd> flap · <kbd>P</kbd> pause · <kbd>M</kbd> mute · <kbd>R</kbd> restart</p>
</main>

<script>
(function(){
'use strict';
/* ------------------------------------------------------------------ *
 *  Flappy Chick — cute Canvas flappy-bird, no assets, everything drawn
 *  procedurally: smooth gravity, wing animation, parallax world, day /
 *  dusk / night cycle, pipes with flowers, particles, medals, sounds.
 * ------------------------------------------------------------------ */

var cv=document.getElementById('game');
var ctx=cv.getContext('2d');
var stage=document.getElementById('stage');
var brand=document.getElementById('brand');
var hint=document.getElementById('hint');
var bgfx=document.getElementById('bgfx');
var btnSound=document.getElementById('btnSound');
var btnPause=document.getElementById('btnPause');
var btnFs=document.getElementById('btnFs');
if(!cv||!ctx){ return; }

/* ---------- logical play field ---------- */
var W=480,H=640,GH=132,GY=H-GH;         // GROUND_Y = 508
var PW=76,CAPH=28,POVER=9;              // pipe width / cap height / cap overhang
var GRAV=1450,FLAPV=-430,MAXFALL=620;
var FONT='"Baloo 2","Nunito","Segoe UI Rounded","Comic Sans MS","Chalkboard SE",ui-rounded,"Trebuchet MS",system-ui,sans-serif';

/* ---------- math helpers ---------- */
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }
function sstep(t){ t=clamp(t,0,1); return t*t*(3-2*t); }
function win(t,a,b){ return clamp((t-a)/(b-a),0,1); }
function eOQ(t){ t=clamp(t,0,1); return t*(2-t); }                     // easeOutQuad
function eOB(t){ t=clamp(t,0,1); var c1=1.15,c3=c1+1; return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2); } // easeOutBack
function hashF(n){ var x=Math.sin(n*127.1+13.7)*43758.5453; return x-Math.floor(x); }
function rnd(a,b){ return a+Math.random()*(b-a); }
function rndi(a,b){ return Math.floor(rnd(a,b+1)); }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

/* ---------- colour helpers (palettes are [r,g,b] arrays) ---------- */
var DAYISH=[255,255,255], NIGHTISH=[38,52,84];
function hx(h){ var n=parseInt(String(h).slice(1),16); return [(n>>16)&255,(n>>8)&255,n&255]; }
function mix(a,b,k){ k=clamp(k,0,1); return [a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k,a[2]+(b[2]-a[2])*k]; }
function lite(c,k){ return mix(c,DAYISH,k); }
function dark(c,k){ return mix(c,NIGHTISH,k*0.9); }
function col(c,a){
  if(a===undefined||a>=1){ return 'rgb('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+')'; }
  return 'rgba('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+','+clamp(a,0,1).toFixed(3)+')';
}

/* ---------- path helpers ---------- */
function rr(x,y,w,h,r){
  r=Math.min(r,Math.abs(w)/2,Math.abs(h)/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y,r);
  ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function fillRR(x,y,w,h,r,c){ rr(x,y,w,h,r); ctx.fillStyle=c; ctx.fill(); }
function frameRR(x,y,w,h,r,c,lw){ rr(x,y,w,h,r); ctx.lineWidth=lw; ctx.strokeStyle=c; ctx.lineJoin='round'; ctx.stroke(); }

function starPath(cx,cy,rOuter,rInner,points,rot){
  ctx.beginPath();
  for(var i=0;i<points*2;i++){
    var a=rot+(i/(points*2))*Math.PI*2, rad=(i%2===0)?rOuter:rInner;
    var px=cx+Math.cos(a)*rad, py=cy+Math.sin(a)*rad;
    if(i===0){ ctx.moveTo(px,py); } else { ctx.lineTo(px,py); }
  }
  ctx.closePath();
}
function starDraw(cx,cy,r,rot,fill,a,points){
  starPath(cx,cy,r,r*0.42,points||5,rot);
  ctx.globalAlpha=a; ctx.fillStyle=fill; ctx.fill(); ctx.globalAlpha=1;
}

/* ---------- text ---------- */
function fontStr(px,w){ return (w||800)+' '+px.toFixed(1)+'px '+FONT; }
function txt(s,x,y,size,o){
  o=o||{};
  var fill=(o.fill!==undefined)?o.fill:'#fff';
  var line=(o.line!==undefined)?o.line:'#2b2026';
  var lw=(o.lw!==undefined)?o.lw:0.52;
  var alpha=(o.alpha!==undefined)?o.alpha:1;
  var align=o.align||'center', weight=o.weight||800, base=o.base||'middle';
  ctx.save();
  ctx.globalAlpha*=clamp(alpha,0,1);
  ctx.font=fontStr(size,weight);
  ctx.textAlign=align; ctx.textBaseline=base;
  ctx.lineJoin='round'; ctx.lineCap='round';
  if(o.shadow){ ctx.shadowColor='rgba(35,22,28,0.55)'; ctx.shadowBlur=o.shadow; ctx.shadowOffsetY=o.shadow*0.35; }
  if(lw>0){ ctx.lineWidth=Math.max(2,size*lw); ctx.strokeStyle=line; ctx.strokeText(String(s),x,y); }
  ctx.fillStyle=fill; ctx.fillText(String(s),x,y);
  ctx.restore();
}

/* ---------- storage (guarded: private mode / file:// restrictions) ---------- */
function lsGet(k,d){ try{ var v=localStorage.getItem(k); return (v===null)?d:v; }catch(e){ return d; } }
function lsSet(k,v){ try{ localStorage.setItem(k,String(v)); }catch(e){} }

/* ---------- world palettes: positional value lists + shared key names ---------- */
var PK=['skyTop','skyMid','skyBot','nn','starA','glowA','warm','cloud','cloudA',
         'far','mid','tree','bush','grass','dirt','pipe',
         'birdMain','birdBelly','birdWing','birdBeak','birdCheek','outline'];
// order: sky1 sky2 sky3 | nn starA glowA | warm cloud cloudA | far mid tree bush grass dirt pipe | birdMain belly wing beak cheek outline
var V_DAY=[
  '#79e2f6','#aeeefb','#dff7ff',   0.00,0.00,0.04,'#ffd39a','#ffffff',0.92,
  '#a9d9e3','#6fbfa4','#3f8f6a','#63b163','#74d05d','#e0c07c','#74c96b',
  '#ffd75e','#fff3ca','#f6ba42','#ff9b34','#ffb59d','#34262b'];
var V_DUSK=[
  '#4a4b8e','#9e6bb0','#ffbd86',   0.55,0.42,0.55,'#ff9b6b','#f7d3c0',0.80,
  '#6d74a0','#5b7ea0','#37536f','#4b7f70','#7fb0a0','#c99f7f','#79a88a',
  '#ffc163','#ffe6b8','#eda948','#f58a2f','#ffb099','#2f2326'];
var V_NIGHT=[
  '#161a33','#273254','#45608f',   1.00,1.00,0.10,'#6e86bd','#93a7cc',0.50,
  '#33507a','#2b4268','#1b2f47','#24415a','#2f6157','#7c6a5a','#4f7a60',
  '#f3ca5c','#ffeabf','#e2a343','#ef8f37','#ffb199','#1b1c29'];
var V_DAWN=[
  '#5c6fae','#f0b9d0','#ffd9b0',   0.30,0.22,0.40,'#ffcf9a','#f3dfe8',0.80,
  '#8fb1cf','#5ea392','#357f66','#52926f','#74c25e','#d8ab72','#6cb873',
  '#ffd264','#fff0c6','#f2b447','#ff9836','#ffb19a','#332623'];

function mkVals(v){ var o={},i; for(i=0;i<PK.length;i++){ o[PK[i]]=(typeof v[i]==='string')?hx(v[i]):v[i]; } return o; }
var PALTIMES=[0,0.30,0.52,0.78,1.0];
var PALVALS=[V_DAY,V_DUSK,V_NIGHT,V_DAWN,V_DAY.slice()];
var PALS=[]; (function(){ for(var i=0;i<PALVALS.length;i++){ PALS.push(mkVals(PALVALS[i])); } })();
var CYCLE=72;                                   // seconds for a whole day→night cycle

function getPal(t){
  t=(t%1+1)%1;
  var i=0;
  while(i<PALTIMES.length-2 && t>=PALTIMES[i+1]){ i++; }
  var f=sstep(win(t,PALTIMES[i],PALTIMES[i+1]));
  var A=PALS[i],B=PALS[i+1],out={},k;
  for(k=0;k<PK.length;k++){
    var key=PK[k];
    out[key]=(typeof B[key]==='number') ? lerp(A[key],B[key],f) : mix(A[key],B[key],f);
  }
  return out;
}

/* ---------- deterministic decoration ---------- */
function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; var t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
var GR=mulberry(0x52A7C1);
function gR(a,b){ return a+(b-a)*GR(); }

// clouds -------------------------------------------------------------
var CLOUDW=920, CLOUDS=[];
(function(){
  var puffs=[[-24,7,15],[0,-6,21],[22,5,16],[9,9,12],[-8,2,13]];
  for(var i=0;i<9;i++){
    var bumps=[];
    for(var j=0;j<puffs.length;j++){ bumps.push([puffs[j][0]+gR(-7,7),puffs[j][1]+gR(-5,5),puffs[j][2]*gR(0.8,1.2)]); }
    if(GR()<0.4){ bumps.push([gR(-30,34),gR(-12,10),gR(7,12)]); }
    CLOUDS.push({ x:gR(0,CLOUDW), y:gR(26,210), s:gR(0.55,1.25) });
    bumps[i]=bumps[i]; CLOUDS[i].b=bumps;
  }
})();

// mid hills / bushes -------------------------------------------------
var HILLW=760, BUSHW=700, WINDW=780;
var HILLS=[[-0.0032,-90,40,1.2,26],[-0.0094,-38,20,2.6,13],[-0.019,-20,10,0.4,7]];
var RIDGE=[[-0.0018,-140,34,0.9,40],[-0.0051,-62,20,2.2,22],[-0.0101,-26,10,1.6,9]];
function ridgeY(wx){ var i,b,v,y=GY+30; for(i=0;i<RIDGE.length;i++){ b=RIDGE[i]; v=Math.sin(Math.abs(wx)*b[0]*-1+b[3]); y+=b[1]+v*b[2]; } return Math.min(y,GY-62); }
function hillYAt(wx){ var i,b,v,y=GY+8; for(i=0;i<HILLS.length;i++){ b=HILLS[i]; v=Math.sin(Math.abs(wx)*b[0]*-1+b[3]); y+=b[1]+v*b[2]; } return Math.min(y,GY-26); }
var BUSHES=[];
(function(){
  for(var i=0;i<7;i++){
    var w=gR(64,128), nb=Math.max(3,Math.round(w/24)), bumps=[];
    for(var k=0;k<nb;k++){ bumps.push({ dx:(k+0.5)*(w/nb)+gR(-6,6), r:(w/nb)*1.1*gR(0.8,1.35) }); }
    var flowers=[]; if(GR()<0.8){ flowers.push({ dx:gR(6,w-6), dy:-gR(12,26), r:gR(4,7) }); if(GR()<0.5){ flowers.push({ dx:gR(6,w-6), dy:-gR(8,22), r:gR(3,6) }); } }
    BUSHES.push({ x:gR(0,BUSHW), w:w, bumps:bumps, flowers:flowers, sway:gR(0,6.28) });
  }
  BUSHES.sort(function(a,b){ return a.x-b.x; });
})();
var WINDS=[]; (function(){ for(var i=0;i<3;i++){ WINDS.push({ x:gR(40,WINDW-60), h:gR(34,52), ph:gR(0,6.28) }); } })();

// ground strip + decorations ---------------------------------------
var GW=196, GD=[], LIPY0=GY+22;
(function(){
  for(var i=0;i<12;i++){ GD.push({ x:gR(2,GW-8), k:Math.floor(GR()*5), dx:gR(-8,10), s:gR(0.7,1.25), ph:gR(0,6.28) }); }
  GD.sort(function(a,b){ return a.x-b.x; });
})();
function lipAt(wx){ var yy=LIPY0+Math.sin(Math.abs(wx)*-0.02+1.1)*3+Math.sin(Math.abs(wx)*-0.052+2.7)*2; return clamp(yy,LIPY0-5,LIPY0+5); }

// stars / fireflies / flocks / shooting star ------------------------
var STARS=[]; (function(){ for(var i=0;i<110;i++){ STARS.push({ x:GR()*W, y:GR()*320+8, r:gR(0.6,2.2), sp:gR(0.5,2.4), ph:gR(0,6.28), big:(GR()<0.16) }); } })();
var FF=[], FFP=W+140; (function(){ for(var i=0;i<16;i++){ FF.push({ x:GR()*FFP, y:gR(H*0.56,GY+34), amp:gR(4,14), sp:gR(0.3,1.1), ph:gR(0,6.28), r:gR(1.6,3.2), vx:gR(2,9) }); } })();
var FLOCKS=[], FLP=W+320; (function(){ for(var i=0;i<4;i++){ FLOCKS.push({ x:gR(0,FLP), y:gR(60,180), n:rndi(2,4), sv:gR(7,16), ph:gR(0,6.28) }); } })();
var shootT=rnd(3,9), shoot=null, shootTimer=0;

/* ---------- tiling helper ---------------------------------------- */
// Draws a decoration list repeated across tile copies so scrolling is seamless.
function tileRun(scroll,tileW,items,drawFn){
  if(!items.length){ return; }
  var base=-(scroll%tileW);
  var copies=Math.ceil(W/tileW)+2;
  for(var c=-1;c<copies;c++){
    var ox=base+c*tileW;
    for(var i=0;i<items.length;i++){ drawFn(items[i],ox,i); }
  }
}

/* ---------- state ------------------------------------------------- */
var state='ready', playing=false, paused=false;
var clock=0, playT=0, lastNow=0;
var best=parseFloat(lsGet('flappy.best','0'))||0;
var muted=(lsGet('flappy.mute','0')==='1');
var speed=205, speedTarget=205, nextIn=1.05;
var score=0, newBest=false, medal=-1;
var flash=0, shake=0, popT=0, readyT=0, overT=0, overLock=0, dieT=0, diedAt=0;
var blinkNext=rnd(1.8,4), blinkOn=0;
var trailT=0, tipText=pick(TIPS());
function TIPS(){ return ['keep taps short and steady','aim a little above the gap middle','wait — let the pipes come to you','small flaps beat big flaps','stay near the centre of the screen']; }

var pipes=[], parts=[];
var bird={ x:152,y:H*0.47,vy:0,rot:0,flapAge:9,wing:0.2,sx:1,sy:1,tumble:0,landed:false,bounced:false,dizzy:0,xp:0,yp:0,restY:GY-16 };
bird.y=H*0.47;
var scroll={ far:0, mid:0, bush:0, gnd:0, cloud:0 };

/* ---------- audio ------------------------------------------------- */
var actx=null,master=null,nBuf=null;
function ensureAudio(){
  if(actx){ if(actx.state==='suspended'){ try{ actx.resume(); }catch(e){} } return; }
  var AC=(window.AudioContext||window.webkitAudioContext);
  if(!AC){ return; }
  try{
    actx=new AC();
    master=actx.createGain();
    master.gain.value=muted?0:0.34;
    master.connect(actx.destination);
  }catch(e){ actx=null; master=null; }
}
function tone(freq,when,dur,type,vol,to){
  if(!actx||!master){ return; }
  try{
    var t0=actx.currentTime+when;
    var osc=actx.createOscillator(), g=actx.createGain();
    osc.type=type||'square';
    osc.frequency.setValueAtTime(Math.max(20,freq),t0);
    if(to){ osc.frequency.exponentialRampToValueAtTime(Math.max(20,to),t0+dur*0.9); }
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.linearRampToValueAtTime(vol,t0+Math.min(0.02,dur*0.2));
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    osc.connect(g); g.connect(master);
    osc.start(t0); osc.stop(t0+dur+0.03);
  }catch(e){}
}
function noise(when,dur,cut,vol,isHi){
  if(!actx||!master){ return; }
  try{
    if(!nBuf){
      nBuf=actx.createBuffer(1,Math.floor(actx.sampleRate*0.55),actx.sampleRate);
      var d=nBuf.getChannelData(0);
      for(var i=0;i<d.length;i++){ d[i]=(Math.random()*2-1)*0.9; }
    }
    var t0=actx.currentTime+when;
    var src=actx.createBufferSource(); src.buffer=nBuf; src.loop=true;
    var f=actx.createBiquadFilter(); f.type=isHi?'highpass':'lowpass'; f.frequency.setValueAtTime(cut,t0); f.Q.value=1.1;
    var g=actx.createGain();
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.linearRampToValueAtTime(vol,t0+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t0,Math.random()*0.4); src.stop(t0+dur+0.03);
  }catch(e){}
}
function sfxFlap(){
  var p=clamp((bird.vy+260)/720,0,1);
  tone(lerp(470,330,p),0,0.11,'triangle',0.16,540);
  noise(0,0.1,1900+p*900,0.13,true);
}
function sfxScore(){ tone(620,0,0.1,'sine',0.22); tone(940,0.085,0.13,'sine',0.2); tone(1500,0.02,0.07,'sine',0.07); }
function sfxHit(){ noise(0,0.26,420,0.42,false); tone(150,0,0.22,'square',0.3,72); tone(90,0.01,0.12,'sawtooth',0.2,60); }
function sfxDie(){ var n=[420,330,255,190,150]; for(var i=0;i<n.length;i++){ tone(n[i],0.05+i*0.13,0.16,'square',0.2,n[i]*0.82); } tone(110,0.05+n.length*0.13,0.3,'triangle',0.16,80); }
function sfxLand(){ noise(0,0.22,220,0.3,false); tone(130,0,0.13,'sine',0.2,95); }
function sfxMedal(m){
  var base=[523,659,784,1046], i;
  for(i=0;i<base.length;i++){ tone(base[i],0.16+i*0.1,0.2,'triangle',0.17); }
  if(m>=2){ tone(1318,0.16+base.length*0.1,0.22,'triangle',0.15); }
  if(m>=3){ tone(1568,0.16+base.length*0.1+0.1,0.24,'triangle',0.13); }
}

/* ---------- particles -------------------------------------------- */
function addSpark(x,y,n,tier){
  tier=tier||1;
  for(var i=0;i<n;i++){
    parts.push({ k:'spark', x:x, y:y, vx:rnd(-70,70)*tier, vy:rnd(-150,-40)*tier, g:640, r:rnd(2.2,4.6), rot:rnd(0,6.28), spin:rnd(-7,7), life:rnd(0.45,0.85) });
  }
}
function addRing(x,y,rmax,color){ parts.push({ k:'ring', x:x, y:y, r:8, rmax:rmax, life:0.55, color:color||'#ffffff' }); }
function addFloat(x,y,text,color){ parts.push({ k:'float', x:x, y:y, vy:-90, t:text, life:0.9, color:color||'#fff4d6' }); }
function addFeather(x,y,n){
  n=n||3;
  for(var i=0;i<n;i++){ parts.push({ k:'feather', x:x+rnd(-12,12), y:y+rnd(-6,10), vx:rnd(-95,-35), vy:rnd(-60,20), g:220, r:rnd(3,5.2), rot:rnd(0,6.28), spin:rnd(-4,4), ph:rnd(0,6.28), life:rnd(0.7,1.25) }); }
}
function addPuff(x,y,n,tint){
  for(var i=0;i<n;i++){ parts.push({ k:'puff', x:x+rnd(-16,16), y:y+rnd(-14,14), vx:rnd(-130,130), vy:rnd(-165,-40), g:700, r:rnd(6,13), life:rnd(0.35,0.7), tint:tint||null }); }
}
function addDust(x,y,n){
  for(var i=0;i<n;i++){ parts.push({ k:'dust', x:x+rnd(-20,20), y:y+rnd(-6,8), vx:rnd(-150,150), vy:rnd(-120,-30), g:520, r:rnd(2.5,5), life:rnd(0.4,0.85) }); }
}
function updateParts(dt){
  var i,p;
  for(i=parts.length-1;i>=0;i--){
    p=parts[i];
    p.life-=dt;
    if(p.life<=0){ parts.splice(i,1); continue; }
    if(p.k==='spark'){ p.vy+=p.g*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.rot+=p.spin*dt; }
    else if(p.k==='feather'){ p.vy+=p.g*dt; p.vy=Math.min(p.vy,120); p.x+=p.vx*dt+Math.sin(clock*6+p.ph)*18*dt; p.y+=p.vy*dt; p.rot+=p.spin*dt; }
    else if(p.k==='puff'||p.k==='dust'){ p.vy+=p.g*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=Math.pow(0.86,dt*12); }
    else if(p.k==='float'){ p.y+=p.vy*dt; p.vy+=60*dt; }
    else if(p.k==='ring'){ p.r+=(p.rmax-8)*dt*2.4; }
  }
}
function drawParts(){
  var i,p,a;
  for(i=0;i<parts.length;i++){
    p=parts[i]; a=clamp(p.life,0,1);
    if(p.k==='spark'){ starDraw(p.x,p.y,p.r*(0.5+a*0.7),p.rot,col(lite([255,220,120],0.35),a),a,4); }
    else if(p.k==='feather'){
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.fillStyle=col(lite(P.birdWing,0.4),a*0.9);
      ctx.beginPath(); ctx.ellipse(0,0,p.r*1.5,p.r*0.7,0,0,6.2832); ctx.fill(); ctx.restore();
    }
    else if(p.k==='puff'||p.k==='dust'){
      var c=p.tint?mix(p.tint,[255,255,255],0.6):lite(P.dirt,0.45);
      ctx.fillStyle=col(c,a*(p.k==='puff'?0.5:0.75));
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r*(p.k==='puff'?(1+(1-a)*0.8):a+0.5),0,6.2832); ctx.fill();
    }
    else if(p.k==='float'){ txt(p.t,p.x,p.y,20,{fill:p.color,line:'#33232a',lw:0.4,alpha:a}); }
    else if(p.k==='ring'){ ctx.lineWidth=Math.max(1.5,4*a); ctx.strokeStyle=col(lite([255,255,255],0.2),a*0.8); ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.2832); ctx.stroke(); }
  }
}

/* ---------- pipes ------------------------------------------------- */
function spawnPipe(){
  var g=clamp(172-score*2.0,130,172)+rnd(-4,6);
  var lo=70+g/2, hi=GY-54-g/2;
  var c=(hi>lo)?rnd(lo,hi):(GY*0.5);
  pipes.push({ x:W+34, c:c, g:g, side:(Math.random()<0.5?-1:1), leaf:(Math.random()<0.55), flower:(Math.random()<0.38), sway:rnd(0,6.28), passed:false });
}
function pipeRects(p){
  var t=p.c-p.g/2, b=p.c+p.g/2;
  return [
    { x:p.x+6, y:-60, w:PW-12, h:t+60-6 },
    { x:p.x+6, y:b+6, w:PW-12, h:GY-b-6 }
  ];
}
function circleRect(cx,cy,r,R){
  var nx=clamp(cx,R.x,R.x+R.w), ny=clamp(cy,R.y,R.y+R.h);
  var dx=cx-nx, dy=cy-ny;
  return (dx*dx+dy*dy)<r*r;
}

/* ---------- bird physics + animation ----------------------------- */
function wingAnim(dt){
  var b=bird;
  b.flapAge+=dt;
  if(b.flapAge<0.24){ b.wing=lerp(-1.25,0.42,eOQ(win(b.flapAge,0,0.24))); }
  else{ b.wing=0.2+Math.sin(clock*6.2)*0.22+(b.vy>240?0.14:0); }
  var f=b.flapAge, k;
  if(f<0.16){ k=eOQ(win(f,0,0.16)); b.sx=lerp(1.16,1,k); b.sy=lerp(0.88,1,k); }
  else { b.sx=1; b.sy=1; }
  var d=clamp((b.vy-230)/380,0,1);
  b.sx*=(1-0.07*d); b.sy*=(1+0.12*d);
}

/* ---------- score / pipes ---------------------------------------- */
function onScore(p){
  p.passed=true;
  score++; popT=1;
  sfxScore();
  addSpark(p.x+PW/2,p.c,7,1);
  addRing(p.x+PW/2,p.c,34,'#ffffff');
  addFloat(p.x+PW/2,p.c-26,'+1','#fff4d6');
  if(score%5===0){ addSpark(bird.x+8,bird.y-16,9,1.5); }
  speedTarget=205+Math.min(score*3.2,86);
  tipText=pick(TIPS());
}

/* ---------- update ------------------------------------------------ */
function update(dt){
  clock+=dt;
  flash=Math.max(0,flash-dt*2.4);
  shake=Math.max(0,shake-dt*3.2);
  popT=Math.max(0,popT-dt*2.2);
  readyT+=dt;
  overLock=Math.max(0,overLock-dt);
  updateParts(dt);

  // ambient life (runs in every state) ---------------------------
  blinkNext-=dt;
  if(blinkNext<=0){ blinkOn=0.13; blinkNext=rnd(1.9,4.6); }
  blinkOn=Math.max(0,blinkOn-dt);
  trailT-=dt;
  if(trailT<=0 && (state==='play'||state==='ready')){
    parts.push({ k:'puff', x:bird.x-24, y:bird.y+4+rnd(-4,4), vx:-40, vy:rnd(-6,14), g:0, r:rnd(2.5,4.5), life:0.35 });
    trailT=0.07;
  }

  // shooting stars ------------------------------------------------
  shootTimer-=dt;
  if(shootTimer<=0){
    if(shoot && shoot.t>shoot.dur){ shoot=null; shootT=rnd(3,10); shootTimer=shootT; }
    else if(!shoot && getPal(clock/CYCLE).nn>0.6){
      shoot={ x:rnd(W*0.4,W-30), y:rnd(40,190), vx:-rnd(280,520), vy:rnd(20,60), t:0, dur:rnd(0.7,1.1) };
      shootTimer=9999;
    }
  }
  if(shoot){
    shoot.t+=dt; shoot.x+=shoot.vx*dt; shoot.y+=shoot.vy*dt;
    if(Math.random()<0.6){ parts.push({ k:'puff', x:shoot.x, y:shoot.y, vx:-rnd(20,70), vy:rnd(-30,40), g:0, r:rnd(2,4), life:0.3 }); }
  }

  var active=(state==='play');
  var worldSpeed=active?speed:(state==='ready'?178:0);
  speed+=(speedTarget-speed)*Math.min(1,dt*1.6);
  scroll.far+=worldSpeed*0.13*dt;
  scroll.mid+=worldSpeed*0.30*dt;
  scroll.bush+=worldSpeed*0.55*dt;
  scroll.gnd+=worldSpeed*1.00*dt;
  scroll.cloud+=worldSpeed*0.14*dt;
  bird.xp=bird.x; bird.yp=bird.y;

  if(state==='ready'){
    var yy=H*0.47+Math.sin(clock*3.1)*10;
    var ty=yy-Math.sin(clock*1.35)*7;
    bird.y+=(ty-bird.y)*Math.min(1,dt*9);
    bird.vy=Math.cos(clock*3.1)*120;
    bird.rot=lerp(bird.rot,clamp(-bird.vy/620,-0.26,0.3),Math.min(1,dt*7));
    wingAnim(dt);
    if(!pipes.length){ spawnPipe(); }
    movePipes(dt,worldSpeed*0.72);
  }
  else if(state==='play'){
    bird.vy=Math.min(bird.vy+GRAV*dt,MAXFALL);
    bird.y+=bird.vy*dt;
    if(bird.y<8){ bird.y=8; bird.vy=Math.max(bird.vy,140); }
    var tRot=clamp(bird.vy/430,-0.52,1.15);
    bird.rot=lerp(bird.rot,tRot,Math.min(1,dt*9));
    wingAnim(dt);

    nextIn-=dt;
    if(nextIn<=0){ spawnPipe(); var dist=lerp(340,296,clamp(score/22,0,1)); nextIn=dist/speed+rnd(-0.08,0.10); }
    movePipes(dt,speed);

    // scoring + collision ------------------------------------
    var i,p,R,j,rHit=15.2;
    for(i=pipes.length-1;i>=0;i--){
      p=pipes[i];
      if(!p.passed && p.x+PW*0.5<bird.x){ onScore(p); }
      R=pipeRects(p);
      for(j=0;j<R.length;j++){
        if(circleRect(bird.x,bird.y,rHit,R[j])){ die('pipe'); break; }
      }
      if(state!=='play'){ break; }
    }
    if(state==='play' && bird.y+rHit>=GY+22){ die('ground'); }
  }
  else if(state==='dying'){
    bird.vy=Math.min(bird.vy+GRAV*1.2*dt,MAXFALL*1.25);
    bird.y+=bird.vy*dt;
    bird.tumble+=dt*(bird.vy>140?3.4:2.0);
    bird.dizzy=Math.min(1,bird.dizzy+dt*3);
    bird.rot=clamp(bird.tumble*0.9+Math.sin(clock*18)*0.08,-0.6,1.7);
    if(bird.y>=bird.restY){
      if(!bounced && Math.abs(bird.vy)>190){
        bounced=true; bird.vy=-260; bird.y=bird.restY-1;
        sfxLand(); addDust(bird.x,GY+22,9);
        parts.push({ k:'ring', x:bird.x, y:GY+22, r:9, rmax:54, life:0.5 });
      } else {
        bird.vy=0; bird.y=bird.restY; bird.landed=true;
        bird.rot=lerp(bird.rot,0.42,Math.min(1,dt*6));
        dieT+=dt;
        if(dieT>0.30 && clock-diedAt>0.55){ endRun(); }
      }
    }
  }
  else if(state==='over'){ overT=Math.min(1,overT+dt*2.4); bird.rot=lerp(bird.rot,0.42,Math.min(1,dt*6)); }

  pipes=pipes.filter(function(pp){ return pp.x>-PW-46; });
}
function movePipes(dt,sps){
  var i; for(i=pipes.length-1;i>=0;i--){ pipes[i].x-=sps*dt; if(pipes[i].x<-PW-46){ pipes.splice(i,1); } }
}

/* ---------- run flow --------------------------------------------- */
function flap(){
  bird.vy=FLAPV; bird.flapAge=0;
  addFeather(bird.x-10,bird.y,3);
  addRing(bird.x-4,bird.y+6,22,'rgba(255,255,255,0.8)');
  sfxFlap();
}
function die(kind){
  if(state!=='play'){ return; }
  state='dying'; playing=false; diedAt=clock;
  flash=0.72; shake=1;
  bird.tumble=(kind==='pipe')?-0.35:0.25;
  bird.vy=Math.max(-150,bird.vy*0.25);
  addPuff(bird.x,bird.y,10,[255,255,255]);
  addFeather(bird.x,bird.y,4);
  addRing(bird.x,bird.y,46,'#ffffff');
  sfxHit();
  setTimeout(function(){ if(!paused){ sfxDie(); } },120);
}
function endRun(){
  state='over'; overT=0; overLock=0.5;
  newBest=(score>best);
  if(newBest){ best=score; lsSet('flappy.best',Math.round(best)); addSpark(W/2,120,10,1.3); addFloat(W/2,120,'NEW BEST!','#ffdf6b'); }
  medal=(score>=42?3:(score>=28?2:(score>=16?1:(score>=7?0:-1))));
  if(medal>=0){ setTimeout(function(){ if(!paused&&state==='over'){ sfxMedal(medal); } },420); }
}
function resetRun(){
  pipes.length=0; parts.length=0;
  score=0; newBest=false; medal=-1; speed=205; speedTarget=205; nextIn=1.05;
  flash=0; shake=0; popT=0; dieT=0; overT=0; overLock=0;
  bird.x=152; bird.y=H*0.47; bird.vy=0; bird.rot=0; bird.flapAge=9; bird.tumble=0;
  bird.landed=false; bounced=false; bird.dizzy=0; bird.sx=1; bird.sy=1;
}
function startGame(){
  resetRun();
  state='play'; playing=true; paused=false;
  setPauseUI();
  flap();
}
function press(){
  ensureAudio();
  if(state==='ready'){ startGame(); }
  else if(state==='play'){ flap(); }
  else if(state==='over'&&overLock<=0){ state='ready'; readyT=0; resetRun(); }
}
function togglePause(v){
  if(v===undefined){ v=!paused; }
  if(v && state==='ready'){ return; }
  paused=v;
  setPauseUI();
  if(!v){ lastNow=performance.now(); }
}

/* ---------- world drawing ---------------------------------------- */
var P=null;
var vigGrad=null;

function drawSky(p,t){
  var g=ctx.createLinearGradient(0,0,0,GY+28);
  g.addColorStop(0,col(p.skyTop));
  g.addColorStop(0.55,col(p.skyMid));
  g.addColorStop(1,col(p.skyBot));
  ctx.fillStyle=g; ctx.fillRect(-22,-32,W+44,H+64);

  var i,s,a;
  if(p.starA>0.02){
    for(i=0;i<STARS.length;i++){
      s=STARS[i]; a=p.starA*(0.45+0.55*Math.sin(clock*s.sp+s.ph));
      if(a<=0.04){ continue; }
      if(s.big){ starDraw(s.x,s.y,s.r*2.4,clock*0.9+s.ph,'#ffe9b0',a,4); }
      else { ctx.globalAlpha=a; ctx.fillStyle=col(lite([255,255,255],0.7),1); ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.2832); ctx.fill(); ctx.globalAlpha=1; }
    }
  }

  // flocks (daytime) ------------------------------------------
  var flockA=(1-p.nn)*0.55;
  if(flockA>0.06){
    for(i=0;i<FLOCKS.length;i++){
      var fl=FLOCKS[i], fx=((fl.x-clock*fl.sv)%FLP+FLP)%FLP-130, fy=fl.y+Math.sin(clock*1.6+fl.ph)*6;
      if(fx<-60||fx>W+60){ continue; }
      ctx.lineWidth=2; ctx.lineCap='round';
      ctx.strokeStyle=col(mix(p.far,[26,40,70],0.5),flockA);
      for(var j=0;j<fl.n;j++){
        var bx=fx+j*16, by=fy+j*7;
        var flapAmt=Math.sin(clock*7+j*0.9+fl.ph)*2.2;
        ctx.beginPath();
        ctx.moveTo(bx-7,by+flapAmt); ctx.quadraticCurveTo(bx,by-4,bx+7,by+flapAmt);
        ctx.stroke();
      }
    }
  }

  // sun --------------------------------------------------------
  var setK=sstep(win(t,0.20,0.32)), riseK=sstep(win(t,0.74,1));
  var sunA=clamp((1-setK)+riseK,0,1);
  if(sunA>0.03){
    var sy=(t<0.34)?lerp(H*0.13,GY-42,setK):((t>=0.7)?lerp(GY-34,H*0.15,riseK):H*0.15);
    var sx=W*0.72+Math.sin(clock*0.5)*6;
    var hg=ctx.createRadialGradient(sx,sy,6,sx,sy,86);
    hg.addColorStop(0,col(lite(p.warm,0.45),0.42*sunA));
    hg.addColorStop(1,col(p.warm,0));
    ctx.fillStyle=hg; ctx.beginPath(); ctx.arc(sx,sy,86,0,6.2832); ctx.fill();
    ctx.save(); ctx.translate(sx,sy); ctx.rotate(clock*0.35);
    ctx.strokeStyle=col([255,236,150],sunA*0.2); ctx.lineWidth=4; ctx.lineCap='round';
    for(i=0;i<9;i++){ ctx.rotate(Math.PI*2/9); ctx.beginPath(); ctx.moveTo(30,0); ctx.lineTo(43,0); ctx.stroke(); }
    ctx.restore();
    var sg=ctx.createRadialGradient(sx-4,sy-4,2,sx,sy,20);
    sg.addColorStop(0,'#fff7c6'); sg.addColorStop(0.6,'#ffe27a'); sg.addColorStop(1,col(mix(p.warm,[255,210,110],0.4),0.9));
    ctx.fillStyle=sg; ctx.beginPath(); ctx.arc(sx,sy,19,0,6.2832); ctx.fill();
  }

  // moon -------------------------------------------------------
  var mRise=sstep(win(t,0.40,0.50)), mSet=sstep(win(t,0.78,0.92));
  var moonA=clamp(Math.min(mRise,1-mSet*1.15),0,1);
  if(moonA>0.03){
    var my=(t>=0.4&&t<0.5)?lerp(GY-64,H*0.13,mRise):((t>=0.78)?lerp(H*0.13,GY-64,mSet):H*0.13);
    var mx=W*0.28+Math.sin(clock*0.42)*4;
    var mg=ctx.createRadialGradient(mx,my,4,mx,my,70);
    mg.addColorStop(0,col([200,220,255],0.32*moonA)); mg.addColorStop(1,col([200,220,255],0));
    ctx.fillStyle=mg; ctx.beginPath(); ctx.arc(mx,my,70,0,6.2832); ctx.fill();
    ctx.globalAlpha=moonA;
    ctx.fillStyle='#eef3ff'; ctx.beginPath(); ctx.arc(mx,my,15,0,6.2832); ctx.fill();
    ctx.fillStyle=col(mix([220,232,255],p.skyTop,0.35),0.55*moonA);
    ctx.beginPath(); ctx.arc(mx-5,my-4,4.2,0,6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc(mx+4,my+5,3.1,0,6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc(mx+2,my-7,2.4,0,6.2832); ctx.fill();
    ctx.globalAlpha=1;
  }

  // horizon warm haze ------------------------------------------
  if(p.glowA>0.02){
    var wg=ctx.createLinearGradient(0,GY-210,0,GY+28);
    wg.addColorStop(0,col(p.warm,0));
    wg.addColorStop(1,col(p.warm,p.glowA*0.75));
    ctx.fillStyle=wg; ctx.fillRect(-22,GY-210,W+44,238);
  }
}

function drawFarRidge(p){
  ctx.beginPath();
  ctx.moveTo(-26,GY+30);
  for(var x=-26;x<=W+26;x+=13){ ctx.lineTo(x,ridgeY(x+scroll.far)); }
  ctx.lineTo(W+26,GY+2);
  ctx.closePath();
  ctx.fillStyle=col(mix(p.far,p.skyBot,0.3)); ctx.fill();
  var minY=GY+30,i,x,y;
  for(x=-26;x<=W+26;x+=13){ y=ridgeY(x+scroll.far); if(y<minY){ minY=y; } }
  var g=ctx.createLinearGradient(0,minY,0,minY+96);
  g.addColorStop(0,col(lite(p.far,0.5),0.85)); g.addColorStop(1,col(lite(p.far,0.1),0));
  ctx.fillStyle=g; ctx.fill();
}

function drawHills(p,t){
  ctx.beginPath();
  ctx.moveTo(-26,GY+8);
  for(var x=-26;x<=W+26;x+=11){ ctx.lineTo(x,hillYAt(x+scroll.mid)); }
  ctx.lineTo(W+26,GY+2);
  ctx.closePath();
  ctx.fillStyle=col(p.mid); ctx.fill();

  // crest highlight -------------------------------------------
  ctx.lineWidth=3; ctx.lineJoin='round';
  ctx.strokeStyle=col(lite(p.mid,0.42),0.5);
  ctx.beginPath();
  for(x=-26;x<=W+26;x+=11){ var y=hillYAt(x+scroll.mid); if(x===-26){ ctx.moveTo(x,y); } else { ctx.lineTo(x,y); } }
  ctx.stroke();

  // pine silhouettes -------------------------------------------
  var step=27, base=-(scroll.mid%step);
  var i0=Math.floor(scroll.mid/step);
  for(var k=-1;k<Math.ceil(W/step)+2;k++){
    var sx=base+k*step, idx=i0+k;
    var hsh=hashF(idx);
    if(hsh<0.62){ continue; }
    var wx=sx+scroll.mid;
    var hy=hillYAt(wx)-2;
    var hgt=13+hsh*10, wid=hgt*0.62;
    ctx.fillStyle=col(mix(p.tree,p.skyBot,0.28),0.95);
    ctx.beginPath();
    ctx.moveTo(sx-wid/2,hy-hgt*0.5); ctx.lineTo(sx+wid/2,hy-hgt*0.5); ctx.lineTo(sx,hy-hgt); ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(sx-wid*0.42,hy); ctx.lineTo(sx+wid*0.42,hy); ctx.lineTo(sx,hy-hgt*0.72); ctx.closePath(); ctx.fill();
  }

  // windmills --------------------------------------------------
  tileRun(scroll.mid,WINDW,WINDS,function(wm,ox){
    var x=ox+wm.x;
    if(x<-70||x>W+70){ return; }
    var hy=hillYAt(x+scroll.mid)+4, top=hy-wm.h;
    ctx.fillStyle=col(dark(p.mid,0.5),0.9);
    ctx.fillRect(x-2.4,top,4.8,wm.h);
    ctx.beginPath(); ctx.arc(x,top,6.4,0,6.2832); ctx.fill();
    ctx.save(); ctx.translate(x,top); ctx.rotate(clock*1.3+wm.ph);
    ctx.strokeStyle=col(dark(p.mid,0.62),0.92); ctx.lineWidth=2.6; ctx.lineCap='round';
    for(var b=0;b<4;b++){ ctx.rotate(Math.PI/2); ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(13,0); ctx.stroke(); }
    ctx.restore();
  });
}

function drawClouds(p){
  tileRun(scroll.cloud,CLOUDW,CLOUDS,function(c,ox){
    var x=ox+c.x;
    if(x<-150||x>W+150){ return; }
    ctx.globalAlpha=p.cloudA;
    ctx.fillStyle=col(p.cloud,1);
    var i,b;
    for(i=0;i<c.b.length;i++){ b=c.b[i]; ctx.beginPath(); ctx.arc(x+b[0]*c.s,GY?0:0,0,0,0); ctx.fill(); }
    ctx.globalAlpha=1;
  });
}

/* ---------- bushes, ground, pipes -------------------------------- */
function drawBushes(p){
  tileRun(scroll.bush,BUSHW,BUSHES,function(bst,ox,i){
    var x=ox+bst.x;
    if(x>W+140||x+bst.w<-140){ return; }
    var sway=Math.sin(clock*1.4+bst.sway)*2;
    ctx.fillStyle=col(p.bush);
    ctx.beginPath();
    var j,c0=bst.bumps[0];
    ctx.moveTo(x,LIPY0+12);
    ctx.lineTo(x+c0.dx-c0.r*0.5,LIPY0-2);
    for(j=0;j<bst.bumps.length;j++){
      var cc=bst.bumps[j];
      ctx.lineTo(cc.dx+x+sway*0.4,cc.y?cc.y:0);
    }
    ctx.closePath();
    ctx.fill();
  });
}

function drawGround(p){
  // grass lip
  ctx.beginPath();
  ctx.moveTo(-26,GY+28);
  for(var x=-26;x<=W+26;x+=9){ ctx.lineTo(x,lipAt(x+scroll.gnd)); }
  ctx.lineTo(W+26,H+32); ctx.lineTo(-26,H+32); ctx.closePath();
  ctx.fillStyle=col(p.grass); ctx.fill();

  // brighter top band
  ctx.beginPath();
  ctx.moveTo(-26,lipAt(0));
  for(x=-26;x<=W+26;x+=9){ ctx.lineTo(x,lipAt(x+scroll.gnd)); }
  ctx.lineTo(W+26,LIPY0+24); ctx.lineTo(-26,LIPY0+24); ctx.closePath();
  ctx.fillStyle=col(lite(p.grass,0.5),0.75); ctx.fill();

  // dirt + wavy seam
  var dg=ctx.createLinearGradient(0,LIPY0+22,0,H);
  dg.addColorStop(0,col(p.dirt)); dg.addColorStop(0.65,col(dark(p.dirt,0.15))); dg.addColorStop(1,col(dark(p.dirt,0.32)));
  ctx.beginPath();
  ctx.moveTo(-26,LIPY0+20);
  for(x=-26;x<=W+26;x+=10){ ctx.lineTo(x,LIPY0+20+Math.sin(Math.abs(x+scroll.gnd)*-0.018+1.6)*4+Math.sin(Math.abs(x+scroll.gnd)*-0.047+3.1)*3); }
  ctx.lineTo(W+26,H); ctx.lineTo(-26,H); ctx.closePath();
  ctx.fillStyle=dg; ctx.fill();

  ctx.fillStyle=col(dark(p.dirt,0.5),0.9);
  ctx.fillRect(-26,H-20,W+52,26);

  // decorations
  tileRun(scroll.gnd,GW,GD,function(gd,ox){
    var x=ox+gd.x+gd.dx;
    if(x<-30||x>W+30){ return }
    var ly=lipAt(x+scroll.gnd)+gd.s*2;
    if(gd.k===0){          // grass tuft
      ctx.strokeStyle=col(lite(p.grass,0.42),0.9); ctx.lineWidth=2; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(x,ly); ctx.lineTo(x-4,ly-gd.s*11); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x+3,ly); ctx.lineTo(x+7,ly-gd.s*9); ctx.stroke();
    } else if(gd.k===1){   // flower
      var fcol=mix([255,180,215],[120,120,180],p.nn*0.55);
      var sway=Math.sin(clock*2.4+gd.ph)*1.6;
      ctx.strokeStyle=col(dark(p.grass,0.15),0.9); ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(x,ly); ctx.lineTo(x+sway,ly-gd.s*12); ctx.stroke();
      starDraw(x+sway,ly-gd.s*12,gd.s*5,Math.sin(clock*1.1+gd.ph)*0.3,col(fcol,0.95),0.95,5);
      ctx.fillStyle=col(mix([255,225,120],[180,180,220],p.nn*0.5),0.95);
      ctx.beginPath(); ctx.arc(x+sway,ly-gd.s*12,gd.s*2.1,0,6.2832); ctx.fill();
    } else if(gd.k===2){   // pebble
      ctx.fillStyle=col(lite(p.dirt,0.28),0.85);
      ctx.beginPath(); ctx.ellipse(x,ly-gd.s*2,gd.s*5,gd.s*3,0,0,6.2832); ctx.fill();
    } else if(gd.k===3){   // dirt dashes
      ctx.fillStyle=col(dark(p.dirt,0.4),0.4);
      ctx.fillRect(x,LIPY0+34+gd.s*16,gd.s*14,3);
    } else {               // fossil swirl
      ctx.strokeStyle=col(lite(p.dirt,0.35),0.7); ctx.lineWidth=2; ctx.lineCap='round';
      var cy=LIPY0+40+gd.s*18;
      ctx.beginPath(); ctx.arc(x,cy,gd.s*5,0.3,2.3); ctx.stroke();
      ctx.beginPath(); ctx.arc(x,cy,gd.s*3,2.6,4.9); ctx.stroke();
    }
  });

  // flowers on bushes
  tileRun(scroll.bush,BUSHW,BUSHES,function(bst,ox){
    var x=ox+bst.x;
    if(x>W+140||x+bst.w<-140||!bst.flowers.length){ return; }
    var sway=Math.sin(clock*1.6+bst.sway)*2;
    for(var i=0;i<bst.flowers.length;i++){
      var f=bst.flowers[i];
      var fc=mix([255,200,235],[130,140,200],P.nn*0.6);
      starDraw(x+f.dx+sway,LIPY0-f.dy,f.r,clock*0.7+f.dx,col(fc,0.8),0.8,5);
    }
  });

  if(P.nn>0.35){ drawFireflies(); }
}

function drawFireflies(){
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  var a=P.nn;
  tileRun(FFP*0.25,FFP,FF,function(f,ox){
    var x=((f.x-ox-clock*f.vx)%FFP+FFP)%FFP-70;
    var y=f.y+Math.sin(clock*f.sp+f.ph)*f.amp;
    var tw=0.35+0.65*Math.max(0,Math.sin(clock*f.sp*2.2+f.ph));
    if(x<-40||x>W+40){ return; }
    ctx.fillStyle=col(mix([255,240,140],[190,255,190],hashF(f.ph*10)),a*tw*0.5);
    ctx.beginPath(); ctx.arc(x,y,f.r*3.2,0,6.2832); ctx.fill();
    ctx.fillStyle=col([255,248,170],a*tw);
    ctx.beginPath(); ctx.arc(x,y,f.r,0,6.2832); ctx.fill();
  });
  ctx.restore();
}

/* ---------- pipes ------------------------------------------------ */
function drawLeaves(x,y,side,sway,nn){
  var stem=18;
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(side*(0.18+sway*0.05));
  ctx.strokeStyle=col(dark([70,140,70],nn*0.4),0.95); ctx.lineWidth=3; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(side*6,stem*0.6,side*13,stem); ctx.stroke();
  var lc=mix([120,205,95],[60,110,150],nn*0.5);
  leafShape(side*13,stem,9,side*0.7);
  ctx.fillStyle=col(lc,0.95); ctx.fill();
  leafShape(side*8,stem*0.62,6,side*0.4);
  ctx.fillStyle=col(lite(lc,0.25),0.9); ctx.fill();
  ctx.restore();
}
function leafShape(x,y,r,skew){
  ctx.beginPath();
  ctx.moveTo(x,y);
  ctx.bezierCurveTo(x-skew*r*0.9,y-r*0.9,x+skew*r*0.2,y-r*1.5,x+r*0.9,y-r*0.4);
  ctx.bezierCurveTo(x+r*0.5,y+r*0.6,x-skew*r*0.4,y+r*0.8,x,y);
  ctx.closePath();
}
function drawFlower(cx,cy,r,rot,nn){
  var pc=mix([255,196,232],[110,130,200],nn*0.6);
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(rot);
  ctx.fillStyle=col(pc,0.95);
  for(var i=0;i<5;i++){
    ctx.rotate(Math.PI*2/5);
    ctx.beginPath(); ctx.ellipse(r*0.75,0,r*0.55,r*0.34,0,0,6.2832); ctx.fill();
  }
  ctx.restore();
  ctx.fillStyle=col(mix([255,228,120],[190,200,240],nn*0.5),0.95);
  ctx.beginPath(); ctx.arc(cx,cy,r*0.32,0,6.2832); ctx.fill();
}

function drawPipeBody(p,x,topY,botY){
  var hgt=botY-topY;
  if(hgt<=2){ return; }
  var g=ctx.createLinearGradient(x,0,x+PW,0);
  g.addColorStop(0,col(dark(p.pipe,0.18)));
  g.addColorStop(0.3,col(lite(p.pipe,0.3)));
  g.addColorStop(1,col(dark(p.pipe,0.26)));
  fillRR(x,topY,PW,hgt,11,undefined);
  ctx.fillStyle=g; ctx.fill();
  frameRR(x+1.5,topY,PW-3,hgt-3,10,col(dark(p.pipe,0.5),0.6),3);
  ctx.fillStyle=col(lite(p.pipe,0.55),0.38);
  fillRR(x+7,topY+6,11,hgt-12,5,undefined); ctx.fill();
}

function drawCap(p,x,y,isTop){
  var cx=x-POVER,cw=PW+POVER*2;
  var cy=isTop?(y-CAPH+4):y;
  var g=ctx.createLinearGradient(cx,0,cx+cw,0);
  g.addColorStop(0,col(dark(p.pipe,0.22)));
  g.addColorStop(0.3,col(lite(p.pipe,0.42)));
  g.addColorStop(1,col(dark(p.pipe,0.3)));
  fillRR(cx,cy,cw,CAPH,9,undefined); ctx.fillStyle=g; ctx.fill();
  frameRR(cx+1.5,cy+1.5,cw-3,CAPH-3,8,col(dark(p.pipe,0.55),0.6),3);
  ctx.lineWidth=3; ctx.lineCap='round';
  ctx.strokeStyle=col(lite(p.pipe,0.62),0.55);
  ctx.beginPath();
  if(isTop){ ctx.moveTo(cx+5,cy+CAPH-5); ctx.lineTo(cx+cw-5,cy+CAPH-5); }
  else{ ctx.moveTo(cx+5,cy+4); ctx.lineTo(cx+cw-5,cy+4); }
  ctx.stroke();
}

function drawPipeSet(p,pal){
  var t=p.c-p.g/2, b=p.c+p.g/2, x=p.x;
  if(t>6){ drawPipeBody(p,x,-46,t); drawCap(p,x,t,true); }
  drawPipeBody(p,x,b,GY+24); drawCap(p,x,b,false);
  var sway=Math.sin(clock*1.7+p.sway)*0.25;
  if(p.leaf){ drawLeaves(x+(p.side<0?6:PW-6), (p.side<0?t+8:b+CAPH+8), p.side, sway, pal.nn); }
  if(p.flower){ drawFlower(x+PW/2+p.side*13, GY+22, 11, sway*0.5, pal.nn); }
}

/* ---------- bird ------------------------------------------------- */
function spiralEye(cx,cy,r,a){
  ctx.strokeStyle=col(P.outline,a); ctx.lineWidth=2.2; ctx.lineCap='round';
  ctx.beginPath();
  var n=18,i,ang,rad,px,py;
  for(i=0;i<=n;i++){ ang=(i/n)*Math.PI*3.4; rad=r*(1-i/n*0.68); px=cx+Math.cos(ang)*rad; py=cy+Math.sin(ang)*rad; if(i===0){ ctx.moveTo(px,py); } else { ctx.lineTo(px+Math.cos(ang)*0.6,py+Math.sin(ang)*0.6); } }
  ctx.stroke();
}
function dizzyStars(){
  var i,n=3;
  for(i=0;i<n;i++){
    var a=clock*2.4+i*(6.2832/n), r=27+Math.sin(clock*3+i)*4;
    starDraw(bird.x-6+Math.cos(a)*r,bird.y-22+Math.sin(a)*r*0.55,4.6,a,'#ffd95e',0.75+0.2*Math.sin(clock*6+i),4);
  }
}
function drawBird(){
  var b=bird,nn=P.nn,i,a;
  // ground shadow
  if(state==='ready'||state==='play'){
    var hgt=clamp((GY+22-b.y)/(GY*0.7),0,1);
    ctx.fillStyle=col([20,40,30],0.16*(1-hgt)+0.04);
    ctx.beginPath(); ctx.ellipse(b.x,GY+24,16*(1-hgt*0.35),4.5,0,0,6.2832); ctx.fill();
  }

  var dead=(state==='dying'||state==='over');
  var rot=b.rot+(dead?Math.sin(clock*20)*0.02:0);
  ctx.save();
  ctx.translate(b.x,b.y); ctx.rotate(rot); ctx.scale(b.sx,b.sy);
  var o=col(P.outline,1), ow=Math.max(2.1,2.5*(1-nn*0.35));

  ctx.lineJoin='round'; ctx.lineCap='round';

  // tail
  ctx.fillStyle=col(dark(P.birdWing,0.1+nn*0.25));
  var tw=Math.sin(clock*8.5+(b.flapAge<0.25?0:1.4))*2;
  ctx.beginPath(); ctx.moveTo(-9,-3); ctx.lineTo(-21,-2+tw); ctx.quadraticCurveTo(-15,6,-7,4); ctx.closePath(); ctx.fill();

  // far wing
  ctx.fillStyle=col(dark(P.birdWing,0.3+nn*0.25),0.9);
  ctx.save(); ctx.translate(-7,2); ctx.rotate(-b.wing*0.75-0.22);
  ctx.beginPath(); ctx.ellipse(0,0,10,6,0,0,6.2832); ctx.fill(); ctx.restore();

  // dangling feet when diving fast
  if(b.vy>170&&!dead){
    var fa=clamp((b.vy-170)/320,0,1)*0.9;
    ctx.strokeStyle=col(dark(P.birdBeak,0.1+nn*0.3),fa); ctx.lineWidth=2.4;
    for(i=0;i<2;i++){
      var fx=-2+i*7,fy=13,sy=Math.sin(clock*12+i)*2;
      ctx.beginPath(); ctx.moveTo(fx,fy-2); ctx.lineTo(fx-2,sy?fy+7:fy+9); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(fx-2,sy?fy+7:fy+9); ctx.lineTo(fx+3,sy?fy+8:fy+10); ctx.stroke();
    }
  }

  // body
  var bg=ctx.createLinearGradient(0,-16,0,14);
  bg.addColorStop(0,col(lite(P.birdMain,0.28))); bg.addColorStop(0.55,col(P.birdMain)); bg.addColorStop(1,col(dark(P.birdMain,0.22+nn*0.2)));
  ctx.beginPath(); ctx.ellipse(-1,1,18.5,16.2,0,0,6.2832);
  ctx.fillStyle=bg; ctx.fill();
  ctx.strokeStyle=o; ctx.lineWidth=ow; ctx.stroke();

  // belly
  ctx.fillStyle=col(lite(P.birdBelly,0.25-nn*0.12),0.9);
  ctx.beginPath(); ctx.ellipse(2,7,12,7.6,-0.12,0,6.2832); ctx.fill();

  // blush
  ctx.fillStyle=col(P.birdCheek,clamp(0.5-nn*0.22,0.2,0.6));
  ctx.beginPath(); ctx.arc(7.5,4.5,4,0,6.2832); ctx.fill();

  // near wing
  var wAng=b.wing+(dead?Math.sin(clock*7)*0.12:0);
  ctx.save(); ctx.translate(-3,-2); ctx.rotate(wAng);
  var wg=ctx.createLinearGradient(0,-8,0,8);
  wg.addColorStop(0,col(lite(P.birdWing,0.32-nn*0.14))); wg.addColorStop(1,col(dark(P.birdWing,0.2+nn*0.22)));
  ctx.beginPath(); ctx.ellipse(-4,0,12.5,7.4,-0.1,0,6.2832);
  ctx.fillStyle=wg; ctx.fill();
  ctx.strokeStyle=o; ctx.lineWidth=Math.max(1.8,ow*0.8); ctx.stroke();
  ctx.lineWidth=2; ctx.strokeStyle=col(lite(P.birdWing,0.5),0.5);
  ctx.beginPath(); ctx.arc(-4,0,9.4,-0.7,0.4); ctx.stroke();
  ctx.restore();

  // crest strands
  ctx.strokeStyle=o; ctx.lineWidth=2.4;
  ctx.beginPath(); ctx.moveTo(-2,-15); ctx.quadraticCurveTo(-5,-24,-8,-22); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-1,-14); ctx.quadraticCurveTo(1,-22,4,-21); ctx.stroke();

  // beak
  var openAmt=(dead?0:clamp((b.vy+320)/640,0,1)*0.35+(state==='ready'?0.12:0));
  ctx.save(); ctx.translate(15,2);
  ctx.beginPath();
  ctx.moveTo(-4,-5-openAmt*2);
  ctx.quadraticCurveTo(6,-7-openAmt*4,12,-2-openAmt*3);
  ctx.lineTo(13,0);
  ctx.lineTo(5,4+openAmt*2);
  ctx.closePath();
  ctx.fillStyle=col(P.birdBeak); ctx.fill();
  ctx.strokeStyle=o; ctx.lineWidth=Math.max(1.8,ow*0.8); ctx.stroke();
  ctx.fillStyle=col(dark(P.birdBeak,0.35),0.85);
  ctx.beginPath(); ctx.moveTo(-2,0); ctx.quadraticCurveTo(6,1+openAmt*2,12,0); ctx.lineTo(4,4+openAmt*3); ctx.closePath(); ctx.fill();
  ctx.restore();

  // eyes
  var lidDown=(state==='ready')?0.18:0;
  var blink=(blinkOn>0&&!dead)?1:0;
  if(dead){
    spiralEye(6,-6,5.2,clamp(b.dizzy,0,1));
    spiralEye(15,-2,4.4,clamp(b.dizzy,0,1)*0.9);
  } else {
    for(i=0;i<2;i++){
      a=i?15:6;
      var ey=-7+(i?-1:0)+(i?lidDown*0:liftof(i));
      var ex=a, eyy=-7+(i?-1:0)+liftOf(i), rw=5.2-i*0.2, rh=5.6-i*0.2;
      if(blink){
        ctx.strokeStyle=o; ctx.lineWidth=2.2; ctx.lineCap='round';
        ctx.beginPath(); ctx.arc(ex,eyy,rw*0.9,Math.PI*0.18,Math.PI*0.82,true); ctx.stroke();
        continue;
      }
      ctx.fillStyle='#ffffff';
      ctx.beginPath(); ctx.ellipse(ex,eyy,rw,rh,0,0,6.2832); ctx.fill();
      ctx.strokeStyle=col(dark(P.outline,0.1),0.55); ctx.lineWidth=1.4; ctx.stroke();
      var lookx=clamp((b.vy-40)/420,-0.2,0.22);
      ctx.fillStyle='#1e1723';
      ctx.beginPath(); ctx.arc(ex+1.1+lookx*rw,eyy+0.6+(state==='ready'?lidDown:0),rw*0.52,0,6.2832); ctx.fill();
      ctx.fillStyle='#ffffff';
      ctx.beginPath(); ctx.arc(ex-1.1,eyy-2,rw*0.3,0,6.2832); ctx.fill();
      if(i===1&&state==='play'){
        ctx.strokeStyle=o; ctx.lineWidth=1.8; ctx.lineCap='round';
        for(var lash=0;lash<2;lash++){ ctx.beginPath(); ctx.moveTo(ex-2+lash*1.6,eyy-rh*0.85); ctx.lineTo(ex-3.2+lash*1.6,eyy-rh*1.35); ctx.stroke(); }
      }
    }
  }

  ctx.restore();
  if(dead&&(bird.landed||state==='over')){ dizzyStars(); }
}
function liftOf(i){ return (i?-0.4:-0.6); }

/* ---------- overlays / HUD --------------------------------------- */
function chip(cx,cy,text,size,alpha){
  ctx.save();
  ctx.font=fontStr(size,800);
  var wpx=ctx.measureText(String(text)).width, pad=size*0.72;
  if(!(wpx>0)){ wpx=text.length*size*0.62; }
  ctx.globalAlpha=(alpha===undefined?1:alpha);
  fillRR(cx-(wpx/2+pad),cy-size*0.56,wpx+pad*2,size*1.14,size*0.5,'rgba(40,28,34,0.5)');
  ctx.fillStyle='rgba(255,255,255,0.28)'; rr(cx-(wpx/2+pad),cy-size*0.56,wpx+pad*2,size*1.14,size*0.5); ctx.fill();
  txt(String(text),cx,cy,size,{fill:'#fff2dd',line:'rgba(255,255,255,0.25)',lw:0.16,alpha:(alpha===undefined?1:alpha)});
  ctx.restore();
}

function drawHUD(p){

  }
  txt('READY?',W/2,y+42,40,{fill:'#4a3327',line:'rgba(255,255,255,0.85)',lw:0.42});

  ctx.save(); ctx.translate(W/2,y+h+26+bounce); ctx.globalAlpha=0.9;
  ctx.strokeStyle='#ffe9c2'; ctx.lineWidth=6; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.shadowColor='rgba(28,20,26,0.5)'; ctx.shadowBlur=8;
  ctx.beginPath(); ctx.moveTo(-14,-12); ctx.lineTo(0,4); ctx.lineTo(14,-12); ctx.stroke();
  ctx.restore();
}

function drawMedal(cx,cy,r,tier){
  var names=['Bronze','Silver','Gold','Platinum'];
  var cols=[['#b6714a','#e0a072'],['#8ba1bd','#dfe9f6'],['#c99a2c','#ffe9a0'],['#7fb3d9','#eaf6ff']];
  if(tier<0){
    ctx.strokeStyle='rgba(40,30,36,0.35)'; ctx.lineWidth=3; ctx.setLineDash([6,6]);
    ctx.beginPath(); ctx.arc(cx,cy,r,0,6.2832); ctx.stroke(); ctx.setLineDash([]);
    txt('–',cx,cy,24,{fill:'rgba(255,255,255,0.7)',line:'rgba(40,30,36,0.35)',lw:0.3});
    txt('no medal',cx,cy+r+16,14,{fill:'#8a6b57',line:'rgba(255,255,255,0.4)',lw:0.16,weight:700});
    return;
  }
  var base=hx(cols[tier][0]), hi=lite(hx(cols[tier][1]),0.25);
  var g=ctx.createRadialGradient(cx-r*0.35,cy-r*0.35,r*0.15,cx,cy,r);
  g.addColorStop(0,col(lite(base,0.5))); g.addColorStop(0.55,col(base)); g.addColorStop(1,col(dark(base,0.35)));
  fillRR(cx-r,r?0:0,0,0,0,undefined);
  ctx.beginPath(); ctx.arc(cx,cy,r,0,6.2832); ctx.fillStyle=g; ctx.fill();
  frameRR(cx-r+3,cy-r+3,(r-3)*2,(r-3)*2,r-3,col(dark(base,0.5),0.55),3);
  ctx.lineWidth=r*0.16; ctx.lineCap='round';
  ctx.strokeStyle=col(lite(hi,0.4),0.65);
  ctx.beginPath(); ctx.arc(cx,cy,r*0.78,-2.4,-1.0); ctx.stroke();
  starDraw(cx,cy,r*0.5,clock*0.8+lite(base,0.4)?0:0,col(lite(hi,0.5),0.9),0.9,5);
  txt(names[tier].toUpperCase(),cx,cy+r+16,15,{fill:'#fff3e2',line:'rgba(40,30,36,0.5)',lw:0.26});
}

function statBox(x,y,w,h,label,value,isBest,newbest){
  fillRR(x,y,w,h,14,'rgba(255,255,255,0.22)');
  frameRR(x+2,y+2,w-4,h-4,12,'rgba(255,255,255,0.35)',2);
  txt(label,x+w/2,y+16,13,{fill:'#ffe9c9',line:'rgba(40,30,36,0.35)',lw:0.16,weight:800});
  txt(value,x+w/2,y+h*0.62,30,{fill:'#fff8ea',line:'rgba(40,30,36,0.5)',lw:0.5,weight:900,shadow:8});
  if(newbest){
    var pu=1+0.12*Math.sin(clock*8);
    ctx.save();
    ctx.translate(x+w-18,y+12); ctx.rotate(-0.18); ctx.scale(pu,pu);
    rr(-30,-12,60,22,8); ctx.fillStyle='rgba(255,110,120,0.95)'; ctx.fill();
    frameRR(-28,-10,56,18,7,'rgba(255,255,255,0.55)',2);
    txt('NEW!',0,0,14,{fill:'#fff',line:'rgba(120,30,40,0.4)',lw:0.22});
    ctx.restore();
  }
}

function drawOver(p){
  ctx.fillStyle='rgba(24,20,34,'+(0.3+clamp(overT,0,1)*0.14).toFixed(3)+')';
  ctx.fillRect(-22,-32,W+44,H+64);
  var e=eOB(clamp(overT,0,1));
  var w=330,h=252,x=W/2-w/2,y=(H*0.24)-34+(34+10)*e;
  var s=lerp(0.9,1,e);
  ctx.save();
  ctx.translate(x+w/2,y+h/2); ctx.scale(s,s); ctx.translate(-(x+w/2),-(y+h/2));
  ctx.globalAlpha=clamp(overT*1.8,0,1);

  rr(x,y,w,h,24);
  var cg=ctx.createLinearGradient(0,y,0,y+h);
  cg.addColorStop(0,col(mix([255,248,232],[210,225,250],p.nn*0.4)));
  cg.addColorStop(1,col(mix([255,228,196],[170,195,235],p.nn*0.4)));
  ctx.fillStyle=cg; ctx.fill();
  frameRR(x+3,y+3,w-6,h-6,21,'rgba(255,255,255,0.6)',3);

  // ribbon
  fillRR(x+16,y+12,w-32,44,12,undefined);
  ctx.fillStyle=col(mix(hx('#ff8a70'),dark(hx('#ff8a70'),0.25+p.nn*0.35),0.35),0.98); ctx.fill();
  frameRR(x+18,y+14,w-36,40,11,'rgba(255,255,255,0.5)',2);
  txt('GAME OVER',W/2,y+34,24,{fill:'#fff',line:'rgba(60,20,30,0.35)',lw:0.22,weight:900});

  drawMedal(x+62,y+96,30,medal);
  statBox(x+w-138,y+60,112,56,'SCORE',String(score),false,false);
  statBox(x+w-138,y+126,112,56,'BEST',String(Math.round(best)),true,newBest);

  // dotted divider
  ctx.fillStyle='rgba(40,30,36,0.22)';
  for(var dxx=x+22;dxx<x+w-22;dxx+=12){ ctx.beginPath(); ctx.arc(dxx,y+192,2.2,0,6.2832); ctx.fill(); }

  // replay button
  var bx=W/2,by=y+h-42,r=27;
  var pu=1+0.045*Math.sin(clock*3.2);
  var i;
  for(i=0;i<3;i++){
    var aa=clock*1.1+i*(6.2832/3);
    starDraw(bx+Math.cos(aa)*(r+16),by+Math.sin(aa)*(r+16)*0.9,5,aa,'#ffd95e',0.55+0.3*Math.sin(clock*4+i),4);
  }
  ctx.save(); ctx.translate(bx,by); ctx.scale(pu,pu);
  var bg2=ctx.createRadialGradient(-8,-9,3,0,0,r);
  bg2.addColorStop(0,col(lite(P.warm,0.5),1)); bg2.addColorStop(1,col(mix(hx('#f5b13f'),dark(hx('#f5b13f'),0.2),p.nn*0.3),1));
  ctx.beginPath(); ctx.arc(0,0,r,0,6.2832); ctx.fillStyle=bg2; ctx.fill();
  frameRR(-r+2,-r+2,(r-2)*2,(r-2)*2,r-2,'rgba(60,30,20,0.5)',3);
  ctx.strokeStyle='#fff6dd'; ctx.lineWidth=3.4; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.beginPath(); ctx.arc(0,0,r*0.55,Math.PI*1.12,Math.PI*1.86,false); ctx.stroke();
  var endAng=Math.PI*1.86, ex=Math.cos(endAng)*r*0.55, ey=Math.sin(endAng)*r*0.55;
  ctx.beginPath(); ctx.moveTo(ex-5,ey-3); ctx.lineTo(ex+5,ey-1); ctx.lineTo(ex-1,ey+7); ctx.closePath(); ctx.fillStyle='#fff6dd'; ctx.fill();
  txt('again',0,r+14,13,{fill:'#ffe9c9',line:'rgba(40,30,36,0.45)',lw:0.2,weight:800});
  ctx.restore();

  ctx.globalAlpha=1;
  ctx.restore();

  // pulsing tap hint + tip below the card
  var bot=y+h;
  if(overLock<=0){
    chip(W/2,bot+26,'tap anywhere to fly again',19,0.55+0.4*Math.abs(Math.sin(clock*2.6)));
  } else {
    chip(W/2,bot+26,'scoring… nice try!',19,0.85);
  }
  ctx.save(); ctx.font=fontStr(14,700);
  var tw=ctx.measureText(tipText).width; if(!(tw>0)){ tw=tipText.length*8; }
  fillRR(W/2-(tw/2+12),bot+44,tw+24,24,12,'rgba(40,30,36,0.35)');
  txt('tip · '+tipText,W/2,bot+56,14,{fill:'#ffe9c9',line:'rgba(40,30,36,0.25)',lw:0.14,weight:700});
  ctx.restore();
}

function drawPause(){
  ctx.fillStyle='rgba(24,20,34,0.5)'; ctx.fillRect(-22,-32,W+44,H+64);
  txt('PAUSED',W/2,H*0.4,46,{fill:'#fff2dd',line:'rgba(40,30,36,0.6)',lw:0.5,shadow:10});
  chip(W/2,H*0.4+64,'tap / space to resume',20,0.55+0.4*Math.abs(Math.sin(clock*2.2)));
}

function drawShootingStar(){
  if(!shoot){ return; }
  var a=clamp(1-shoot.t/shoot.dur,0,1)*getPal(clock/CYCLE).starA;
  if(a<=0.05){ return; }
  var tx=shoot.x-shoot.vx*0.12, ty=shoot.y-shoot.vy*0.12;
  var g=ctx.createLinearGradient(shoot.x,shoot.y,tx,ty);
  g.addColorStop(0,col([255,255,255],a));
  g.addColorStop(1,col(mix([200,220,255],[180,200,255],0.5),0));
  ctx.strokeStyle=g; ctx.lineWidth=2.6; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(shoot.x,shoot.y); ctx.lineTo(tx,ty); ctx.stroke();
  starDraw(shoot.x,shoot.y,5,clock*4,'#ffffff',a,4);
}

function drawVignette(){
  if(!vigGrad){
    vigGrad=ctx.createRadialGradient(W/2,H*0.44,Math.min(W,H)*0.34,W/2,H*0.5,Math.hypot(W,H)*0.62);
    vigGrad.addColorStop(0,'rgba(0,0,0,0)');
    vigGrad.addColorStop(1,'rgba(40,24,34,0.30)');
  }
  ctx.fillStyle=vigGrad; ctx.fillRect(-22,-32,W+44,H+64);
}

/* ---------- frame ------------------------------------------------ */
function draw(){
  var pal=getPal(clock/CYCLE);
  P=pal;
  var t=(clock%CYCLE)/CYCLE;
  var sh=(shake>0)?shake*11:0;
  ctx.save();
  if(sh>0){ ctx.translate(rnd(-sh,sh),rnd(-sh,sh)); }

  drawSky(pal,t);
  drawFarRidge(pal);
  drawHills(pal,t);
  drawClouds(pal);
  drawBushes(pal);
  drawGround(pal);
  var i; for(i=0;i<pipes.length;i++){ drawPipeSet(pipes[i],pal); }
  drawBird();
  drawParts();
  drawShootingStar();

  if(flash>0){ ctx.fillStyle='rgba(255,250,240,'+(flash*0.9).toFixed(3)+')'; ctx.fillRect(-22,-32,W+44,H+64); }

  drawHUD(pal);
  if(state==='ready'){ drawReady(pal); }
  else if(state==='over'){ drawOver(pal); }
  else if(paused){ drawPause(); }
  else if(!playing&&state==='dying'){ /* bird tumbling, world frozen — nothing extra */ }

  drawVignette();
  ctx.restore();
}

/* ---------- main loop -------------------------------------------- */
function frame(now){
  var dt=(now-lastNow)/1000; lastNow=now;
  if(!(dt>0)){ dt=0.016; }
  dt=Math.min(dt,0.05);
  if(!paused){ update(dt); }
  draw();
  requestAnimationFrame(frame);
}

/* ---------- sizing ------------------------------------------------ */
var dpr=1;
function fit(){
  var bw=(brand?brand.getBoundingClientRect().height:0);
  var hh=(hint?hint.getBoundingClientRect().height:0);
  var availH=window.innerHeight-bw-hh-48;
  var availW=window.innerWidth-28;
  if(!(availH>220)){ availH=220; }
  var wpx=Math.min(availW,availH*(W/H));
  var hpx=wpx/(W/H);
  stage.style.width=wpx.toFixed(1)+'px';
  stage.style.height=hpx.toFixed(1)+'px';
  stage.style.setProperty('--u',(wpx/W).toFixed(4));
  dpr=Math.min(2.5,Math.max(1,window.devicePixelRatio||1));
  cv.width=Math.round(wpx*dpr); cv.height=Math.round(hpx*dpr);
  ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);
  if('imageSmoothingEnabled' in ctx){ ctx.imageSmoothingEnabled=true; }
}

/* ---------- floating page decoration ----------------------------- */
(function(){
  if(!bgfx){ return; }
  var emo=['💗','⭐','✨','🐣','🍑','🫧','🌈'], i,sp;
  for(i=0;i<14;i++){
    sp=document.createElement('span');
    sp.textContent=emo[i%emo.length];
    sp.style.setProperty('--x',(GR()*96).toFixed(1)+'%');
    sp.style.setProperty('--fs',(16+GR()*18).toFixed(1)+'px');
    sp.style.setProperty('--dur',(9+GR()*11).toFixed(1)+'s');
    sp.style.setProperty('--del',(-GR()*16).toFixed(1)+'s');
    sp.style.setProperty('--rise',(58+GR()*42).toFixed(0)+'vh');
    bgfx.appendChild(sp);
  }
})();

/* ---------- UI buttons -------------------------------------------- */
function setSoundUI(){
  if(btnSound){ btnSound.querySelector('.i').textContent=muted?'🔇':'🔊'; btnSound.querySelector('.t').textContent=muted?'mute':'sound'; }
}
function setPauseUI(){
  if(btnPause){ btnPause.querySelector('.i').textContent=paused?'▶':'⏸'; btnPause.querySelector('.t').textContent=paused?'resume':'pause'; }
}
btnSound.addEventListener('click',function(e){ e.stopPropagation(); muted=!muted; lsSet('flappy.mute',muted?'1':'0'); if(master&&actx){ try{ master.gain.setTargetAtTime(muted?0:0.34,actx.currentTime,0.05); }catch(err){} } setSoundUI(); this.blur(); });
btnPause.addEventListener('click',function(e){ e.stopPropagation(); ensureAudio(); togglePause(!paused); this.blur(); });
btnFs.addEventListener('click',function(e){ e.stopPropagation(); toggleFull(); this.blur(); });
function toggleFull(){
  try{
    if(document.fullscreenElement||document.webkitFullscreenElement){ (document.exitFullscreen||document.webkitExitFullscreen).call(document); }
    else { var el=stage.requestFullscreen||stage.webkitRequestFullscreen; if(el){ el.call(stage); } }
  }catch(err){}
}

/* ---------- input ------------------------------------------------- */
cv.addEventListener('pointerdown',function(e){
  e.preventDefault();
  if(paused){ togglePause(false); return; }
  press();
});
cv.addEventListener('contextmenu',function(e){ e.preventDefault(); });

window.addEventListener('keydown',function(e){
  var c=e.code;
  if(c==='Space'||c==='ArrowUp'||c==='KeyW'||c==='Enter'||c==='NumpadEnter'){
    e.preventDefault();
    if(e.repeat){ return; }
    if(paused){ togglePause(false); return; }
    press();
  } else if(c==='KeyM'){ muted=!muted; lsSet('flappy.mute',muted?'1':'0'); if(master&&actx){ try{ master.gain.setTargetAtTime(muted?0:0.34,actx.currentTime,0.05); }catch(err){} } setSoundUI(); }
  else if(c==='KeyP'){ ensureAudio(); togglePause(!paused); }
  else if(c==='KeyR'){ ensureAudio(); if(state==='ready'){ startGame(); } else { startGame(); } }
  else if(c==='Escape'){ togglePause(true); }
  else if(c==='KeyF'){ toggleFull(); }
},{passive:false});

window.addEventListener('resize',fit);
window.addEventListener('orientationchange',function(){ setTimeout(fit,80); });
if(window.visualViewport){ window.visualViewport.addEventListener('resize',fit); }
document.addEventListener('visibilitychange',function(){
  if(document.hidden&&(state==='play'||state==='dying')){ togglePause(true); }
  lastNow=performance.now();
});
document.addEventListener('blur',function(){ if(state==='play'){ togglePause(true); } });

/* ---------- go ---------------------------------------------------- */
setSoundUI(); setPauseUI();
fit();
requestAnimationFrame(function(t){ lastNow=t; requestAnimationFrame(frame); });
})();
</script>
</body>
</html>
