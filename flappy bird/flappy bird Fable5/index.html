<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Flappy Chick</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #79c8e8;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    /* Prevent long-press / double-tap zoom stealing flap taps on mobile */
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }
  canvas {
    display: block;
    border-radius: 12px;
    box-shadow: 0 12px 40px rgba(0, 40, 60, .35);
    cursor: pointer;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
'use strict';

// ---------- Setup ----------
const W = 420, H = 640;              // logical resolution; CSS scales to fit
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

function fit() {
  // Render at devicePixelRatio so the art stays crisp on retina screens
  const scale = Math.min(innerWidth / W, innerHeight / H) * 0.97;
  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W * scale + 'px';
  canvas.style.height = H * scale + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', fit);
fit();

// ---------- Tunables ----------
const GRAVITY    = 1500;   // px/s^2
const FLAP_VY    = -420;   // px/s impulse
const MAX_FALL   = 620;    // terminal velocity keeps the dive readable
const PIPE_SPEED = 150;    // px/s
const PIPE_W     = 70;
const PIPE_GAP   = 158;
const PIPE_EVERY = 235;    // horizontal px between pipes
const GROUND_Y   = H - 80;
const BIRD_X     = 110;
const BIRD_R     = 16;

// ---------- State ----------
let state = 'ready';       // ready | play | over
let bird, pipes, score, best, time, shake, flash, overAt, scorePop;

// localStorage throws on some origins (data:, sandboxed iframes, strict privacy
// modes) — losing the best-score feature there is fine, crashing the game is not
function loadBest() {
  try { return +(localStorage.getItem('flappyChickBest') || 0); } catch (e) { return 0; }
}
function saveBest(v) {
  try { localStorage.setItem('flappyChickBest', v); } catch (e) {}
}
best = loadBest();

function reset() {
  bird = { y: H * 0.42, vy: 0, rot: 0, wingT: 9, blinkT: 2 + Math.random() * 3 };
  pipes = [];
  score = 0;
  time = 0;
  shake = 0;
  flash = 0;
  scorePop = 0;
  state = 'ready';
}
reset();

// ---------- Audio (tiny WebAudio blips; created lazily so autoplay rules are happy) ----------
let actx = null;
function beep(freq, dur, type, vol, slideTo) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, actx.currentTime);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, actx.currentTime + dur);
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
    o.connect(g).connect(actx.destination);
    o.start();
    o.stop(actx.currentTime + dur);
  } catch (e) { /* audio is decoration; never let it break the game */ }
}
const sndFlap  = () => beep(480, .09, 'square',   .06, 700);
const sndScore = () => { beep(660, .09, 'sine', .12); setTimeout(() => beep(880, .12, 'sine', .12), 80); };
const sndHit   = () => beep(260, .28, 'sawtooth', .14, 70);

// ---------- Input ----------
function press() {
  if (state === 'ready') {
    state = 'play';
    flap();
  } else if (state === 'play') {
    flap();
  } else if (state === 'over' && performance.now() - overAt > 500) {
    // Small delay so a panicked last-second tap doesn't instantly restart
    reset();
  }
}
function flap() {
  bird.vy = FLAP_VY;
  bird.wingT = 0;
  sndFlap();
}
addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); press(); }
});
canvas.addEventListener('pointerdown', e => { e.preventDefault(); press(); });

// ---------- Update ----------
function spawnPipes() {
  const last = pipes.length ? pipes[pipes.length - 1].x : -Infinity;
  if (last < W - PIPE_EVERY) {
    const margin = 70;
    const gapY = margin + PIPE_GAP / 2 + Math.random() * (GROUND_Y - 2 * margin - PIPE_GAP);
    pipes.push({ x: W + 10, gapY, scored: false });
  }
}

function circleRect(cx, cy, r, rx, ry, rw, rh) {
  const nx = Math.max(rx, Math.min(cx, rx + rw));
  const ny = Math.max(ry, Math.min(cy, ry + rh));
  const dx = cx - nx, dy = cy - ny;
  return dx * dx + dy * dy < r * r;
}

function update(dt) {
  time += dt;
  bird.wingT += dt;
  shake = Math.max(0, shake - dt * 3);
  flash = Math.max(0, flash - dt * 2.5);
  scorePop = Math.max(0, scorePop - dt * 4);
  bird.blinkT -= dt;
  if (bird.blinkT < -0.12) bird.blinkT = 2 + Math.random() * 3;

  if (state === 'ready') {
    bird.y = H * 0.42 + Math.sin(time * 3.2) * 9;
    bird.rot = Math.sin(time * 3.2) * 0.08;
    return;
  }

  // Gravity applies in play and while tumbling after a hit
  bird.vy = Math.min(bird.vy + GRAVITY * dt, MAX_FALL);
  bird.y += bird.vy * dt;

  // Tilt follows velocity, smoothed so the nose-dive feels weighty not twitchy
  const targetRot = state === 'over'
    ? Math.min(bird.rot + dt * 6, Math.PI / 2)
    : Math.max(-0.4, Math.min(1.25, bird.vy / 520));
  bird.rot += (targetRot - bird.rot) * Math.min(1, dt * 12);

  if (bird.y > GROUND_Y - BIRD_R) {
    bird.y = GROUND_Y - BIRD_R;
    bird.vy = 0;
    if (state === 'play') die();
  }

  if (state !== 'play') return;

  if (bird.y < BIRD_R) { bird.y = BIRD_R; bird.vy = 0; }

  spawnPipes();
  for (const p of pipes) {
    p.x -= PIPE_SPEED * dt;
    if (!p.scored && p.x + PIPE_W < BIRD_X - BIRD_R) {
      p.scored = true;
      score++;
      scorePop = 1;
      sndScore();
    }
    const topH = p.gapY - PIPE_GAP / 2;
    const botY = p.gapY + PIPE_GAP / 2;
    if (circleRect(BIRD_X, bird.y, BIRD_R, p.x, 0, PIPE_W, topH) ||
        circleRect(BIRD_X, bird.y, BIRD_R, p.x, botY, PIPE_W, GROUND_Y - botY)) {
      die();
      break;
    }
  }
  pipes = pipes.filter(p => p.x > -PIPE_W - 20);
}

function die() {
  state = 'over';
  overAt = performance.now();
  shake = 1;
  flash = 1;
  sndHit();
  if (score > best) {
    best = score;
    saveBest(best);
  }
}

// ---------- Drawing ----------
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// Cloud positions are fixed per session; only their x scrolls, so they feel like a stable sky
const clouds = Array.from({ length: 6 }, (_, i) => ({
  x: Math.random() * W,
  y: 40 + Math.random() * 170,
  s: 0.6 + Math.random() * 0.8,
  v: 12 + Math.random() * 10,
}));

function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#8fdcf5');
  g.addColorStop(0.65, '#cdeffb');
  g.addColorStop(1, '#eafaff');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // soft sun
  ctx.fillStyle = 'rgba(255, 236, 170, .9)';
  ctx.beginPath(); ctx.arc(W - 78, 88, 34, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255, 236, 170, .35)';
  ctx.beginPath(); ctx.arc(W - 78, 88, 50, 0, 7); ctx.fill();
}

function drawCloud(x, y, s) {
  ctx.beginPath();
  ctx.arc(x, y, 18 * s, 0, 7);
  ctx.arc(x + 22 * s, y - 8 * s, 22 * s, 0, 7);
  ctx.arc(x + 48 * s, y, 17 * s, 0, 7);
  ctx.arc(x + 24 * s, y + 6 * s, 20 * s, 0, 7);
  ctx.fill();
}

function drawClouds(dt) {
  ctx.fillStyle = 'rgba(255,255,255,.92)';
  for (const c of clouds) {
    if (state !== 'over') c.x -= c.v * dt;
    if (c.x < -110) { c.x = W + 60; c.y = 40 + Math.random() * 170; }
    drawCloud(c.x, c.y, c.s);
  }
}

// Hills are drawn as repeating sine humps; the offset scrolls with a fraction of
// pipe speed so each layer's parallax stays proportional to its "distance"
let farOff = 0, nearOff = 0;
function drawHills(dt) {
  if (state !== 'over') {
    farOff  = (farOff  + PIPE_SPEED * 0.20 * dt) % 240;
    nearOff = (nearOff + PIPE_SPEED * 0.45 * dt) % 160;
  }
  ctx.fillStyle = '#aee3a0';
  ctx.beginPath();
  ctx.moveTo(0, GROUND_Y);
  for (let x = -260; x <= W + 260; x += 6) {
    ctx.lineTo(x, GROUND_Y - 46 - Math.sin((x + farOff) / 240 * Math.PI * 2) * 30);
  }
  ctx.lineTo(W, GROUND_Y);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = '#8ed081';
  ctx.beginPath();
  ctx.moveTo(0, GROUND_Y);
  for (let x = -180; x <= W + 180; x += 6) {
    ctx.lineTo(x, GROUND_Y - 18 - Math.sin((x + nearOff) / 160 * Math.PI * 2) * 16);
  }
  ctx.lineTo(W, GROUND_Y);
  ctx.closePath();
  ctx.fill();
}

let groundOff = 0;
function drawGround(dt) {
  if (state !== 'over') groundOff = (groundOff + PIPE_SPEED * dt) % 24;
  ctx.fillStyle = '#e0b978';
  ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
  ctx.fillStyle = '#83d962';
  ctx.fillRect(0, GROUND_Y, W, 14);
  // scalloped grass edge sells the scroll speed better than a flat stripe
  ctx.fillStyle = '#6cc94e';
  for (let x = -24; x < W + 24; x += 24) {
    ctx.beginPath();
    ctx.arc(x - groundOff + 12, GROUND_Y + 14, 12, 0, Math.PI);
    ctx.fill();
  }
  ctx.fillStyle = 'rgba(160, 110, 50, .25)';
  for (let x = -24; x < W + 24; x += 48) {
    ctx.fillRect(x - groundOff, GROUND_Y + 34, 20, 7);
    ctx.fillRect(x - groundOff + 26, GROUND_Y + 54, 14, 6);
  }
}

function drawPipe(p) {
  const topH = p.gapY - PIPE_GAP / 2;
  const botY = p.gapY + PIPE_GAP / 2;
  const body = ctx.createLinearGradient(p.x, 0, p.x + PIPE_W, 0);
  body.addColorStop(0, '#5cbb4e');
  body.addColorStop(0.5, '#8fe07e');
  body.addColorStop(1, '#4ca341');

  for (const [y, h, capY] of [[0, topH, topH - 26], [botY, GROUND_Y - botY, botY]]) {
    ctx.fillStyle = body;
    ctx.fillRect(p.x, y, PIPE_W, h);
    roundRect(p.x - 5, capY, PIPE_W + 10, 26, 7);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.28)';
    ctx.fillRect(p.x + 9, y, 8, h);
    ctx.fillStyle = body;
  }
}

function drawBird() {
  ctx.save();
  ctx.translate(BIRD_X, bird.y);
  ctx.rotate(bird.rot);

  // tail
  ctx.fillStyle = '#f5b731';
  ctx.beginPath();
  ctx.moveTo(-13, -2);
  ctx.lineTo(-24, -8);
  ctx.lineTo(-22, 3);
  ctx.closePath();
  ctx.fill();

  // body
  ctx.fillStyle = '#ffd93d';
  ctx.beginPath(); ctx.arc(0, 0, BIRD_R, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff3c4';
  ctx.beginPath(); ctx.ellipse(3, 7, 9, 6, 0, 0, 7); ctx.fill();

  // wing: quick downstroke right after a flap, lazy hover-flutter otherwise
  const wingAng = bird.wingT < 0.3
    ? Math.sin(bird.wingT * 34) * 0.9
    : Math.sin(time * 7) * 0.25 + 0.15;
  ctx.save();
  ctx.translate(-3, 1);
  ctx.rotate(wingAng);
  ctx.fillStyle = '#ffb703';
  ctx.beginPath(); ctx.ellipse(-5, 0, 11, 6.5, -0.3, 0, 7); ctx.fill();
  ctx.restore();

  // eye (with blink)
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(7, -5, 6, 0, 7); ctx.fill();
  if (bird.blinkT < 0) {
    ctx.strokeStyle = '#5a4a20'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(4, -5); ctx.lineTo(11, -5); ctx.stroke();
  } else {
    ctx.fillStyle = '#3a3021';
    ctx.beginPath(); ctx.arc(8.5, -5, 2.8, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(9.4, -6, 1, 0, 7); ctx.fill();
  }

  // beak + blush
  ctx.fillStyle = '#ff8c42';
  ctx.beginPath(); ctx.moveTo(13, -2); ctx.lineTo(23, 1); ctx.lineTo(13, 4); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255, 130, 130, .5)';
  ctx.beginPath(); ctx.ellipse(6, 3, 3.4, 2.2, 0, 0, 7); ctx.fill();

  ctx.restore();
}

function textWithOutline(str, x, y, size, fill) {
  ctx.font = `bold ${size}px 'Trebuchet MS', 'Segoe UI', sans-serif`;
  ctx.textAlign = 'center';
  ctx.lineWidth = size / 8;
  ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(60, 50, 20, .85)';
  ctx.strokeText(str, x, y);
  ctx.fillStyle = fill;
  ctx.fillText(str, x, y);
}

function drawUI() {
  if (state === 'ready') {
    textWithOutline('Flappy Chick', W / 2, 150, 44, '#fff');
    textWithOutline('tap / space to flap', W / 2, H * 0.62, 20, '#fffbe8');
    if (best > 0) textWithOutline('best  ' + best, W / 2, H * 0.62 + 34, 18, '#ffe8a3');
    return;
  }
  const size = 52 * (1 + scorePop * 0.25);
  textWithOutline(String(score), W / 2, 86, size, '#fff');

  if (state === 'over' && performance.now() - overAt > 350) {
    ctx.fillStyle = 'rgba(30, 40, 60, .35)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff8e7';
    roundRect(W / 2 - 130, H / 2 - 110, 260, 200, 18);
    ctx.fill();
    ctx.strokeStyle = '#e8c95f';
    ctx.lineWidth = 4;
    ctx.stroke();
    textWithOutline('Game Over', W / 2, H / 2 - 62, 32, '#ff9f68');
    ctx.fillStyle = '#7a6a45';
    ctx.font = "bold 18px 'Trebuchet MS', 'Segoe UI', sans-serif";
    ctx.fillText('score', W / 2 - 60, H / 2 - 18);
    ctx.fillText('best', W / 2 + 60, H / 2 - 18);
    textWithOutline(String(score), W / 2 - 60, H / 2 + 22, 34, '#fff');
    textWithOutline(String(best), W / 2 + 60, H / 2 + 22, 34, score >= best && score > 0 ? '#ffe066' : '#fff');
    if (score >= best && score > 0) textWithOutline('new best!', W / 2, H / 2 + 52, 16, '#ffe066');
    textWithOutline('tap to restart', W / 2, H / 2 + 78, 17, '#fffbe8');
  }
}

// ---------- Main loop ----------
let last = performance.now();
function frame(now) {
  // Clamp dt so a background tab doesn't teleport the bird through pipes on return
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  update(dt);

  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * 9 * shake, (Math.random() - 0.5) * 9 * shake);
  drawSky();
  drawClouds(dt);
  drawHills(dt);
  for (const p of pipes) drawPipe(p);
  drawGround(dt);
  drawBird();
  drawUI();
  ctx.restore();

  if (flash > 0) {
    ctx.fillStyle = `rgba(255,255,255,${flash * 0.6})`;
    ctx.fillRect(0, 0, W, H);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
