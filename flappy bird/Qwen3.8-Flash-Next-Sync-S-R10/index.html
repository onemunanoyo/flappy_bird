<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>cheepy! · a cute flappy-style game</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:radial-gradient(130% 120% at 50% 18%,#1e3350 0%,#0b1420 58%,#060c14 100%);
    font-family:"Trebuchet MS","Segoe UI",system-ui,-apple-system,sans-serif;color:#a9c8e8;
    -webkit-tap-highlight-color:transparent;user-select:none;touch-action:none;
  }
  canvas{display:block;border-radius:22px;touch-action:none;cursor:pointer;
    box-shadow:0 22px 64px rgba(0,0,0,.55),inset 0 0 0 3px rgba(255,255,255,.07)}
  .cap{font-size:12.5px;letter-spacing:.5px;opacity:.72;text-align:center}
  .cap b{color:#ffe3a4;font-weight:700}
</style>
</head>
<body>
<canvas id="game" width="480" height="680"></canvas>
<div class="cap"><b>tap / space</b> flap&nbsp;&nbsp;·&nbsp;&nbsp;<b>m</b> sound&nbsp;&nbsp;·&nbsp;&nbsp;<b>p</b> pause&nbsp;&nbsp;·&nbsp;&nbsp;<b>r</b> restart</div>

<script>
(function(){
"use strict";

/* ============================================================
   cheepy! — a cute flappy-bird style game
   canvas only · no libraries · keyboard + mouse + touch
   ============================================================ */

var cvs=document.getElementById("game");
var ctx=cvs.getContext("2d");

/* ---------- logical world (everything drawn in these units) ---------- */
var W=480,H=680,GROUND_H=124,groundY=H-GROUND_H;
var TAU=Math.PI*2;
var FONT='"Trebuchet MS","Segoe UI",system-ui,sans-serif';

/* ---------- physics tuning ---------- */
var GRAVITY=1750, FLAP=-520, MAX_FALL=770;
var BIRD_X=152;
var BODY_RX=21,BODY_RY=16,HIT_R=13;
var PIPE_W=64,CAP_W=76,CAP_H=26;
var gapMin=112,gapMax=groundY-112;

var dpr=1,scale=1;
function resize(){
  var availW=Math.max(220,window.innerWidth-28);
  var availH=Math.max(240,window.innerHeight-92);
  scale=Math.min(availW/W,availH/H);
  dpr=Math.min(window.devicePixelRatio||1,2.5);
  cvs.width=Math.round(W*scale*dpr);
  cvs.height=Math.round(H*scale*dpr);
  cvs.style.width=(W*scale)+"px";
  cvs.style.height=(H*scale)+"px";
}

/* ---------- helpers ---------- */
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function lerp(a,b,t){return a+(b-a)*t;}
function rnd(a,b){return a+Math.random()*(b-a);}
function rint(a,b){return Math.floor(rnd(a,b+1));}
function easeOutCubic(t){return 1-Math.pow(1-t,3);}
function easeOutBack(t){var c1=1.70158,c3=c1+1;t=t-1;return 1+c3*t*t*t+c1*t*t;}
function smooth(cur,target,rate,dt){return lerp(cur,target,1-Math.exp(-rate*dt));}

function rr(x,y,w,h,r){                 /* rounded rect path (does NOT fill/stroke) */
  r=Math.min(r,Math.abs(w)/2,Math.abs(h)/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function ell(x,y,rx,ry){ctx.beginPath();ctx.ellipse(x,y,Math.abs(rx),Math.abs(ry),0,0,TAU);}

function pick(arr){return arr[rint(0,arr.length-1)];}

/* ---------- storage ---------- */
var BEST_KEY="cheepy.best_v1",MUTE_KEY="cheepy.muted_v1";
function getStore(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function setStore(k,v){try{localStorage.setItem(k,String(v));}catch(e){}}
var best=parseInt(getStore(BEST_KEY)||"0",10)||0;
var muted=(getStore(MUTE_KEY)==="1");

/* ---------- tiny synth sfx ---------- */
var ac=null;
function audio(){
  if(ac===null){try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){ac=false;}}
  if(ac&&ac.state==="suspended"){ac.resume().catch(function(){});}
  return ac||null;
}
function beep(f,dur,type,vol,to){
  var a=audio();if(!a||muted)return;
  var t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||"triangle";
  o.frequency.setValueAtTime(f,t);
  if(to)o.frequency.exponentialRampToValueAtTime(Math.max(70,to),t+dur);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol||0.16,t+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(a.destination);
  o.start(t);o.stop(t+dur+0.04);
}
function hiss(dur,vol,cut){
  var a=audio();if(!a||muted)return;
  var n=Math.max(1,Math.floor(a.sampleRate*dur));
  var buf=a.createBuffer(1,n,a.sampleRate),d=buf.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  var src=a.createBufferSource();src.buffer=buf;
  var f=a.createBiquadFilter();f.type="lowpass";f.frequency.value=cut||900;
  var g=a.createGain();g.gain.value=vol||0.2;
  src.connect(f);f.connect(g);g.connect(a.destination);src.start();
}
var sfx={
  flap:function(){beep(520,0.13,"triangle",0.13,780);hiss(0.07,0.06,2600);},
  score:function(){beep(760,0.11,"sine",0.14);window.setTimeout(function(){beep(1160,0.13,"sine",0.11);},85);},
  hit:function(){hiss(0.2,0.3,650);beep(180,0.22,"square",0.2,85);},
  die:function(){beep(460,0.6,"sawtooth",0.13,110);},
  bounce:function(){beep(230,0.16,"triangle",0.11,150);},
  start:function(){beep(660,0.1,"sine",0.12,900);}
};

/* ---------- game state ---------- */
var state="ready";           /* ready | playing | dying | dead */
var paused=false,T=0;
var score=0,newBest=false,medal="none";
var pipeSpeed=215,gapSize=194,spacing=302;
var crashT=0,landed=false,deadT=0,veil=0,panelIn=0,flashAl=0;
var shake=0,scorePop=0,flapN=0,idleFlap=0.6;
var scroll={far:0,mid:0,grass:0,dirt:0};

var bird={x:BIRD_X,y:H*0.42,vy:0,rot:0,wPos:0.25,wVel:0,sx:1,sy:1,
          blink:0,blinkIn:rnd(2.4,5),alive:true};

var pipes=[],parts=[];
var clouds=[],skyBirds=[],petals=[],bushes=[],trees=[],tufts=[],flowers=[],pebbles=[];

function buildScenery(){
  clouds=[];skyBirds=[];petals=[];bushes=[];trees=[];tufts=[];flowers=[];pebbles=[];
  var i;
  for(i=0;i<7;i++)clouds.push({x:rnd(-80,W),y:rnd(52,H*0.40),s:rnd(0.55,1.3),v:rnd(7,17)});
  for(i=0;i<5;i++)skyBirds.push({x:rnd(-20,W),y:rnd(64,196),v:rnd(14,28),ph:rnd(0,TAU),s:rnd(0.55,1.05)});
  for(i=0;i<14;i++)petals.push({x:rnd(0,W),y:rnd(0,H*0.9),v:rnd(16,36),sw:rnd(0,TAU),s:rnd(3.5,7),c:pick(["#ffd9e6","#fff2c9","#ffe3a4"])});
  for(i=0;i<9;i++)bushes.push({x:rnd(0,W+240),s:rnd(0.7,1.35)});
  for(i=0;i<8;i++)trees.push({x:rnd(0,W+260),s:rnd(0.65,1.2)});
  for(i=0;i<26;i++)tufts.push({x:rnd(0,W+230),h:rnd(6,15),lean:rnd(-0.6,0.6)});
  for(i=0;i<12;i++)flowers.push({x:rnd(0,W+230),c:pick(["#ff9db8","#fff2b8","#c9a7ff"]),s:rnd(3.2,5.2)});
  for(i=0;i<18;i++)pebbles.push({x:rnd(0,W+240),y:rnd(groundY+32,H-16),r:rnd(2.2,5)});
}

function reset(){
  pipes=[];parts=[];
  score=0;newBest=false;medal="none";
  pipeSpeed=215;gapSize=194;spacing=302;
  crashT=0;landed=false;deadT=0;veil=0;panelIn=0;flashAl=0;shake=0;scorePop=0;flapN=0;
  bird.x=BIRD_X;bird.y=H*0.42;bird.vy=0;bird.rot=0;bird.wPos=0.25;bird.wVel=0;
  bird.sx=1;bird.sy=1;bird.blink=0;bird.blinkIn=rnd(2.4,5);bird.alive=true;
  state="ready";paused=false;
  buildScenery();
}

/* ---------- flow ---------- */
function spawnPipe(prev){
  var c;
  if(prev)c=clamp(prev.gap+rnd(-125,125),gapMin,gapMax);
  else c=rnd(gapMin+40,gapMax-24);
  var x=prev?Math.max(W+30,prev.x+spacing):W+96;
  var p={x:x,gap:c,scored:false,seed:Math.random()};
  pipes.push(p);
  return p;
}

function startGame(){
  state="playing";paused=false;
  bird.vy=FLAP;bird.wVel-=30;bird.sx=0.8;bird.sy=1.2;
  var p1=spawnPipe(null);spawnPipe(p1);
  sfx.start();
}

function flap(){
  audio();
  if(paused){paused=false;return;}
  if(state==="ready"){startGame();return;}
  if(state==="playing"){
    bird.vy=FLAP;bird.wVel-=30;bird.sx=0.78;bird.sy=1.26;
    flapN++;sfx.flap();
    puff(bird.x-16,bird.y+(flapN%2?14:10),flapN%2?5:7);
    return;
  }
  if(state==="dead"&&deadT>0.5){reset();startGame();}
}

function crash(){
  if(!bird.alive)return;
  state="dying";crashT=0;landed=false;bird.alive=false;
  bird.vy=Math.max(90,bird.vy*0.3);
  shake=13;flashAl=0.55;veil=0;panelIn=0;deadT=0;
  if(score>best){best=score;newBest=true;setStore(BEST_KEY,best);}
  medal=score>=30?"gold":(score>=15?"silver":(score>=5?"bronze":"none"));
  sfx.hit();
  window.setTimeout(function(){if(!muted)sfx.die();},140);
  feathers(bird.x,bird.y,9);smoke(bird.x,bird.y,7);sparks(bird.x,bird.y,10);
}

/* ---------- particles ---------- */
function addPart(p){parts.push(p);if(parts.length>230)parts.shift();}
function puff(x,y,r){addPart({k:"puff",x:x,y:y,vx:rnd(-34,18),vy:rnd(-22,10),r:r,life:0.45,max:0.45,rot:0,vr:0});}
function smoke(x,y,n){
  for(var i=0;i<n;i++)addPart({k:"smoke",x:x+rnd(-6,6),y:y+rnd(-6,6),vx:rnd(-70,42),vy:rnd(-120,-25),
    grav:-28,drag:2.2,r:rnd(6,11),life:rnd(0.4,0.85),max:0.85,rot:0,vr:0});
}
function sparks(x,y,n){
  for(var i=0;i<n;i++)addPart({k:"spark",x:x,y:y,vx:rnd(-190,190),vy:rnd(-235,70),grav:430,drag:2.4,
    r:rnd(2,3.6),life:rnd(0.3,0.6),max:0.6,rot:rnd(0,TAU),vr:rnd(-8,8),c:pick(["#ffe3a4","#ffffff","#ff9db8"])});
}
function feathers(x,y,n){
  for(var i=0;i<n;i++)addPart({k:"feather",x:x+rnd(-8,8),y:y+rnd(-8,8),vx:rnd(-130,60),vy:rnd(-270,-40),
    grav:150,drag:1.1,r:rnd(4,7),life:rnd(0.9,1.7),max:1.7,rot:rnd(0,TAU),vr:rnd(-6,6),sway:rnd(22,46),seed:Math.random(),
    c:pick(["#ffe9b8","#ffd45e","#fff6df"])});
}
function scoreBurst(x,y){
  for(var i=0;i<12;i++)addPart({k:"star",x:x+rnd(-6,10),y:y+rnd(-12,6),vx:rnd(-125,125),vy:rnd(-265,-85),
    grav:250,drag:1.9,r:rnd(3,6),life:rnd(0.5,0.95),max:0.95,rot:rnd(0,TAU),vr:rnd(-7,7),seed:Math.random(),
    c:pick(["#ffe3a4","#fff6df","#8fd6f8","#ff9db8"])});
  puff(x,y-4,8);
}
function updateParticles(dt){
  for(var i=parts.length-1;i>=0;i--){
    var p=parts[i];p.life-=dt;
    if(p.life<=0){parts.splice(i,1);continue;}
    p.vy+=(p.grav||0)*dt;
    p.vx*=Math.exp(-(p.drag||2)*dt);
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=(p.vr||0)*dt;
    if(p.sway)p.x+=Math.sin(T*3.4+(p.seed||0)*9)*p.sway*dt;
  }
}

/* ---------- collision ---------- */
function hitRect(cx,cy,r,x,y,w,h){
  var nx=clamp(cx,x,x+w),ny=clamp(cy,y,y+h);
  var dx=cx-nx,dy=cy-ny;
  return (dx*dx+dy*dy)<r*r;
}
function collide(){
  var r=HIT_R;
  for(var i=0;i<pipes.length;i++){
    var p=pipes[i],gTop=p.gap-gapSize/2,gBot=p.gap+gapSize/2;
    if(hitRect(bird.x,bird.y,r,p.x,-30,PIPE_W,gTop-CAP_H+30))return true;
    if(hitRect(bird.x,bird.y,r,p.x-6,gTop-CAP_H,CAP_W,CAP_H))return true;
    if(hitRect(bird.x,bird.y,r,p.x,gBot+CAP_H,PIPE_W,groundY-gBot-CAP_H+16))return true;
    if(hitRect(bird.x,bird.y,r,p.x-6,gBot,CAP_W,CAP_H))return true;
  }
  return false;
}

/* ---------- update ---------- */
function update(dt){
  T+=dt;
  scorePop=Math.max(0,scorePop-dt*3.0);
  shake=Math.max(0,shake-dt*26);
  flashAl=Math.max(0,flashAl-dt*2.2);

  /* gentle difficulty ramp */
  pipeSpeed=clamp(216+score*4.2,216,302);
  gapSize=clamp(196-score*1.8,150,196);
  spacing=clamp(304-score*3.4,236,304);

  var playing=(state==="playing");
  var worldSpeed=playing?pipeSpeed:(state==="ready"?72:0);

  /* sky layers (always drifting) */
  var i;
  for(i=0;i<clouds.length;i++){var c=clouds[i];c.x-=(c.v+worldSpeed*0.16)*dt;
    if(c.x<-175){c.x=W+rnd(30,190);c.y=rnd(52,H*0.40);c.s=rnd(0.55,1.3);c.v=rnd(7,17);}}
  for(i=0;i<skyBirds.length;i++){var sb=skyBirds[i];sb.x-=(sb.v+worldSpeed*0.10)*dt;sb.ph+=dt*7;
    if(sb.x<-44){sb.x=W+rnd(20,200);sb.y=rnd(60,200);sb.s=rnd(0.55,1.05);}}
  for(i=0;i<petals.length;i++){var pt=petals[i];pt.sw+=dt*2.6;
    pt.y+=(pt.v+worldSpeed*0.22)*dt;
    pt.x-=(14+worldSpeed*0.32)*dt+Math.sin(pt.sw)*24*dt;
    if(pt.y>H||pt.x<-26){pt.x=rnd(0,W);pt.y=rnd(-50,-8);}}

  /* mid + near layers */
  var spMid=worldSpeed*0.30,spNear=worldSpeed*0.72,spG=worldSpeed;
  for(i=0;i<trees.length;i++){var tr=trees[i];tr.x-=spMid*dt;if(tr.x<-95){tr.x=W+rnd(10,170);tr.s=rnd(0.65,1.2);}}
  for(i=0;i<bushes.length;i++){var bu=bushes[i];bu.x-=spNear*dt;if(bu.x<-95){bu.x=W+rnd(8,150);bu.s=rnd(0.7,1.35);}}
  for(i=0;i<tufts.length;i++){var tf=tufts[i];tf.x-=spG*dt;if(tf.x<-32){tf.x=W+rnd(0,150);tf.h=rnd(6,15);tf.lean=rnd(-0.6,0.6);}}
  for(i=0;i<flowers.length;i++){var fw=flowers[i];fw.x-=spG*dt;if(fw.x<-26){fw.x=W+rnd(0,150);fw.c=pick(["#ff9db8","#fff2b8","#c9a7ff"]);}}
  for(i=0;i<pebbles.length;i++){var pb=pebbles[i];pb.x-=spG*dt;if(pb.x<-16){pb.x=W+rnd(0,170);pb.y=rnd(groundY+32,H-16);}}
  scroll.far+=worldSpeed*0.09*dt;scroll.mid+=worldSpeed*0.24*dt;
  scroll.grass+=spG*dt;scroll.dirt+=spG*dt;

  /* blink */
  bird.blinkIn-=dt;
  if(bird.blinkIn<=0){bird.blinkIn=rnd(2.4,5.6);bird.blink=1;}
  if(bird.blink>0)bird.blink=Math.max(0,bird.blink-dt*8);

  var wingBase;

  if(state==="ready"){
    bird.y=H*0.42+Math.sin(T*3.2)*9;
    bird.vy=Math.cos(T*3.2)*140;
    idleFlap-=dt;
    if(idleFlap<=0){idleFlap=rnd(0.7,1.25);bird.wVel-=22;}
    bird.rot=smooth(bird.rot,Math.sin(T*3.2)*0.10,6,dt);
    wingBase=clamp(0.2-bird.vy/700,-0.25,0.6);
    bird.sx=smooth(bird.sx,1,10,dt);bird.sy=smooth(bird.sy,1,10,dt);
  }else{
    /* smooth gravity */
    bird.vy=Math.min(MAX_FALL,bird.vy+GRAVITY*dt);
    bird.y+=bird.vy*dt;
    if(bird.y<BODY_RY+8){                       /* soft ceiling, no death up there */
      bird.y=BODY_RY+8;
      if(bird.vy<0){bird.vy=60;puff(bird.x-8,bird.y+12,6);}
    }

    var tRot;
    if(!bird.alive)tRot=landed?1.02:1.28;
    else if(bird.vy<0)tRot=-0.52+Math.sin(T*9)*0.05;
    else tRot=clamp(0.10+(bird.vy/MAX_FALL)*1.08,0.10,1.22);
    bird.rot=smooth(bird.rot,tRot,bird.vy>230?13:7,dt);

    wingBase=clamp(0.18-bird.vy*0.0011,-0.28,0.72);
    var tSx=clamp(1-(bird.vy/900)*0.13,0.84,1.10),tSy=clamp(1+(bird.vy/900)*0.16,0.90,1.20);
    bird.sx=smooth(bird.sx,tSx,12,dt);
    bird.sy=smooth(bird.sy,tSy,12,dt);
  }

  /* wing spring — the cute flap animation */
  var k=230,d=13;
  bird.wVel+=(-k*(bird.wPos-wingBase))*dt;
  bird.wVel*=Math.exp(-d*dt);
  bird.wPos=clamp(bird.wPos+bird.wVel*dt,-1.15,1.05);

  if(playing){
    for(var j=pipes.length-1;j>=0;j--){
      var p=pipes[j];p.x-=pipeSpeed*dt;
      if(p.x+CAP_W<-80)pipes.splice(j,1);
    }
    var last=pipes.length?pipes[pipes.length-1]:null;
    if(!last||last.x<W-spacing)spawnPipe(last);

    for(j=0;j<pipes.length;j++){
      var q=pipes[j];
      if(!q.scored&&q.x+CAP_W<BIRD_X-6){
        q.scored=true;score++;scorePop=1;sfx.score();
        scoreBurst(BIRD_X+26,bird.y-4);
      }
    }
    if(collide())crash();
    else if(bird.y+BODY_RY*0.86>=groundY)crash();
  }else if(state==="dying"||state==="dead"){
    crashT+=dt;
    if(!landed&&bird.y+BODY_RY>=groundY){
      landed=true;bird.y=groundY-BODY_RY;bird.vy=-340;
      shake=Math.max(shake,7);sfx.bounce();
      puff(bird.x-4,bird.y+9,9);puff(bird.x-16,bird.y+12,7);
    }
    if(landed&&bird.y+BODY_RY>=groundY){bird.y=groundY-BODY_RY;if(bird.vy>0)bird.vy=0;}
    if(state==="dying"&&landed&&crashT>0.8){state="dead";deadT=0;}
    if(state==="dead"){
      deadT+=dt;
      veil=Math.min(0.5,veil+dt*1.7);
      panelIn=Math.min(1,panelIn+dt/0.42);
    }
  }

  updateParticles(dt);
}

/* ============================================================
   drawing
   ============================================================ */

function drawSky(){
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#5cbdec");g.addColorStop(0.42,"#8cd6f7");
  g.addColorStop(0.72,"#bfeafc");g.addColorStop(1,"#ffeacb");
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  var sx=W*0.8,sy=H*0.12;
  var sg=ctx.createRadialGradient(sx,sy,6,sx,sy,160);
  sg.addColorStop(0,"rgba(255,249,214,.9)");
  sg.addColorStop(0.4,"rgba(255,240,196,.42)");
  sg.addColorStop(1,"rgba(255,240,196,0)");
  ctx.fillStyle=sg;ctx.beginPath();ctx.arc(sx,sy,160,0,TAU);ctx.fill();
  ctx.fillStyle="#fff6d2";ctx.beginPath();ctx.arc(sx,sy,32,0,TAU);ctx.fill();
  ctx.strokeStyle="rgba(255,255,255,.5)";ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(sx,sy,39,0,TAU);ctx.stroke();
}

function drawSkyBirds(){
  ctx.strokeStyle="rgba(70,110,150,.42)";ctx.lineWidth=2;ctx.lineCap="round";
  for(var i=0;i<skyBirds.length;i++){
    var b=skyBirds[i],f=Math.sin(b.ph)*3.4*b.s;
    ctx.beginPath();
    ctx.moveTo(b.x-7*b.s,b.y+f);
    ctx.quadraticCurveTo(b.x,b.y-3.2*b.s,b.x+7*b.s,b.y+f);
    ctx.stroke();
  }
}

function ridge(off,yBase,amp,f1,f2,color){

/* ---- pipes ---- */
function pipeGrad(x,w,l1,l2,l3,l4){
  var g=ctx.createLinearGradient(x,0,x+w,0);
  g.addColorStop(0,l1);g.addColorStop(0.32,l2);g.addColorStop(0.72,l3);g.addColorStop(1,l4);
  return g;
}
function drawShaft(x,y,w,h){
  if(h<=0)return;
  ctx.fillStyle=pipeGrad(x,w,"#8ee7a4","#5cc971","#3b9553","#2c7a46");
  rr(x,y,w,h,9);ctx.fill();
  ctx.strokeStyle="rgba(22,66,42,.72)";ctx.lineWidth=2.4;rr(x,y,w,h,9);ctx.stroke();
  ctx.fillStyle="rgba(255,255,255,.32)";rr(x+7,y+5,7,Math.max(2,h-10),3);ctx.fill();
  ctx.fillStyle="rgba(16,58,34,.2)";rr(x+w-13,y+5,6,Math.max(2,h-10),3);ctx.fill();
}
function drawCap(x,y,w,h){
  ctx.fillStyle=pipeGrad(x,w,"#a5f0ba","#69d47e","#43a260","#327e4c");
  rr(x,y,w,h,10);ctx.fill();
  ctx.strokeStyle="rgba(22,66,42,.78)";ctx.lineWidth=2.6;rr(x,y,w,h,10);ctx.stroke();
  ctx.fillStyle="rgba(255,255,255,.4)";rr(x+6,y+4,w-12,5,3);ctx.fill();
  ctx.fillStyle="rgba(16,58,34,.16)";rr(x+6,y+h-8,w-12,4,2);ctx.fill();
}
function drawPipes(){
  for(var i=0;i<pipes.length;i++){
    var p=pipes[i],gTop=p.gap-gapSize/2,gBot=p.gap+gapSize/2;
    drawShaft(p.x,-34,PIPE_W,gTop-CAP_H+34);
    drawCap(p.x-6,gTop-CAP_H,CAP_W,CAP_H);
    drawShaft(p.x,gBot+CAP_H,PIPE_W,groundY-(gBot+CAP_H)+18);
    drawCap(p.x-6,gBot,CAP_W,CAP_H);
    /* tiny rim light at the gap mouths */
    ctx.fillStyle="rgba(255,255,255,.22)";
    ctx.fillRect(p.x-4,gTop-3,PIPE_W+8,3);
    ctx.fillRect(p.x-4,gBot,PIPE_W+8,3);
  }
}

/* ---- ground ---- */
function grassYAt(x){return groundY-4+Math.sin((x+scroll.grass)*0.045)*4+Math.sin((x+scroll.grass)*0.011)*2;}

function drawGround(){
  var dg=ctx.createLinearGradient(0,groundY-10,0,H);
  dg.addColorStop(0,"#c68d52");dg.addColorStop(0.4,"#a2703a");dg.addColorStop(1,"#7b4f26");
  ctx.fillStyle=dg;ctx.fillRect(0,groundY-10,W,H-groundY+10);

  ctx.fillStyle="rgba(58,34,14,.16)";
  var s1=54,o1=scroll.dirt%s1,x;
  for(x=-s1;x<W+s1;x+=s1){rr(x-o1,groundY+40,30,7,3);ctx.fill();}
  var s2=96,o2=(scroll.dirt*0.62)%s2;
  for(x=-s2;x<W+s2;x+=s2){rr(x-o2,groundY+84,46,9,4);ctx.fill();}

  /* grass band with wavy crest */
  var gg=ctx.createLinearGradient(0,groundY-14,0,groundY+24);
  gg.addColorStop(0,"#8ade74");gg.addColorStop(1,"#5aa857");
  ctx.beginPath();
  ctx.moveTo(0,grassYAt(0));
  for(var gx=0;gx<=W;gx+=8)ctx.lineTo(gx,grassYAt(gx));
  ctx.lineTo(W,groundY+24);ctx.lineTo(0,groundY+24);ctx.closePath();
  ctx.fillStyle=gg;ctx.fill();

  ctx.beginPath();
  ctx.moveTo(0,grassYAt(0));
  for(gx=0;gx<=W;gx+=8)ctx.lineTo(gx,grassYAt(gx));
  ctx.strokeStyle="rgba(168,242,152,.85)";ctx.lineWidth=4.5;ctx.stroke();

  ctx.fillStyle="rgba(32,70,36,.22)";ctx.fillRect(0,groundY+22,W,3);

  /* pebbles */
  for(var i=0;i<pebbles.length;i++){
    var q=pebbles[i];
    ctx.fillStyle="rgba(255,240,215,.28)";ell(q.x,q.y,q.r,q.r*0.8);ctx.fill();
    ctx.fillStyle="rgba(70,44,20,.25)";ell(q.x,q.y+q.r*0.55,q.r*0.9,q.r*0.4);ctx.fill();
  }

  /* tufts + flowers on the grass crest */
  ctx.lineCap="round";ctx.strokeStyle="#6fc25e";ctx.lineWidth=2.4;
  for(i=0;i<tufts.length;i++){
    var t=tufts[i],y=grassYAt(t.x)-1;
    ctx.beginPath();ctx.moveTo(t.x,y);ctx.lineTo(t.x-t.lean*6,y-t.h);ctx.stroke();
    ctx.beginPath();ctx.moveTo(t.x+3,y);ctx.lineTo(t.x+6+t.lean*4,y-t.h*0.72);ctx.stroke();
  }
  for(i=0;i<flowers.length;i++){var f=flowers[i];daisy(f.x+4,grassYAt(f.x+4)-7,f.s,f.c);}
}

function daisy(x,y,r,c){
  ctx.save();ctx.translate(x,y);
  ctx.fillStyle="#ffe9a8";
  for(var i=0;i<5;i++){
    var a=i/5*TAU;
    ell(Math.cos(a)*r*1.15,Math.sin(a)*r*1.15,r*0.62,r*0.5);ctx.fill();
  }
  ctx.fillStyle=c;
  ell(0,0,r*0.62,r*0.55);ctx.fill();
  ctx.restore();
}

function drawPetals(){
  for(var i=0;i<petals.length;i++){
    var p=petals[i];
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.sw);
    ctx.globalAlpha=0.75;ctx.fillStyle=p.c;
    ell(0,0,p.s,p.s*0.45);ctx.fill();
    ctx.restore();

/* ---- particles ---- */
function star4(x,y,r,c,rot){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.fillStyle=c;
  ctx.beginPath();
  ctx.moveTo(0,-r);ctx.lineTo(r*0.3,-r*0.3);ctx.lineTo(r,0);ctx.lineTo(r*0.3,r*0.3);
  ctx.lineTo(0,r);ctx.lineTo(-r*0.3,r*0.3);ctx.lineTo(-r,0);ctx.lineTo(-r*0.3,-r*0.3);
  ctx.closePath();ctx.fill();ctx.restore();
}
function drawParticles(){
  for(var i=0;i<parts.length;i++){
    var p=parts[i],a=clamp(p.life/p.max,0,1);
    if(p.k==="puff"){
      ctx.fillStyle="rgba(255,255,255,"+(a*0.5)+")";
      var rp=p.r*(1+(1-a)*0.8);ell(p.x,p.y,rp,rp);ctx.fill();
    }else if(p.k==="smoke"){
      ctx.fillStyle="rgba(126,138,148,"+(a*0.4)+")";
      var rs=p.r*(1+(1-a)*1.2);ell(p.x,p.y,rs,rs);ctx.fill();
    }else if(p.k==="feather"){
      ctx.save();ctx.globalAlpha=a;ctx.translate(p.x,p.y);ctx.rotate(p.rot);
      ctx.fillStyle=p.c;ell(0,0,p.r,p.r*0.55);ctx.fill();ctx.restore();
    }else{
      ctx.save();ctx.globalAlpha=a;
      star4(p.x,p.y,p.r*(0.6+a*0.7),p.c,p.rot);
      ctx.restore();
    }
  }
  ctx.globalAlpha=1;
}

/* ---- the bird ---- */
function wing(px,py,s,color){
  var t=clamp((bird.wPos+1.15)/2.2,0,1);
  var ang=lerp(-1.18,0.84,t);
  ctx.save();ctx.translate(px,py);ctx.rotate(ang);ctx.scale(s,s);
  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.bezierCurveTo(12,-8,26,-4,21,9);
  ctx.bezierCurveTo(13,12,5,7,0,0);
  ctx.closePath();
  ctx.fillStyle=color;ctx.fill();
  ctx.strokeStyle="rgba(126,84,28,.34)";ctx.lineWidth=1.8;ctx.stroke();
  ctx.fillStyle="rgba(255,255,255,.45)";ell(9,-2,7,4);ctx.fill();
  ctx.restore();
}

function drawBird(){
  var sway=Math.sin(T*6)*1.6;

  ctx.save();
  ctx.translate(bird.x,bird.y);
  ctx.rotate(bird.rot);
  ctx.scale(bird.sx,bird.sy);

  /* tail */
  ctx.save();ctx.translate(-BODY_RX+1,-2);ctx.rotate(0.25);
  ctx.fillStyle="rgba(255,214,96,.85)";ell(-5,0,10,6);ctx.fill();
  ctx.fillStyle="rgba(255,240,200,.6)";ell(-7,-3,6,3.4);ctx.fill();
  ctx.restore();

  /* far wing (behind body) */
  wing(-8,-5,0.82,"rgba(255,232,186,.78)");

  /* body */
  var bg=ctx.createRadialGradient(-4,-7,4,0,0,BODY_RX+6);
  bg.addColorStop(0,"#fff4d0");bg.addColorStop(0.55,"#ffd45e");bg.addColorStop(1,"#f6b43c");
  ctx.fillStyle=bg;ell(0,0,BODY_RX,BODY_RY);ctx.fill();
  ctx.strokeStyle="rgba(132,86,26,.5)";ctx.lineWidth=2;ctx.stroke();

  /* belly */
  ctx.fillStyle="rgba(255,247,226,.85)";ell(4,6,12,8.4);ctx.fill();

  /* head sprig */
  ctx.strokeStyle="#f2ae3a";ctx.lineWidth=2.6;ctx.lineCap="round";
  ctx.beginPath();ctx.moveTo(-2,-BODY_RY+3);ctx.quadraticCurveTo(-5-sway,-BODY_RY-11,-8-sway,-BODY_RY-6);ctx.stroke();
  ctx.beginPath();ctx.moveTo(2,-BODY_RY+3);ctx.quadraticCurveTo(7+sway,-BODY_RY-13,11+sway,-BODY_RY-7);ctx.stroke();

  /* beak */
  var bk=ctx.createLinearGradient(12,-2,32,8);
  bk.addColorStop(0,"#ffb070");bk.addColorStop(1,"#ff8f4e");
  ctx.beginPath();
  ctx.moveTo(13,-2);
  ctx.bezierCurveTo(24,-1,30,2,31,4);
  ctx.bezierCurveTo(27,7,19,8,13,7);
  ctx.closePath();
  ctx.fillStyle=bk;ctx.fill();
  ctx.strokeStyle="rgba(150,72,26,.5)";ctx.lineWidth=1.6;ctx.stroke();
  ctx.fillStyle="rgba(220,102,56,.85)";
  ctx.beginPath();ctx.moveTo(13,5);ctx.lineTo(27,7);ctx.lineTo(13,9);ctx.closePath();ctx.fill();

  /* eyes */
  var lid=bird.blink>0?Math.sin(bird.blink*Math.PI):0;
  var ex=[9,16],ey=[-5,-6];
  for(var i=0;i<2;i++){
    if(!bird.alive){
      ctx.strokeStyle="#5c3d18";ctx.lineWidth=2.6;ctx.lineCap="round";
      var r=5.4,s2=ex[i],s3=ey[i];
      ctx.beginPath();ctx.moveTo(s2-r,s3-r);ctx.lineTo(s2+r,s3+r);ctx.stroke();
      ctx.beginPath();ctx.moveTo(s2+r,s3-r);ctx.lineTo(s2-r,s3+r);ctx.stroke();
    }else if(lid>0.55){
      ctx.strokeStyle="#6f4d21";ctx.lineWidth=2.4;ctx.lineCap="round";
      ctx.beginPath();ctx.arc(ex[i],ey[i]+2,6,Math.PI*0.15,Math.PI*0.85);ctx.stroke();
    }else{
      ctx.fillStyle="#ffffff";ell(ex[i],ey[i],6.2,7.0);ctx.fill();
      ctx.strokeStyle="rgba(96,66,28,.45)";ctx.lineWidth=1.4;ctx.stroke();
      var px2=ex[i]+1.6+clamp(bird.vy*0.004,-1.4,1.8),py2=ey[i]+1.2;
      ctx.fillStyle="#3a2b16";ell(px2,py2,2.7,3.1);ctx.fill();
      ctx.fillStyle="rgba(255,255,255,.95)";ell(px2-1.1,py2-1.3,1.1,1.2);ctx.fill();
    }
  }

  /* blush */
  ctx.fillStyle="rgba(255,142,164,.5)";ell(7,8,5,3);ctx.fill();
  ctx.fillStyle="rgba(255,142,164,.3)";ell(-4,9,4,2.6);ctx.fill();

  /* near wing (over body) */
  wing(-2,-1,1,"#fff6df");

  /* sweat drop when hurt */
  if(!bird.alive){
    var sw=0.35+0.35*Math.sin(T*7);
    ctx.fillStyle="rgba(150,210,250,"+sw+")";
    ctx.beginPath();
    ctx.moveTo(-6,-BODY_RY-2);ctx.quadraticCurveTo(-3,-BODY_RY+5,-4,-BODY_RY+7);
    ctx.quadraticCurveTo(-8,-BODY_RY+6,-6,-BODY_RY-2);ctx.fill();
  }

  ctx.restore();

  /* dizzy stars once settled on the ground */
  if(state==="dead"&&landed){
    for(var s=0;s<3;s++){
      var a=T*2.4+s*(TAU/3);
      var ox=bird.x+Math.cos(a)*26,oy=bird.y-BODY_RY-14+Math.sin(a)*9;
      star4(ox,oy,5.5,s===0?"#ffe3a4":"#fff6df",a*1.6);
    }
  }
}

  if(panelIn<=0)return;
  var t=clamp(panelIn,0,1),e=easeOutBack(t);
  var cx=W/2,cy=H*0.24,pw=344,ph=252;

  ctx.save();
  ctx.translate(cx,cy+ph/2);ctx.scale(e,e);ctx.translate(-cx,-(cy+ph/2));
  ctx.shadowColor="rgba(0,0,0,.5)";ctx.shadowBlur=30;ctx.shadowOffsetY=12;
  ctx.fillStyle="rgba(255,251,238,.95)";rr(cx-pw/2,cy,pw,ph,24);ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.translate(cx,cy+ph/2);ctx.scale(e,e);ctx.translate(-cx,-(cy+ph/2));
  ctx.strokeStyle="rgba(255,214,132,.95)";ctx.lineWidth=3;rr(cx-pw/2,cy,pw,ph,24);ctx.stroke();

  ctx.textAlign="center";ctx.textBaseline="middle";ctx.lineJoin="round";
  ctx.font="bold 40px "+FONT;
  ctx.lineWidth=7;ctx.strokeStyle="rgba(96,45,40,.55)";ctx.strokeText("game over",cx,cy+34);
  ctx.fillStyle="#c8584f";ctx.fillText("game over",cx,cy+34);

  if(newBest){
    var pulse=0.85+0.15*Math.sin(T*6);
    ctx.save();ctx.translate(cx,cy+64);ctx.rotate(-0.06);ctx.scale(pulse,pulse);
    var ng=ctx.createLinearGradient(0,-13,0,13);
    ng.addColorStop(0,"#ffe08a");ng.addColorStop(1,"#ffab3d");
    ctx.fillStyle=ng;rr(-62,-13,124,26,13);ctx.fill();
    ctx.strokeStyle="rgba(255,255,255,.75)";ctx.lineWidth=2;rr(-62,-13,124,26,13);ctx.stroke();
    ctx.fillStyle="#7a4a12";ctx.font="bold 16px "+FONT;ctx.fillText("new best!",0,0);
    ctx.restore();
  }else{
    ctx.font="bold 14px "+FONT;ctx.fillStyle="#9b8663";
    ctx.fillText("best: "+best+"   ·   keep flapping!",cx,cy+64);
  }

  ctx.strokeStyle="rgba(182,160,122,.35)";ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(cx-pw/2+26,cy+82);ctx.lineTo(cx+pw/2-26,cy+82);ctx.stroke();

  medalCircle(cx-96,cy+126,medal);
  statBox(cx-34,cy+92,94,72,"score",String(score));
  statBox(cx+74,cy+92,94,72,"best",String(best));

  var hint=0.5+0.5*Math.abs(Math.sin(T*2.4));
  ctx.globalAlpha=hint;
  ctx.font="bold 15px "+FONT;ctx.fillStyle="#5f6f50";
  ctx.fillText("tap · space — try again",cx,cy+ph-22);
  ctx.globalAlpha=1;
  ctx.restore();
}

function drawPaused(){
  ctx.fillStyle="rgba(12,26,40,.45)";ctx.fillRect(0,0,W,H);
  ctx.save();
  ctx.shadowColor="rgba(0,0,0,.4)";ctx.shadowBlur=22;ctx.shadowOffsetY=8;
  ctx.fillStyle="rgba(255,251,238,.92)";rr(W/2-150,H/2-62,300,124,20);ctx.fill();
  ctx.restore();
  ctx.strokeStyle="rgba(255,214,132,.9)";ctx.lineWidth=3;rr(W/2-150,H/2-62,300,124,20);ctx.stroke();
  ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.font="bold 34px "+FONT;ctx.fillStyle="#6a5636";ctx.fillText("paused",W/2,H/2-26);
  ctx.font="bold 15px "+FONT;ctx.fillStyle="#7b6b4d";ctx.fillText("tap · space to resume",W/2,H/2+24);
}

/* ---------- render ---------- */
function render(){
  ctx.setTransform(scale*dpr,0,0,scale*dpr,0,0);

  ctx.save();
  if(shake>0){var s=shake*0.7;ctx.translate(rnd(-s,s),rnd(-s,s));}

  drawSky();
  drawSkyBirds();
  ridge(scroll.far,groundY-118,46,0.9,2.3,"rgba(126,170,205,.5)");
  ridge(scroll.far*1.5,groundY-76,34,1.25,3.1,"rgba(104,152,192,.52)");
  drawClouds();
  ridge(scroll.mid,groundY-32,22,1.7,4.2,"rgba(120,186,136,.72)");
  drawTrees();
  drawBushes();
  drawPipes();
  drawGround();
  drawPetals();
  drawParticles();
  drawBird();
  ctx.restore();

  drawVignette();
  drawScore();
  drawSoundBtn();

  if(state==="ready")drawReady();
  else if(state==="dead")drawDead();
  if(paused&&state==="playing")drawPaused();

  /* small best chip while playing */
  if(state==="playing"||state==="dying"){
    ctx.textAlign="left";ctx.textBaseline="middle";
    ctx.font="bold 14px "+FONT;
    ctx.fillStyle="rgba(255,255,255,.6)";
    ctx.fillText("best "+best,26,H-16);
  }
}

/* ---------- input ---------- */
function toggleMute(){muted=!muted;setStore(MUTE_KEY,muted?"1":"0");if(!muted)audio();}

cvs.addEventListener("pointerdown",function(e){
  e.preventDefault();
  var r=cvs.getBoundingClientRect();
  var x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;
  var dx=x-muteBtn.x,dy=y-muteBtn.y;
  if(Math.sqrt(dx*dx+dy*dy)<=muteBtn.r+5){toggleMute();return;}
  flap();
},{passive:false});

window.addEventListener("keydown",function(e){
  var k=e.code||e.key;
  if(k==="Space"||k===" "||k==="ArrowUp"||k==="KeyW"||k==="Enter"){
    e.preventDefault();if(!e.repeat)flap();return;
  }
  if(k==="KeyM"||k==="m"){toggleMute();return;}
  if(k==="KeyP"||k==="Escape"){if(state==="playing")paused=!paused;return;}
  if(k==="KeyR"){reset();startGame();return;}
});
window.addEventListener("resize",resize);
window.addEventListener("orientationchange",resize);
document.addEventListener("visibilitychange",function(){
  if(document.hidden&&state==="playing")paused=true;
});

/* ---------- main loop ---------- */
var last=0;
function loop(ts){
  var dt=Math.min(0.032,(ts-last)/1000)||0;
  last=ts;
  if(!paused)update(dt);
  render();
  requestAnimationFrame(loop);
}

resize();
buildScenery();
reset();
requestAnimationFrame(function(t){last=t;requestAnimationFrame(loop);});
})();
</script>
</body>
</html>
