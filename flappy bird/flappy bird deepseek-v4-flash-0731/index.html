<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cute Flappy Bird</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(180deg, #87CEEB 0%, #cfe9f7 60%, #eaf7fb 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Segoe UI', 'Varela Round', system-ui, sans-serif;
    overflow: hidden;
  }
  #wrap {
    position: relative;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    border-radius: 18px;
    overflow: hidden;
  }
  canvas {
    display: block;
    background: #87CEEB;
    border-radius: 18px;
  }
  #hint {
    position: absolute;
    bottom: 12px;
    left: 0;
    right: 0;
    text-align: center;
    color: #fff;
    text-shadow: 0 2px 4px rgba(0,0,0,0.4);
    font-weight: 600;
    font-size: 14px;
    pointer-events: none;
  }
  #hint kbd {
    background: rgba(255,255,255,0.85);
    color: #555;
    border-radius: 6px;
    padding: 2px 8px;
    font-family: inherit;
    box-shadow: 0 2px 0 rgba(0,0,0,0.2);
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="420" height="640"></canvas>
  <div id="hint">Press <kbd>Space</kbd> / click / tap to flap</div>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width;
  const H = canvas.height;

  // ---------- Config ----------
  const GROUND_H = 92;
  const PIPE_W = 64;
  const GAP = 152;
  const PIPE_SPACING = 215;
  const PIPE_SPEED = 2.4;
  const GRAVITY = 0.42;
  const FLAP_VY = -7.6;
  const MAX_VY = 11;
  const BIRD_X = 118;
  const BIRD_W = 40;
  const BIRD_H = 30;

  // ---------- Audio (Web Audio, cute synth sounds) ----------
  let audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }
  function beep(freq, dur, type = 'sine', vol = 0.15, slideTo = null) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + dur);
  }
  const sndFlap = () => beep(520, 0.09, 'sine', 0.12, 880);
  const sndPoint = () => { beep(880, 0.08, 'sine', 0.13); beep(1320, 0.1, 'sine', 0.1); };
  const sndHit = () => beep(220, 0.25, 'sawtooth', 0.2, 70);
  const sndDie = () => beep(330, 0.35, 'triangle', 0.2, 90);

  // ---------- State ----------
  let state = 'ready';        // ready | playing | dead
  let bird = { y: 0, vy: 0, rot: 0, t: 0 };
  let pipes = [];
  let clouds = [];
  let hills = [];
  let bushes = [];
  let groundX = 0;
  let score = 0;
  let best = 0;
  let frame = 0;
  let dieTimer = 0;
  let scoredId = -1;

  // ---------- Generate parallax layers ----------
  function makeCloud() {
    const sizes = [26, 38, 52];
    const s = sizes[Math.floor(Math.random() * sizes.length)];
    return {
      x: Math.random() * W,
      y: Math.random() * 150 + 10,
      s, speed: 0.2 + Math.random() * 0.3
    };
  }
  function makeHill() {
    return {
      x: Math.random() * (W + 100) - 50,
      y: 440 + Math.random() * 40,
      w: 140 + Math.random() * 120,
      h: 70 + Math.random() * 80,
      speed: 0.55 + Math.random() * 0.3,
      hue: Math.random() < 0.5 ? '#a8dca0' : '#8fd08f'
    };
  }
  function makeBush() {
    return {
      x: Math.random() * W,
      y: 0,
      s: 8 + Math.random() * 8,
      speed: 0.9 + Math.random() * 0.5
    };
  }
  for (let i = 0; i < 7; i++) clouds.push(makeCloud());
  for (let i = 0; i < 6; i++) hills.push(makeHill());
  for (let i = 0; i < 12; i++) bushes.push(makeBush());

  function makePipe(fromRight = false) {
    const margin = 90;
    const topH = margin + Math.random() * (H - GROUND_H - GAP - margin * 2);
    return {
      x: fromRight ? W + PIPE_W : W,
      topH,
      scored: false
    };
  }

  function reset() {
    bird.y = H * 0.42;
    bird.vy = 0;
    bird.rot = 0;
    pipes = [];
    scoredId = -1;
    score = 0;
    dieTimer = 0;
    state = 'ready';
    pipes.push(makePipe(true));
    pipes.push(makePipe(true));
    pipes[0].x = W + 90;
    pipes[1].x = W + 90 + PIPE_SPACING;
  }

  // ---------- Input ----------
  function flap() {
    ensureAudio();
    if (state === 'ready') {
      state = 'playing';
    } else if (state === 'dead') {
      if (dieTimer > 28) reset();
      return;
    }
    if (state === 'playing') {
      bird.vy = FLAP_VY;
      sndFlap();
    }
  }
  addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      e.preventDefault();
      flap();
    }
  });
  canvas.addEventListener('pointerdown', e => { e.preventDefault(); flap(); });

  // ---------- Update ----------
  function update() {
    frame++;

    if (state === 'playing') {
      bird.vy = Math.min(bird.vy + GRAVITY, MAX_VY);
      bird.y += bird.vy;

      const target = bird.vy < 0 ? -0.4 : Math.min(1.3, bird.vy * 0.09);
      bird.rot += (target - bird.rot) * 0.18;

      // pipes move + score
      for (let i = pipes.length - 1; i >= 0; i--) {
        const p = pipes[i];
        p.x -= PIPE_SPEED;
        if (!p.scored && p.x + PIPE_W < BIRD_X - BIRD_W / 2) {
          p.scored = true;
          score++;
          best = Math.max(best, score);
          sndPoint();
        }
        if (p.x < -PIPE_W * 2) pipes.splice(i, 1);
      }
      // spawn
      const last = pipes[pipes.length - 1];
      if (!last || last.x < W - PIPE_SPACING) pipes.push(makePipe());

      // collisions
      if (bird.y + BIRD_H / 2 >= H - GROUND_H) {
        bird.y = H - GROUND_H - BIRD_H / 2;
        die();
      }
      if (bird.y - BIRD_H / 2 <= 0) { bird.y = BIRD_H / 2; bird.vy = 0; }

      for (const p of pipes) {
        if (BIRD_X + BIRD_W / 2 > p.x && BIRD_X - BIRD_W / 2 < p.x + PIPE_W) {
          const gapTop = p.topH;
          const gapBot = gapTop + GAP;
          if (bird.y - BIRD_H / 2 < gapTop || bird.y + BIRD_H / 2 > gapBot) {
            die();
            break;
          }
        }
      }
    } else if (state === 'dead') {
      dieTimer++;
      // falling after death with a wobble
      if (bird.y + BIRD_H / 2 < H - GROUND_H) {
        bird.vy = Math.min(bird.vy + GRAVITY, MAX_VY);
        bird.y += bird.vy;
      }
      bird.rot += (1.5 - bird.rot) * 0.12;
    }

    // parallax layers always drift (clouds keep drifting even on game over for liveliness)
    groundX = (groundX - (state === 'dead' ? 1 : PIPE_SPEED)) % 24;
    for (const c of clouds) {
      c.x -= c.speed;
      if (c.x < -60) { c.x = W + 60; c.y = Math.random() * 150 + 10; }
    }
    for (const h of hills) {
      h.x -= h.speed;
      if (h.x < -h.w) { h.x = W + 40; }
    }
    for (const b of bushes) {
      b.x -= b.speed;
      if (b.x < -20) { b.x = W + 20; b.y = Math.random() * 10; }
    }
  }

  function die() {
    if (state === 'dead') return;
    state = 'dead';
    bird.vy = -5;
    dieTimer = 0;
    sndHit();
    setTimeout(sndDie, 120);
  }

  // ---------- Draw ----------
  function drawCloud(c) {
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.s, 0, Math.PI * 2);
    ctx.arc(c.x + c.s * 0.9, c.y - c.s * 0.2, c.s * 0.75, 0, Math.PI * 2);
    ctx.arc(c.x + c.s * 1.7, c.y + c.s * 0.15, c.s * 0.6, 0, Math.PI * 2);
    ctx.arc(c.x - c.s * 0.8, c.y + c.s * 0.2, c.s * 0.55, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawHill(h) {
    ctx.fillStyle = h.hue;
    ctx.beginPath();
    ctx.moveTo(h.x, H - GROUND_H);
    ctx.quadraticCurveTo(h.x + h.w / 2, h.y - h.h, h.x + h.w, H - GROUND_H);
    ctx.closePath();
    ctx.fill();
  }

  function drawBush(b) {
    ctx.fillStyle = '#6fbf6f';
    ctx.beginPath();
    ctx.arc(b.x, H - GROUND_H + 8 + b.y, b.s, Math.PI, 0);
    ctx.arc(b.x + b.s * 1.2, H - GROUND_H + 8 + b.y, b.s * 0.8, Math.PI, 0);
    ctx.fill();
  }

  function drawPipe(p) {
    const botTop = p.topH + GAP;
    const body = '#5cb85c';
    const edge = '#3d8a3d';
    const lip = '#79c97a';

    // top pipe
    ctx.fillStyle = body;
    ctx.fillRect(p.x, 0, PIPE_W, p.topH - 14);
    ctx.fillStyle = lip;
    ctx.fillRect(p.x - 3, p.topH - 24, PIPE_W + 6, 24);
    // bottom pipe
    ctx.fillStyle = body;
    ctx.fillRect(p.x, botTop + 14, PIPE_W, H - GROUND_H - botTop - 14);
    ctx.fillStyle = lip;
    ctx.fillRect(p.x - 3, botTop, PIPE_W + 6, 24);
    // shading highlights
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.fillRect(p.x + 6, 0, 10, p.topH - 14);
    ctx.fillRect(p.x + 6, botTop + 14, 10, H - GROUND_H - botTop - 14);
    // dark edges
    ctx.strokeStyle = edge;
    ctx.lineWidth = 3;
    ctx.strokeRect(p.x - 3, p.topH - 24, PIPE_W + 6, 24);
    ctx.strokeRect(p.x - 3, botTop, PIPE_W + 6, 24);
    ctx.strokeRect(p.x, 0, PIPE_W, p.topH - 14);
    ctx.strokeRect(p.x, botTop + 14, PIPE_W, H - GROUND_H - botTop - 14);
  }

  function drawBird() {
    ctx.save();
    ctx.translate(BIRD_X, bird.y);
    ctx.rotate(bird.rot);

    // wing flap animation - wing cycles only while playing
    const flapPhase = (state === 'playing' || state === 'ready') ? Math.sin(frame * 0.5) : 0.35;
    const wingY = -3 + flapPhase * 5;

    // body
    ctx.fillStyle = '#FFD23F';
    ctx.beginPath();
    ctx.ellipse(0, 0, BIRD_W / 2, BIRD_H / 2, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#E8A928';
    ctx.lineWidth = 2.5;
    ctx.stroke();

    // belly
    ctx.fillStyle = '#FFF3C4';
    ctx.beginPath();
    ctx.ellipse(3, 6, 12, 8, 0, 0, Math.PI * 2);
    ctx.fill();

    // wing
    ctx.fillStyle = '#F5B62C';
    ctx.beginPath();
    ctx.ellipse(-6, wingY, 10, 7, -0.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#E8A928';
    ctx.lineWidth = 2;
    ctx.stroke();

    // eye
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(9, -6, 7, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#C98A1B';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = '#333';
    ctx.beginPath();
    ctx.arc(11.5, -5, 3.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(12.6, -6, 1.1, 0, Math.PI * 2);
    ctx.fill();

    // beak
    ctx.fillStyle = '#FF8A3D';
    ctx.beginPath();
    ctx.moveTo(15, 0);
    ctx.lineTo(27, 2.5);
    ctx.lineTo(15, 6);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#E0691F';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // blush
    ctx.fillStyle = 'rgba(255,120,120,0.4)';
    ctx.beginPath();
    ctx.arc(8, 4, 3.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function drawGround() {
    // dirt
    ctx.fillStyle = '#e8c07a';
    ctx.fillRect(0, H - GROUND_H, W, GROUND_H);
    ctx.fillStyle = '#d4a55e';
    ctx.fillRect(0, H - GROUND_H, W, 6);
    // grass top
    ctx.fillStyle = '#7ed957';
    ctx.fillRect(0, H - GROUND_H, W, 16);
    // grass blade stripes (darker tufts)
    ctx.fillStyle = '#5cb85c';
    for (let i = 0; i < W; i += 24) {
      const x = i + ((groundX % 24) + 24) % 24;
      ctx.beginPath();
      ctx.moveTo(x, H - GROUND_H + 16);
      ctx.lineTo(x - 3, H - GROUND_H + 8);
      ctx.lineTo(x, H - GROUND_H + 3);
      ctx.lineTo(x + 3, H - GROUND_H + 8);
      ctx.closePath();
      ctx.fill();
    }
    // dirt speckles
    ctx.fillStyle = 'rgba(0,0,0,0.07)';
    for (let i = 0; i < W; i += 36) {
      ctx.fillRect(i + ((groundX * 2 % 36) + 36) % 36, H - GROUND_H + 34, 12, 5);
      ctx.fillRect(i + 14 + ((groundX % 36) + 36) % 36, H - GROUND_H + 58, 8, 4);
    }
  }

  function drawScore() {
    ctx.textAlign = 'center';
    ctx.font = 'bold 44px "Varela Round", "Segoe UI", sans-serif';
    ctx.lineWidth = 8;
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    ctx.strokeText(score, W / 2, 70);
    ctx.fillStyle = '#fff';
    ctx.fillText(score, W / 2, 70);
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawReady() {
    ctx.textAlign = 'center';
    ctx.font = 'bold 42px "Varela Round", "Segoe UI", sans-serif';
    ctx.lineWidth = 8;
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    ctx.strokeText('Flappy Bird', W / 2, 130);
    ctx.fillStyle = '#fff';
    ctx.fillText('Flappy Bird', W / 2, 130);

    ctx.font = 'bold 22px "Varela Round", "Segoe UI", sans-serif';
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    ctx.lineWidth = 5;
    ctx.strokeText('Tap or press Space to start', W / 2, 175);
    ctx.fillStyle = '#fff8dc';
    ctx.fillText('Tap or press Space to start', W / 2, 175);

    // bobbing bird hint handled by state==='ready' gentle sine
    if (state === 'ready') {
      bird.y = H * 0.42 + Math.sin(frame * 0.06) * 8;
      bird.rot = Math.sin(frame * 0.08) * 0.12;
    }
  }

  function drawGameOver() {
    ctx.textAlign = 'center';
    ctx.font = 'bold 40px "Varela Round", "Segoe UI", sans-serif';
    ctx.lineWidth = 8;
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    ctx.strokeText('Game Over', W / 2, 180);
    ctx.fillStyle = '#fff';
    ctx.fillText('Game Over', W / 2, 180);

    const panelW = 220;
    const panelH = 120;
    const px = W / 2 - panelW / 2;
    const py = H * 0.42 - panelH / 2;

    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    roundRect(px, py, panelW, panelH, 16);
    ctx.fill();
    ctx.strokeStyle = '#7ed957';
    ctx.lineWidth = 5;
    roundRect(px, py, panelW, panelH, 16);
    ctx.stroke();

    ctx.font = 'bold 24px "Varela Round", "Segoe UI", sans-serif';
    ctx.fillStyle = '#c98a1b';
    ctx.fillText('Score', W / 2, py + 34);
    ctx.font = 'bold 34px "Varela Round", "Segoe UI", sans-serif';
    ctx.fillStyle = '#555';
    ctx.fillText(score, W / 2, py + 66);

    ctx.font = 'bold 15px "Varela Round", "Segoe UI", sans-serif';
    ctx.fillStyle = '#999';
    ctx.fillText('Best: ' + best, W / 2, py + 96);

    if (dieTimer > 28) {
      const a = Math.min(1, (dieTimer - 28) / 20);
      ctx.globalAlpha = a;
      ctx.font = 'bold 20px "Varela Round", "Segoe UI", sans-serif';
      ctx.strokeStyle = 'rgba(0,0,0,0.35)';
      ctx.lineWidth = 5;
      ctx.strokeText('Tap to play again', W / 2, py + panelH + 40);
      ctx.fillStyle = '#fff8dc';
      ctx.fillText('Tap to play again', W / 2, py + panelH + 40);
      ctx.globalAlpha = 1;
    }
  }

  function draw() {
    // sky gradient
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#8fd0f5');
    sky.addColorStop(0.7, '#bde7fb');
    sky.addColorStop(1, '#eaf7fb');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    // sun
    ctx.fillStyle = 'rgba(255,240,150,0.85)';
    ctx.beginPath();
    ctx.arc(352, 68, 30, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.beginPath();
    ctx.arc(344, 58, 10, 0, Math.PI * 2);
    ctx.fill();

    for (const c of clouds) drawCloud(c);
    for (const h of hills) drawHill(h);
    for (const b of bushes) drawBush(b);
    for (const p of pipes) drawPipe(p);

    drawGround();
    drawBird();

    if (state === 'ready') drawReady();
    if (state === 'playing') drawScore();
    if (state === 'dead') { drawScore(); drawGameOver(); }
  }

  // ---------- Loop ----------
  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  reset();
  loop();
})();
</script>
</body>
</html>
