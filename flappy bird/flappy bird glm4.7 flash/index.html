<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cute Flappy Bird</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .game-container {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        canvas {
            display: block;
        }

        .score-display {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 48px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            z-index: 10;
            pointer-events: none;
        }

        .game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
        }

        .game-over-screen.hidden {
            display: none;
        }

        .game-over-screen h2 {
            color: white;
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .final-score {
            color: white;
            font-size: 24px;
            margin-bottom: 30px;
        }

        .restart-btn {
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .restart-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        .restart-btn:active {
            transform: translateY(0);
        }

        .start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            cursor: pointer;
        }

        .start-screen.hidden {
            display: none;
        }

        .start-screen h2 {
            color: white;
            font-size: 36px;
            margin-bottom: 20px;
            animation: bounce 1s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .press-any {
            color: white;
            font-size: 18px;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="scoreDisplay" class="score-display">0</div>
        
        <div id="startScreen" class="start-screen">
            <h2>Cute Flappy Bird</h2>
            <p class="press-any">Press Space or Click to Start</p>
        </div>

        <div id="gameOverScreen" class="game-over-screen hidden">
            <h2>Game Over!</h2>
            <p class="final-score">Score: <span id="finalScore">0</span></p>
            <button class="restart-btn" onclick="restartGame()">Play Again</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = 400;
        canvas.height = 600;

        const GRAVITY = 0.4;
        const FLAP_STRENGTH = -8;
        const PIPE_SPEED = 3;
        const PIPE_SPAWN_RATE = 90;
        const PIPE_GAP = 150;
        const PIPE_WIDTH = 60;
        const BIRD_SIZE = 30;

        let gameState = 'start';
        let score = 0;
        let frames = 0;
        let bestScore = 0;

        const bird = {
            x: 80,
            y: canvas.height / 2,
            velocity: 0,
            rotation: 0,
            wingAngle: 0,
            wingDirection: 1
        };

        let pipes = [];
        let stars = [];
        let clouds = [];

        function initStarfield() {
            for (let i = 0; i < 100; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height * 0.6,
                    size: Math.random() * 2 + 1,
                    twinkle: Math.random() * Math.PI * 2
                });
            }
        }

        function initClouds() {
            for (let i = 0; i < 5; i++) {
                clouds.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height * 0.4,
                    width: Math.random() * 60 + 40,
                    speed: Math.random() * 0.5 + 0.2
                });
            }
        }

        function drawBackground() {
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#87CEEB');
            gradient.addColorStop(0.5, '#98D8E8');
            gradient.addColorStop(1, '#F7DC6F');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#4CAF50';
            ctx.beginPath();
            ctx.ellipse(canvas.width / 2, canvas.height, canvas.width * 0.8, 80, 0, 0, Math.PI * 2);
            ctx.fill();

            stars.forEach(star => {
                star.twinkle += 0.02;
                const alpha = 0.5 + Math.sin(star.twinkle) * 0.5;
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });

            clouds.forEach(cloud => {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.beginPath();
                ctx.arc(cloud.x, cloud.y, cloud.width * 0.3, 0, Math.PI * 2);
                ctx.arc(cloud.x + cloud.width * 0.3, cloud.y - cloud.width * 0.1, cloud.width * 0.25, 0, Math.PI * 2);
                ctx.arc(cloud.x + cloud.width * 0.6, cloud.y, cloud.width * 0.35, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function drawBird() {
            ctx.save();
            ctx.translate(bird.x, bird.y);
            ctx.rotate(bird.rotation);

            const wingOffset = Math.sin(bird.wingAngle) * 8;

            body: {
                const bodyGradient = ctx.createRadialGradient(-5, -5, 0, 0, 0, BIRD_SIZE);
                bodyGradient.addColorStop(0, '#FFE135');
                bodyGradient.addColorStop(1, '#F4D03F');
                ctx.fillStyle = bodyGradient;
                ctx.beginPath();
                ctx.ellipse(0, 0, BIRD_SIZE, BIRD_SIZE * 0.8, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#F9E79F';
                ctx.beginPath();
                ctx.ellipse(5, -5, BIRD_SIZE * 0.7, BIRD_SIZE * 0.5, 0, 0, Math.PI * 2);
                ctx.fill();
            }

            eye: {
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(8, -5, 10, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#2ECC71';
                ctx.beginPath();
                ctx.arc(10, -3, 5, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = 'black';
                ctx.beginPath();
                ctx.arc(11, -3, 2, 0, Math.PI * 2);
                ctx.fill();
            }

            beak: {
                ctx.fillStyle = '#E74C3C';
                ctx.beginPath();
                ctx.moveTo(15, 0);
                ctx.lineTo(30, 5);
                ctx.lineTo(15, 10);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = '#C0392B';
                ctx.beginPath();
                ctx.moveTo(15, 3);
                ctx.lineTo(25, 5);
                ctx.lineTo(15, 6);
                ctx.closePath();
                ctx.fill();
            }

            wing: {
                const wingGradient = ctx.createRadialGradient(-8, wingOffset, 0, 0, wingOffset, BIRD_SIZE * 0.6);
                wingGradient.addColorStop(0, '#F7DC6F');
                wingGradient.addColorStop(1, '#D4AC0D');
                ctx.fillStyle = wingGradient;
                ctx.beginPath();
                ctx.ellipse(-5, wingOffset, BIRD_SIZE * 0.7, BIRD_SIZE * 0.5, -0.3, 0, Math.PI * 2);
                ctx.fill();
            }

            tail: {
                const tailGradient = ctx.createRadialGradient(-BIRD_SIZE, 5, 0, -BIRD_SIZE, 0, BIRD_SIZE);
                tailGradient.addColorStop(0, '#F1C40F');
                tailGradient.addColorStop(1, '#D4AC0D');
                ctx.fillStyle = tailGradient;
                ctx.beginPath();
                ctx.moveTo(-BIRD_SIZE, 0);
                ctx.lineTo(-BIRD_SIZE * 1.8, -8);
                ctx.lineTo(-BIRD_SIZE * 1.8, 8);
                ctx.closePath();
                ctx.fill();
            }

            eyebrow: {
                ctx.fillStyle = '#8B4513';
                ctx.beginPath();
                ctx.ellipse(-5, -18, 6, 3, 0.2, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
        }

        function updateBird() {
            bird.velocity += GRAVITY;
            bird.y += bird.velocity;

            bird.wingAngle += 0.3 * bird.wingDirection;
            if (Math.abs(bird.wingAngle) > Math.PI / 4) {
                bird.wingDirection *= -1;
            }

            bird.rotation = Math.min(Math.max(bird.velocity * 0.05, -0.5), 1);
        }

        function drawPipe(pipe) {
            const pipeGradient = ctx.createLinearGradient(pipe.x, 0, pipe.x + PIPE_WIDTH, 0);
            pipeGradient.addColorStop(0, '#27AE60');
            pipeGradient.addColorStop(0.5, '#2ECC71');
            pipeGradient.addColorStop(1, '#1B5E20');

            const topPipeHeight = pipe.top;
            const bottomPipeY = pipe.top + PIPE_GAP;

            topPipe: {
                ctx.fillStyle = pipeGradient;
                ctx.fillRect(pipe.x, 0, PIPE_WIDTH, topPipeHeight);

                ctx.fillStyle = '#145A32';
                ctx.fillRect(pipe.x - 5, topPipeHeight - 30, PIPE_WIDTH + 10, 30);

                ctx.fillStyle = '#4CAF50';
                for (let i = 0; i < 3; i++) {
                    ctx.fillRect(pipe.x - 3 + i * 20, topPipeHeight - 32, 15, 4);
                }
            }

            bottomPipe: {
                ctx.fillStyle = pipeGradient;
                ctx.fillRect(pipe.x, bottomPipeY, PIPE_WIDTH, canvas.height - bottomPipeY);

                ctx.fillStyle = '#145A32';
                ctx.fillRect(pipe.x - 5, bottomPipeY, PIPE_WIDTH + 10, 30);

                ctx.fillStyle = '#4CAF50';
                for (let i = 0; i < 3; i++) {
                    ctx.fillRect(pipe.x - 3 + i * 20, bottomPipeY + 28, 15, 4);
                }
            }
        }

        function updatePipes() {
            if (frames % PIPE_SPAWN_RATE === 0) {
                const minHeight = 50;
                const maxHeight = canvas.height - PIPE_GAP - 50;
                const topHeight = Math.random() * (maxHeight - minHeight) + minHeight;
                pipes.push({
                    x: canvas.width,
                    top: topHeight,
                    scored: false
                });
            }

            pipes.forEach(pipe => {
                pipe.x -= PIPE_SPEED;

                if (!pipe.scored && pipe.x + PIPE_WIDTH < bird.x) {
                    pipe.scored = true;
                    score++;
                    document.getElementById('scoreDisplay').textContent = score;
                }
            });

            pipes = pipes.filter(pipe => pipe.x > -PIPE_WIDTH);
        }

        function checkCollision() {
            if (bird.y + BIRD_SIZE > canvas.height - 80) return true;
            if (bird.y - BIRD_SIZE < 0) return true;

            for (const pipe of pipes) {
                const pipeBottom = pipe.top + PIPE_GAP;
                const birdRight = bird.x + BIRD_SIZE;
                const birdLeft = bird.x - BIRD_SIZE;
                const birdTop = bird.y - BIRD_SIZE;
                const birdBottom = bird.y + BIRD_SIZE;

                if (birdRight > pipe.x && birdLeft < pipe.x + PIPE_WIDTH) {
                    if (birdTop < pipe.top || birdBottom > pipeBottom) {
                        return true;
                    }
                }
            }

            return false;
        }

        function flap() {
            if (gameState !== 'playing') return;
            bird.velocity = FLAP_STRENGTH;
            bird.wingDirection = 1;
        }

        function gameOver() {
            gameState = 'gameover';
            document.getElementById('gameOverScreen').classList.remove('hidden');
            document.getElementById('finalScore').textContent = score;
            if (score > bestScore) {
                bestScore = score;
            }
        }

        function gameLoop() {
            frames++;

            if (gameState === 'playing') {
                updateBird();
                updatePipes();

                if (checkCollision()) {
                    gameOver();
                }
            }

            drawBackground();
            pipes.forEach(drawPipe);
            drawBird();

            if (gameState === 'playing') {
                document.getElementById('scoreDisplay').style.display = 'block';
            }

            requestAnimationFrame(gameLoop);
        }

        function resetGame() {
            bird.y = canvas.height / 2;
            bird.velocity = 0;
            bird.rotation = 0;
            bird.wingAngle = 0;

            pipes = [];
            score = 0;
            frames = 0;
            document.getElementById('scoreDisplay').textContent = '0';
        }

        function startGame() {
            resetGame();
            gameState = 'playing';
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.add('hidden');
            document.getElementById('scoreDisplay').style.display = 'block';
        }

        function restartGame() {
            startGame();
        }

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                if (gameState === 'start') {
                    startGame();
                } else if (gameState === 'playing') {
                    flap();
                }
            }
        });

        canvas.addEventListener('click', () => {
            if (gameState === 'start') {
                startGame();
            } else if (gameState === 'playing') {
                flap();
            } else if (gameState === 'gameover') {
                startGame();
            }
        });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (gameState === 'start') {
                startGame();
            } else if (gameState === 'playing') {
                flap();
            }
        }, { passive: false });

        document.getElementById('startScreen').addEventListener('click', () => {
            if (gameState === 'start') {
                startGame();
            }
        });

        initStarfield();
        initClouds();
        gameLoop();
    </script>
</body>
</html>
