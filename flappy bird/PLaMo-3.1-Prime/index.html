<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Flappy Bird Style Game</title>
<style>
  body { margin: 0; overflow: hidden; background: #87CEEB; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="game" width="400" height="600"></canvas>
<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
let W = canvas.width, H = canvas.height;
let bird = { x: 50, y: H / 2, w: 20, h: 20, vy: 0, gravity: 0.5, flap: -8 };
let pipes = [];
let score = 0;
let gameOver = false;
let frameCount = 0;

function update() {
  if (gameOver) return;
  bird.vy += bird.gravity;
  bird.y += bird.vy;
  if (keys.flap) {
    bird.vy = bird.flap;
    keys.flap = false;
  }
  if (bird.y + bird.h <= 0 || bird.y >= H - 10 ||
      bird.x + bird.w > pipes[0]?.x + pipes[0].w || bird.x < pipes[0]?.x) {
    gameOver = true;
  }
  if (frameCount % 90 === 0) {
    const gap = 150 + Math.random() * 100;
    pipes.push({ x: W, width: 50, gapY: H / 2 - gap / 2, speed: 3 });
  }
  pipes = pipes.filter(p => p.x + p.width < 0);
  pipes.forEach(p => p.x -= p.speed);
  if (pipes.length > 0 && bird.x > pipes[0].x + pipes[0].width) {
    score++;
  }
  frameCount++;
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = "#87CEEB";
  ctx.fillRect(0, 0, W, H);
  pipes.forEach(p => {
    ctx.fillStyle = "#2E8B57";
    ctx.fillRect(p.x, 0, p.width, p.gapY);
    ctx.fillRect(p.x, p.gapY + 10, p.width, H - p.gapY - 10);
  });
  ctx.fillStyle = "#FFD700";
  ctx.fillRect(bird.x, bird.y, bird.w, bird.h);
  ctx.fillStyle = "#000";
  ctx.font = "20px Arial";
  ctx.fillText("Score: " + score, 10, 30);
  if (gameOver) {
    ctx.fillStyle = "#FF0000";
    ctx.fillText("Game Over", W / 2 - 75, H / 2);
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

const keys = { flap: false };
document.addEventListener("keydown", e => {
  if (e.code === "Space") keys.flap = true;
});
loop();
</script>
</body>
</html>
