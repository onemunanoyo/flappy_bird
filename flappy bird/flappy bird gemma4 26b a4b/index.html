<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cute Flappy Bird</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #222;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }
        canvas {
            border: 4px solid #fff;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            background-color: #70c5ce;
        }
        #ui {
            position: absolute;
            pointer-events: none;
            color: white;
            text-align: center;
            user-select: none;
        }
        .score-text {
            font-size: 48px;
            font-weight: bold;
            text-shadow: 2px 2px #000;
            margin-top: 20px;
        }
        .message {
            font-size: 24px;
            text-shadow: 1px 1px #000;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div id="ui">
        <div id="scoreDisplay" class="score-text">0</div>
        <div id="msgDisplay" class="message">Press SPACE or CLICK to Start</div>
    </div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const msgDisplay = document.getElementById('msgDisplay');

        // Game Constants
        const CANVAS_WIDTH = 400;
        const CANVAS_HEIGHT = 600;
        const GRAVITY = 0.25;
        const FLAP_STRENGTH = -5;
        const PIPE_SPEED = 2.5;
        const PIPE_SPAWN_RATE = 100; // frames
        const PIPE_GAP = 150;
        const BIRD_RADIUS = 15;

        canvas.width = CANVAS_WIDTH;
        canvas.height = CANVAS_HEIGHT;

        // Game State
        let bird, pipes, score, frameCount, gameState; 
        // gameState: 'START', 'PLAYING', 'GAMEOVER'

        class Bird {
            constructor() {
                this.x = 50;
                this.y = CANVAS_HEIGHT / 2;
                this.velocity = 0;
                this.radius = BIRD_RADIUS;
                this.rotation = 0;
            }

            update() {
                this.velocity += GRAVITY;
                this.y += this.velocity;
                
                // Rotation based on velocity
                this.rotation = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, this.velocity * 0.1));

                // Floor/Ceiling collision
                if (this.y + this.radius > CANVAS_HEIGHT || this.y - this.radius < 0) {
                    endGame();
                }
            }

            flap() {
                this.velocity = FLAP_STRENGTH;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);

                // Body
                ctx.fillStyle = '#FFD700'; // Cute yellow
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Eye
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(7, -5, 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                ctx.fillStyle = 'black';
                ctx.beginPath();
                ctx.arc(9, -5, 2, 0, Math.PI * 2);
                ctx.fill();

                // Beak
                ctx.fillStyle = '#FF4500';
                ctx.beginPath();
                ctx.moveTo(12, 0);
                ctx.lineTo(22, 5);
                ctx.lineTo(12, 10);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                ctx.restore();
            }
        }

        class Pipe {
            constructor(x) {
                this.x = x;
                this.width = 60;
                this.topHeight = Math.random() * (CANVAS_HEIGHT - PIPE_GAP - 100) + 50;
                this.passed = false;
            }

            update() {
                this.x -= PIPE_SPEED;
            }

            draw() {
                ctx.fillStyle = '#2ecc71'; // Cute green
                ctx.strokeStyle = '#27ae60';
                ctx.lineWidth = 4;

                // Top Pipe
                ctx.fillRect(this.x, 0, this.width, this.topHeight);
                ctx.strokeRect(this.x, 0, this.width, this.topHeight);

                // Bottom Pipe
                const bottomY = this.topHeight + PIPE_GAP;
                const bottomHeight = CANVAS_HEIGHT - bottomY;
                ctx.fillRect(this.x, bottomY, this.width, bottomHeight);
                ctx.strokeRect(this.x, bottomY, this.width, bottomHeight);

                // Pipe caps (decor)
                ctx.fillStyle = '#27ae60';
                ctx.fillRect(this.x - 5, this.topHeight - 20, this.width + 10, 20);
                ctx.fillRect(this.x - 5, bottomY, this.width + 10, 20);
            }

            isColliding(bird) {
                // Check top pipe
                if (bird.x + bird.radius > this.x && bird.x - bird.radius < this.x + this.width) {
                    if (bird.y - bird.radius < this.topHeight || bird.y + bird.radius > this.topHeight + PIPE_GAP) {
                        return true;
                    }
                }
                return false;
            }
        }

        class ParallaxLayer {
            constructor(speed, color, heightFactor) {
                this.speed = speed;
                this.color = color;
                this.heightFactor = heightFactor;
                this.offset = 0;
            }

            update() {
                this.offset -= this.speed;
                if (this.offset <= -CANVAS_WIDTH) this.offset = 0;
            }

            draw() {
                ctx.fillStyle = this.color;
                // Draw two layers to loop seamlessly
                for (let i = 0; i < 2; i++) {
                    const x = this.offset + (i * CANVAS_WIDTH);
                    ctx.beginPath();
                    ctx.moveTo(x, CANVAS_HEIGHT);
                    // Simple hills
                    ctx.lineTo(x, CANVAS_HEIGHT - (this.heightFactor * CANVAS_HEIGHT));
                    ctx.lineTo(x + CANVAS_WIDTH, CANVAS_HEIGHT - (this.heightFactor * CANVAS_HEIGHT));
                    ctx.lineTo(x + CANVAS_WIDTH, CANVAS_HEIGHT);
                    ctx.fill();
                }
            }
        }

        const bgLayers = [
            new ParallaxLayer(0.2, '#87CEEB', 0.7), // Far mountains
            new ParallaxLayer(0.5, '#5DADE2', 0.4), // Mid hills
            new ParallaxLayer(1.0, '#2E86C1', 0.2)  // Near hills
        ];

        function init() {
            bird = new Bird();
            pipes = [];
            score = 0;
            frameCount = 0;
            gameState = 'START';
            scoreDisplay.innerText = '0';
            msgDisplay.classList.remove('hidden');
            msgDisplay.innerText = 'Press SPACE or CLICK to Start';
        }

        function startGame() {
            gameState = 'PLAYING';
            msgDisplay.classList.add('hidden');
        }

        function endGame() {
            gameState = 'GAMEOVER';
            msgDisplay.classList.remove('hidden');
            msgDisplay.innerText = 'GAME OVER! Click to Restart';
        }

        function resetGame() {
            init();
        }

        function update() {
            if (gameState === 'PLAYING') {
                bird.update();

                // Spawn pipes
                if (frameCount % PIPE_SPAWN_RATE === 0) {
                    pipes.push(new Pipe(CANVAS_WIDTH));
                }

                // Update pipes
                for (let i = pipes.length - 1; i >= 0; i--) {
                    pipes[i].update();

                    // Collision
                    if (pipes[i].isColliding(bird)) {
                        endGame();
                    }

                    // Score
                    if (!pipes[i].passed && pipes[i].x + pipes[i].width < bird.x) {
                        score++;
                        scoreDisplay.innerText = score;
                        pipes[i].passed = true;
                    }

                    // Remove old pipes
                    if (pipes[i].x + pipes[i].width < 0) {
                        pipes.splice(i, 1);
                    }
                }

                frameCount++;
            }

            // Background layers update
            bgLayers.forEach(layer => layer.update());
        }

        function draw() {
            // Clear canvas
            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // Draw Background
            bgLayers.forEach(layer => layer.draw());

            // Draw Pipes
            pipes.forEach(pipe => pipe.draw());

            // Draw Bird
            bird.draw();

            // Draw Floor (simple)
            ctx.fillStyle = '#DEB887';
            ctx.fillRect(0, CANVAS_HEIGHT - 20, CANVAS_WIDTH, 20);
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Input Handlers
        function handleInput(e) {
            if (e.code === 'Space' || e.type === 'mousedown' || e.type === 'touchstart') {
                if (gameState === 'START') {
                    startGame();
                } else if (gameState === 'PLAYING') {
                    bird.flap();
                } else if (gameState === 'GAMEOVER') {
                    resetGame();
                }
            }
        }

        window.addEventListener('keydown', handleInput);
        window.addEventListener('mousedown', handleInput);
        window.addEventListener('touchstart', (e) => {
            e.preventDefault(); // Prevent scrolling
            handleInput(e);
        }, { passive: false });

        // Start
        init();
        gameLoop();

    </script>
</body>
