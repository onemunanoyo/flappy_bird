<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Puffy Bird</title>
<style>
  :root { color-scheme: light; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #1d2b34;
    overflow: hidden;
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  #stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(120% 90% at 50% 0%, #3d5a6c 0%, #1d2b34 70%);
  }
  canvas {
    display: block;
    border-radius: 14px;
    box-shadow: 0 18px 50px rgba(0,0,0,.55);
    image-rendering: auto;
    cursor: pointer;
  }
  #sound {
    position: fixed; top: 12px; right: 14px;
    width: 40px; height: 40px;
    border: none; border-radius: 50%;
    background: rgba(255,255,255,.14);
    color: #fff; font-size: 19px; line-height: 40px;
    cursor: pointer; padding: 0;
    backdrop-filter: blur(4px);
    transition: background .15s;
  }
  #sound:hover { background: rgba(255,255,255,.26); }
  #testlog {
    position: fixed; inset: 0; overflow: auto; display: none;
    background: #0d1117; color: #d6e2ee; padding: 24px 28px;
    font: 13px/1.7 ui-monospace, Consolas, monospace; white-space: pre-wrap;
    z-index: 10;
  }
</style>
</head>
<body>
  <div id="stage"><canvas id="game"></canvas></div>
  <button id="sound" type="button" title="Toggle sound (M)" aria-label="Toggle sound">🔊</button>
  <pre id="testlog"></pre>

<script>
(function () {
  'use strict';

  /* ============================================================
     Constants — tuned so a flap always clears roughly 1.4 gaps,
     which keeps the game recoverable at any pipe height.
     ============================================================ */
  const W = 400, H = 640;
  const GROUND_H = 96;
  const GROUND_Y = H - GROUND_H;

  const GRAVITY   = 1750;   // px/s^2
  const FLAP_V    = -520;   // px/s
  const MAX_FALL  = 820;    // px/s
  const BIRD_X    = 118;
  const BIRD_R    = 12;     // collision radius: smaller than the drawn body, on purpose
  const PIPE_W    = 68;
  const CAP_H     = 26;
  const PIPE_GAP_H= 230;    // horizontal distance travelled between spawns

  const STEP = 1 / 120;     // fixed physics step: identical feel on 60Hz and 144Hz screens

  /* ============================================================
     Pure logic — kept free of canvas/state so #test can exercise it
     ============================================================ */

  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function easeOutBack(t) {
    const c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  }

  // Closest-point test: the bird is a circle, pipes are axis-aligned boxes.
  function circleRectOverlap(cx, cy, r, rx, ry, rw, rh) {
    const nx = clamp(cx, rx, rx + rw);
    const ny = clamp(cy, ry, ry + rh);
    const dx = cx - nx, dy = cy - ny;
    return dx * dx + dy * dy < r * r;
  }

  // Difficulty ramp: gap tightens and the world speeds up, both plateau
  // so late-game stays hard but not impossible.
  function gapFor(score)   { return Math.max(124, 172 - score * 2.2); }
  function speedFor(score) { return Math.min(215, 142 + score * 2.4); }

  function medalFor(score) {
    if (score >= 40) return { name: 'RAINBOW', a: '#ff8ad0', b: '#7ee8fa' };
    if (score >= 25) return { name: 'GOLD',    a: '#ffd75e', b: '#e2a00b' };
    if (score >= 12) return { name: 'SILVER',  a: '#e8eef3', b: '#9fb3c1' };
    if (score >= 5)  return { name: 'BRONZE',  a: '#f0b078', b: '#a9663a' };
    return null;
  }

  // One gravity step. Returns a new object so tests can't be fooled by aliasing.
  function stepPhysics(y, vy, dt) {
    const nvy = Math.min(vy + GRAVITY * dt, MAX_FALL);
    return { y: y + nvy * dt, vy: nvy };
  }

  // A pipe is scored once its right edge is fully behind the bird.
  function passedPipe(pipe, birdX) { return birdX > pipe.x + PIPE_W; }

  function pipeHitsBird(pipe, bx, by, r, gap) {
    return circleRectOverlap(bx, by, r, pipe.x, -200, PIPE_W, pipe.top + 200) ||
           circleRectOverlap(bx, by, r, pipe.x, pipe.top + gap, PIPE_W, H);
  }

  /* ============================================================
     Canvas setup
     ============================================================ */
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    // A hidden iframe or a minimised window can report a 0x0 viewport, which
    // would make the scale zero or negative and blank the canvas entirely.
    const raw = Math.min(window.innerWidth / W, (window.innerHeight - 8) / H);
    const s = (isFinite(raw) && raw > 0.1) ? raw : 0.1;
    canvas.style.width  = (W * s) + 'px';
    canvas.style.height = (H * s) + 'px';
    canvas.width  = Math.round(W * s * dpr);
    canvas.height = Math.round(H * s * dpr);
    ctx.setTransform(s * dpr, 0, 0, s * dpr, 0, 0);
  }
  window.addEventListener('resize', resize);

  /* ============================================================
     Tiny WebAudio blips — built lazily so autoplay policies stay happy
     ============================================================ */
  const sfx = (function () {
    let actx = null, muted = false;
    function ensure() {
      if (!actx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) actx = new AC();
      }
      if (actx && actx.state === 'suspended') actx.resume();
      return actx;
    }
    function tone(freq, freq2, dur, type, vol) {
      if (muted) return;
      const a = ensure(); if (!a) return;
      const o = a.createOscillator(), g = a.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, a.currentTime);
      if (freq2) o.frequency.exponentialRampToValueAtTime(freq2, a.currentTime + dur);
      g.gain.setValueAtTime(vol, a.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
      o.connect(g); g.connect(a.destination);
      o.start(); o.stop(a.currentTime + dur + 0.02);
    }
    return {
      flap:  () => tone(520, 760, 0.09, 'square',   0.05),
      score: () => { tone(880, 880, 0.08, 'triangle', 0.09); setTimeout(() => tone(1320, 1320, 0.11, 'triangle', 0.08), 70); },
      hit:   () => tone(320, 70, 0.28, 'sawtooth', 0.10),
      thud:  () => tone(150, 50, 0.22, 'sine',     0.10),
      toggle(){ muted = !muted; if (!muted) ensure(); return muted; },
      get muted(){ return muted; }
    };
  })();

  const soundBtn = document.getElementById('sound');
  soundBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    soundBtn.textContent = sfx.toggle() ? '🔇' : '🔊';
    soundBtn.blur();
  });

  /* ============================================================
     Game state
     ============================================================ */
  const READY = 'ready', PLAY = 'play', FALL = 'fall', OVER = 'over';

  let state, bird, pipes, particles, score, best, gap, speed,
      spawnDist, scrollGround, scrollBush, scrollHill, scrollCloud,
      shake, flash, overT, time, birdIdleT;

  best = (function () {
    try { return parseInt(localStorage.getItem('puffybird.best') || '0', 10) || 0; }
    catch (e) { return 0; }
  })();

  function saveBest() {
    try { localStorage.setItem('puffybird.best', String(best)); } catch (e) {}
  }

  function reset() {
    state = READY;
    bird = { y: H * 0.42, vy: 0, rot: 0, wing: 0, flapT: 1 };
    pipes = [];
    particles = [];
    score = 0;
    gap = gapFor(0);
    speed = speedFor(0);
    spawnDist = PIPE_GAP_H * 0.55; // first pipe arrives a beat after take-off
    scrollGround = scrollBush = scrollHill = scrollCloud = 0;
    shake = 0; flash = 0; overT = 0; birdIdleT = 0;
    time = 0;
  }

  function spawnPipe() {
    const margin = 62;
    const top = margin + Math.random() * (GROUND_Y - gap - margin * 2);
    pipes.push({ x: W + 20, top: top, scored: false, wobble: Math.random() * 6.28 });
  }

  function puff(x, y, n, color, spread, life) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = Math.random() * spread;
      particles.push({
        x: x, y: y,
        vx: Math.cos(a) * s - 40, vy: Math.sin(a) * s,
        r: 2 + Math.random() * 4,
        life: life, max: life, color: color
      });
    }
  }

  function flap() {
    bird.vy = FLAP_V;
    bird.flapT = 0;
    puff(BIRD_X - 12, bird.y + 8, 4, 'rgba(255,255,255,.85)', 60, 0.4);
    sfx.flap();
  }

  function die() {
    state = FALL;
    flash = 1;
    shake = 12;
    puff(BIRD_X, bird.y, 14, '#fff3c4', 220, 0.55);
    sfx.hit();
    if (bird.vy < 0) bird.vy = 0; // cancel upward momentum so the death fall reads clearly
  }

  function input() {
    if (state === READY) { state = PLAY; flap(); }
    else if (state === PLAY) { flap(); }
    else if (state === OVER && overT > 0.35) { reset(); }
  }

  /* ============================================================
     Update
     ============================================================ */
  function update(dt) {
    time += dt;

    // Background layers keep drifting on every screen, including game over.
    const bgSpeed = (state === PLAY || state === FALL) ? speed : speed * 0.55;
    scrollCloud = (scrollCloud + bgSpeed * 0.08 * dt) % 260;
    scrollHill  = (scrollHill  + bgSpeed * 0.20 * dt) % 200;
    scrollBush  = (scrollBush  + bgSpeed * 0.42 * dt) % 96;
    if (state === PLAY || state === READY) scrollGround = (scrollGround + bgSpeed * dt) % 48;

    shake = Math.max(0, shake - dt * 42);
    flash = Math.max(0, flash - dt * 3.2);

    // Wing cycle: one sharp beat after a flap, lazy hover otherwise.
    bird.flapT = Math.min(1, bird.flapT + dt / 0.26);
    bird.wing = bird.flapT < 1
      ? -Math.sin(bird.flapT * Math.PI) * 1.35
      : Math.sin(time * 7) * 0.22;

    if (state === READY) {
      birdIdleT += dt;
      bird.y = H * 0.42 + Math.sin(birdIdleT * 2.6) * 9;
      bird.rot = Math.sin(birdIdleT * 2.6) * 0.12;
    }

    if (state === PLAY) {
      const s = stepPhysics(bird.y, bird.vy, dt);
      bird.y = s.y; bird.vy = s.vy;

      // Nose follows velocity, but pitches down lazily for a floatier feel.
      const target = clamp(bird.vy / 620, -0.55, 1.45);
      bird.rot = lerp(bird.rot, target, bird.vy < 0 ? 0.35 : 0.12);

      spawnDist += speed * dt;
      if (spawnDist >= PIPE_GAP_H) { spawnDist -= PIPE_GAP_H; spawnPipe(); }

      for (let i = pipes.length - 1; i >= 0; i--) {
        const p = pipes[i];
        p.x -= speed * dt;
        if (!p.scored && passedPipe(p, BIRD_X)) {
          p.scored = true;
          score++;
          gap = gapFor(score);
          speed = speedFor(score);
          if (score > best) { best = score; saveBest(); }
          puff(BIRD_X + 16, bird.y - 4, 6, '#ffe66d', 110, 0.5);
          sfx.score();
        }
        if (p.x < -PIPE_W - 40) pipes.splice(i, 1);
      }

      for (let i = 0; i < pipes.length; i++) {
        if (pipeHitsBird(pipes[i], BIRD_X, bird.y, BIRD_R, gap)) { die(); break; }
      }
      if (state === PLAY && bird.y - BIRD_R < -40) { bird.y = -40 + BIRD_R; bird.vy = 0; } // ceiling nudge, not death
      if (state === PLAY && bird.y + BIRD_R >= GROUND_Y) { die(); }
    }

    if (state === FALL) {
      const s = stepPhysics(bird.y, bird.vy, dt);
      bird.y = s.y; bird.vy = s.vy;
      bird.rot = Math.min(bird.rot + dt * 5.5, 1.6);
      if (bird.y + BIRD_R >= GROUND_Y) {
        bird.y = GROUND_Y - BIRD_R;
        bird.vy = 0;
        state = OVER;
        overT = 0;
        shake = 8;
        puff(BIRD_X, GROUND_Y - 4, 10, '#d8c18a', 150, 0.5);
        sfx.thud();
      }
    }

    if (state === OVER) overT += dt;

    for (let i = particles.length - 1; i >= 0; i--) {
      const q = particles[i];
      q.life -= dt;
      if (q.life <= 0) { particles.splice(i, 1); continue; }
      q.x += q.vx * dt; q.y += q.vy * dt;
      q.vy += 220 * dt; q.vx *= 0.96;
    }
  }

  /* ============================================================
     Drawing helpers
     ============================================================ */
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function ellipse(x, y, rx, ry, rot) {
    ctx.beginPath();
    ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2);
  }

  function repeatX(spacing, offset, fn) {
    const start = -((offset % spacing) + spacing) % spacing;
    for (let x = start - spacing; x < W + spacing * 2; x += spacing) fn(x);
  }

  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
    g.addColorStop(0,    '#5ec8f2');
    g.addColorStop(0.55, '#a8e4f7');
    g.addColorStop(1,    '#e4f7e0');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, GROUND_Y + 4);

    // Sun with a soft halo
    ctx.save();
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = '#fff6c9';
    ellipse(322, 88, 54, 54); ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#fff3a8';
    ellipse(322, 88, 30, 30); ctx.fill();
  }

  function cloud(x, y, s, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(x,            y,            22 * s, 0, 6.29);
    ctx.arc(x + 24 * s,   y - 10 * s,   27 * s, 0, 6.29);
    ctx.arc(x + 52 * s,   y + 2 * s,    20 * s, 0, 6.29);
    ctx.arc(x + 26 * s,   y + 14 * s,   24 * s, 0, 6.29);
    ctx.fill();
    ctx.restore();
  }

  function drawClouds() {
    repeatX(260, scrollCloud, function (x) {
      cloud(x, 108, 1.0, 0.85);
      cloud(x + 132, 62, 0.66, 0.6);
      cloud(x + 60, 178, 0.5, 0.45);
    });
  }

  function drawHills() {
    ctx.fillStyle = '#8fd9a8';
    repeatX(200, scrollHill, function (x) {
      ctx.beginPath();
      ctx.moveTo(x - 20, GROUND_Y);
      ctx.quadraticCurveTo(x + 55, GROUND_Y - 132, x + 132, GROUND_Y);
      ctx.closePath(); ctx.fill();
    });
    ctx.fillStyle = '#69c98c';
    repeatX(200, scrollHill * 1.35 + 90, function (x) {
      ctx.beginPath();
      ctx.moveTo(x - 20, GROUND_Y);
      ctx.quadraticCurveTo(x + 48, GROUND_Y - 88, x + 118, GROUND_Y);
      ctx.closePath(); ctx.fill();
    });
  }

  function drawBushes() {
    ctx.fillStyle = '#4bb377';
    repeatX(96, scrollBush, function (x) {
      ctx.beginPath();
      ctx.arc(x + 18, GROUND_Y - 8, 24, Math.PI, 0);
      ctx.arc(x + 52, GROUND_Y - 8, 18, Math.PI, 0);
      ctx.arc(x + 78, GROUND_Y - 8, 22, Math.PI, 0);
      ctx.rect(x - 6, GROUND_Y - 10, 110, 12);
      ctx.fill();
    });
  }

  function drawPipe(p) {
    const gy = p.top + gap;
    const bodyGrad = ctx.createLinearGradient(p.x, 0, p.x + PIPE_W, 0);
    bodyGrad.addColorStop(0,    '#3f9e4d');
    bodyGrad.addColorStop(0.28, '#7fdc7f');
    bodyGrad.addColorStop(0.52, '#5cc463');
    bodyGrad.addColorStop(1,    '#2f7d3c');

    function segment(x, y, w, h) {
      ctx.fillStyle = bodyGrad;
      roundRect(x, y, w, h, 5); ctx.fill();
      ctx.strokeStyle = 'rgba(23,80,36,.55)';
      ctx.lineWidth = 2;
      roundRect(x + 1, y + 1, w - 2, h - 2, 5); ctx.stroke();
    }
    function cap(x, y) {
      const cw = PIPE_W + 14;
      ctx.fillStyle = bodyGrad;
      roundRect(x - 7, y, cw, CAP_H, 7); ctx.fill();
      ctx.strokeStyle = 'rgba(23,80,36,.55)';
      ctx.lineWidth = 2;
      roundRect(x - 6, y + 1, cw - 2, CAP_H - 2, 7); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.30)';
      roundRect(x + 1, y + 5, 11, CAP_H - 11, 5); ctx.fill();
    }

    // Top pipe
    segment(p.x, -60, PIPE_W, p.top + 60 - CAP_H);
    cap(p.x, p.top - CAP_H);
    // Bottom pipe
    segment(p.x, gy + CAP_H, PIPE_W, GROUND_Y - gy - CAP_H + 8);
    cap(p.x, gy);

    // Cheeky little eyes on the lower pipe so it reads "cute", not "industrial"
    const blink = (Math.sin(time * 1.7 + p.wobble) > 0.97) ? 0.15 : 1;
    ctx.fillStyle = '#1f5b2c';
    ellipse(p.x + 24, gy + 52, 4, 4 * blink); ctx.fill();
    ellipse(p.x + 46, gy + 52, 4, 4 * blink); ctx.fill();
    ctx.strokeStyle = 'rgba(31,91,44,.8)';
    ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(p.x + 35, gy + 58, 9, 0.35, Math.PI - 0.35);
    ctx.stroke();
  }

  function drawGround() {
    ctx.fillStyle = '#dec98a';
    ctx.fillRect(0, GROUND_Y, W, GROUND_H);

    // Grass lip
    ctx.fillStyle = '#7ed37e';
    ctx.fillRect(0, GROUND_Y, W, 14);
    ctx.fillStyle = '#5cbb63';
    repeatX(24, scrollGround, function (x) {
      ctx.beginPath();
      ctx.moveTo(x, GROUND_Y + 14);
      ctx.lineTo(x + 12, GROUND_Y + 4);
      ctx.lineTo(x + 24, GROUND_Y + 14);
      ctx.closePath(); ctx.fill();
    });
    ctx.fillStyle = 'rgba(0,0,0,.10)';
    ctx.fillRect(0, GROUND_Y + 14, W, 4);

    // Dirt speckles
    ctx.fillStyle = 'rgba(160,126,72,.45)';
    repeatX(48, scrollGround, function (x) {
      ctx.fillRect(x + 6,  GROUND_Y + 32, 14, 6);
      ctx.fillRect(x + 28, GROUND_Y + 52, 10, 6);
      ctx.fillRect(x + 12, GROUND_Y + 72, 18, 6);
    });
  }

  function drawBird(x, y, rot, wing) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);

    // Shadow under the belly
    ctx.fillStyle = 'rgba(0,0,0,.10)';
    ellipse(2, 12, 17, 5); ctx.fill();

    // Tail
    ctx.fillStyle = '#f0a92e';
    ctx.beginPath();
    ctx.moveTo(-13, -2);
    ctx.lineTo(-25, -9);
    ctx.lineTo(-24, 2);
    ctx.lineTo(-13, 7);
    ctx.closePath(); ctx.fill();

    // Body
    const bg = ctx.createLinearGradient(0, -16, 0, 16);
    bg.addColorStop(0, '#ffe066');
    bg.addColorStop(0.6, '#ffc93c');
    bg.addColorStop(1, '#f2a71b');
    ctx.fillStyle = bg;
    ellipse(0, 0, 18, 15); ctx.fill();
    ctx.strokeStyle = 'rgba(150,86,10,.35)';
    ctx.lineWidth = 1.5;
    ellipse(0, 0, 18, 15); ctx.stroke();

    // Belly
    ctx.fillStyle = '#fff0b8';
    ellipse(2, 5, 12, 8); ctx.fill();

    // Wing — rotates around its shoulder joint
    ctx.save();
    ctx.translate(-3, -1);
    ctx.rotate(wing);
    ctx.fillStyle = '#fff6d8';
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(-14, 4, -12, 13);
    ctx.quadraticCurveTo(-2, 15, 6, 6);
    ctx.quadraticCurveTo(6, 1, 0, 0);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(150,86,10,.30)';
    ctx.lineWidth = 1.4; ctx.stroke();
    ctx.restore();

    // Cheek blush
    ctx.fillStyle = 'rgba(255,120,140,.55)';
    ellipse(8, 4, 4.5, 3); ctx.fill();

    // Eye
    ctx.fillStyle = '#fff';
    ellipse(9, -5, 6.5, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(120,70,10,.30)';
    ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = '#2b2b2b';
    ellipse(11, -5, 3, 3.4); ctx.fill();
    ctx.fillStyle = '#fff';
    ellipse(12.2, -6.4, 1.2, 1.2); ctx.fill();

    // Beak
    ctx.fillStyle = '#ff8a3d';
    ctx.beginPath();
    ctx.moveTo(15, -1);
    ctx.lineTo(27, 2);
    ctx.lineTo(15, 6);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#e56b1f';
    ctx.beginPath();
    ctx.moveTo(15, 3);
    ctx.lineTo(26, 2.6);
    ctx.lineTo(15, 6);
    ctx.closePath(); ctx.fill();

    ctx.restore();
  }

  function drawParticles() {
    for (let i = 0; i < particles.length; i++) {
      const q = particles[i];
      ctx.save();
      ctx.globalAlpha = Math.max(0, q.life / q.max);
      ctx.fillStyle = q.color;
      ellipse(q.x, q.y, q.r, q.r); ctx.fill();
      ctx.restore();
    }
  }

  function outlinedText(txt, x, y, size, fill, stroke, align) {
    ctx.font = '900 ' + size + 'px "Trebuchet MS", "Segoe UI", sans-serif';
    ctx.textAlign = align || 'center';
    ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    ctx.lineWidth = Math.max(3, size * 0.16);
    ctx.strokeStyle = stroke;
    ctx.strokeText(txt, x, y);
    ctx.fillStyle = fill;
    ctx.fillText(txt, x, y);
  }

  function drawScore() {
    if (state === OVER) return;
    ctx.save();
    ctx.globalAlpha = 0.25;
    outlinedText(String(score), 200, 92, 58, '#000', '#000');
    ctx.restore();
    outlinedText(String(score), 200, 89, 58, '#fff', '#4a3a12');
  }

  function drawReady() {
    const pulse = 1 + Math.sin(time * 3) * 0.04;
    ctx.save();
    ctx.translate(200, 190);
    ctx.scale(pulse, pulse);
    outlinedText('PUFFY BIRD', 0, 0, 44, '#ffe066', '#7a4a08');
    ctx.restore();

    outlinedText('TAP  ·  CLICK  ·  SPACE', 200, 250, 17, '#fff', '#3c6b7d');

    // Bobbing hand hint
    const oy = Math.sin(time * 3) * 6;
    ctx.save();
    ctx.translate(200, 330 + oy);
    ctx.fillStyle = 'rgba(255,255,255,.92)';
    ctx.strokeStyle = 'rgba(60,60,60,.5)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, -16);
    ctx.quadraticCurveTo(6, -16, 6, -6);
    ctx.lineTo(6, 2);
    ctx.quadraticCurveTo(14, 0, 15, 8);
    ctx.quadraticCurveTo(15, 22, 4, 24);
    ctx.lineTo(-6, 24);
    ctx.quadraticCurveTo(-14, 22, -14, 12);
    ctx.lineTo(-14, 2);
    ctx.quadraticCurveTo(-10, -2, -6, 2);
    ctx.lineTo(-6, -6);
    ctx.quadraticCurveTo(-6, -16, 0, -16);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.restore();

    if (best > 0) outlinedText('BEST  ' + best, 200, 420, 20, '#fff', '#3c6b7d');
  }

  function drawMedal(cx, cy, m) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(Math.sin(time * 1.6) * 0.06);
    const g = ctx.createLinearGradient(-22, -22, 22, 22);
    g.addColorStop(0, m.a); g.addColorStop(1, m.b);
    ctx.fillStyle = g;
    ellipse(0, 0, 24, 24); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.75)';
    ctx.lineWidth = 3;
    ellipse(0, 0, 24, 24); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    ellipse(-7, -8, 8, 6, -0.6); ctx.fill();
    // Star
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const r = i % 2 ? 5 : 11, a = -Math.PI / 2 + i * Math.PI / 5;
      ctx[i ? 'lineTo' : 'moveTo'](Math.cos(a) * r, Math.sin(a) * r);
    }
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function drawGameOver() {
    ctx.save();
    ctx.fillStyle = 'rgba(20,30,40,.32)';
    ctx.fillRect(0, 0, W, H);

    const t = clamp(overT / 0.42, 0, 1);
    const s = easeOutBack(t);
    const pw = 288, ph = 216;
    ctx.translate(200, 288);
    ctx.scale(s, s);
    ctx.translate(-pw / 2, -ph / 2);

    ctx.fillStyle = 'rgba(0,0,0,.22)';
    roundRect(4, 8, pw, ph, 22); ctx.fill();
    const g = ctx.createLinearGradient(0, 0, 0, ph);
    g.addColorStop(0, '#fff7e2'); g.addColorStop(1, '#ffe6b8');
    ctx.fillStyle = g;
    roundRect(0, 0, pw, ph, 22); ctx.fill();
    ctx.strokeStyle = '#e0a94b'; ctx.lineWidth = 4;
    roundRect(2, 2, pw - 4, ph - 4, 20); ctx.stroke();

    outlinedText('GAME OVER', pw / 2, 40, 32, '#ff8a5b', '#8c3d19');

    const m = medalFor(score);
    if (m) drawMedal(58, 118, m);

    ctx.textAlign = 'right';
    ctx.fillStyle = '#8a6b32';
    ctx.font = '700 15px "Trebuchet MS", sans-serif';
    ctx.textBaseline = 'middle';
    ctx.fillText('SCORE', pw - 116, 100);
    ctx.fillText('BEST',  pw - 116, 142);
    outlinedText(String(score), pw - 36, 100, 30, '#fff', '#c98a2e', 'right');
    outlinedText(String(best),  pw - 36, 142, 30, '#fff', '#c98a2e', 'right');

    if (score >= best && score > 0) {
      ctx.save();
      ctx.translate(pw - 96, 128);
      ctx.rotate(-0.22);
      ctx.fillStyle = '#ff5c8a';
      roundRect(-24, -10, 48, 20, 6); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = '900 11px "Trebuchet MS", sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('NEW!', 0, 1);
      ctx.restore();
    }

    ctx.globalAlpha = 0.55 + Math.sin(time * 4) * 0.45;
    outlinedText('TAP TO PLAY AGAIN', pw / 2, 184, 17, '#fff', '#c98a2e');
    ctx.restore();
  }

  function render() {
    ctx.save();
    if (shake > 0) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    }

    drawSky();
    drawClouds();
    drawHills();
    drawBushes();
    for (let i = 0; i < pipes.length; i++) drawPipe(pipes[i]);
    drawGround();
    drawParticles();
    drawBird(BIRD_X, bird.y, bird.rot, bird.wing);

    ctx.restore();

    if (flash > 0) {
      ctx.fillStyle = 'rgba(255,255,255,' + (flash * 0.55) + ')';
      ctx.fillRect(0, 0, W, H);
    }

    drawScore();
    if (state === READY) drawReady();
    if (state === OVER)  drawGameOver();
  }

  /* ============================================================
     Main loop — accumulator keeps physics frame-rate independent
     ============================================================ */
  let last = 0, acc = 0;
  function frame(now) {
    if (!last) last = now;
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.25) dt = 0.25; // a backgrounded tab must not teleport the bird into a pipe
    acc += dt;
    while (acc >= STEP) { update(STEP); acc -= STEP; }
    render();
    requestAnimationFrame(frame);
  }

  /* ============================================================
     Input
     ============================================================ */
  function onKey(e) {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW' || e.key === ' ') {
      e.preventDefault();
      input();
    } else if (e.code === 'KeyM') {
      soundBtn.textContent = sfx.toggle() ? '🔇' : '🔊';
    }
  }
  window.addEventListener('keydown', onKey, { passive: false });
  window.addEventListener('pointerdown', function (e) {
    if (e.target === soundBtn) return;
    input();
  });
  window.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  window.addEventListener('blur', function () { last = 0; acc = 0; });
  document.addEventListener('visibilitychange', function () { last = 0; acc = 0; });

  /* ============================================================
     Built-in tests for the pure logic: open the file with #test
     ============================================================ */
  function runTests() {
    const log = document.getElementById('testlog');
    log.style.display = 'block';
    let pass = 0, fail = 0;
    const lines = [];
    function ok(name, cond) {
      if (cond) { pass++; lines.push('  PASS  ' + name); }
      else { fail++; lines.push('  FAIL  ' + name); }
    }

    // clamp / lerp
    ok('clamp below range', clamp(-5, 0, 10) === 0);
    ok('clamp above range', clamp(50, 0, 10) === 10);
    ok('clamp inside range', clamp(4, 0, 10) === 4);
    ok('lerp midpoint', lerp(0, 10, 0.5) === 5);

    // circleRectOverlap
    ok('circle fully inside rect overlaps',   circleRectOverlap(50, 50, 5, 40, 40, 20, 20));
    ok('circle far away does not overlap',   !circleRectOverlap(0, 0, 5, 40, 40, 20, 20));
    ok('circle touching edge counts as hit',  circleRectOverlap(36, 50, 5, 40, 40, 20, 20));
    ok('circle exactly tangent is not a hit',!circleRectOverlap(35, 50, 5, 40, 40, 20, 20));
    ok('corner-diagonal miss',               !circleRectOverlap(36, 36, 5, 40, 40, 20, 20));

    // Difficulty ramp
    ok('gap starts wide',       gapFor(0) === 172);
    ok('gap shrinks with score', gapFor(10) < gapFor(0));
    ok('gap has a floor',        gapFor(999) === 124);
    ok('speed rises with score', speedFor(10) > speedFor(0));
    ok('speed has a ceiling',    speedFor(999) === 215);
    ok('gap floor still clears the bird', gapFor(999) > BIRD_R * 4);

    // Medals
    ok('no medal at 0',      medalFor(0) === null);
    ok('no medal at 4',      medalFor(4) === null);
    ok('bronze at 5',        medalFor(5).name === 'BRONZE');
    ok('silver at 12',       medalFor(12).name === 'SILVER');
    ok('gold at 25',         medalFor(25).name === 'GOLD');
    ok('rainbow at 40',      medalFor(40).name === 'RAINBOW');

    // Physics
    const p1 = stepPhysics(100, 0, STEP);
    ok('gravity accelerates downward', p1.vy === GRAVITY * STEP && p1.y > 100);
    ok('a one-second step still clamps to terminal velocity', stepPhysics(100, 0, 1).vy === MAX_FALL);
    let v = 0;
    for (let i = 0; i < 600; i++) v = stepPhysics(0, v, STEP).vy;
    ok('fall speed is capped', v === MAX_FALL);
    const up = stepPhysics(300, FLAP_V, STEP);
    ok('a flap moves the bird up', up.y < 300);

    // A single flap must clear more than one gap height, or the game
    // becomes unwinnable when a pipe spawns high.
    let ry = 0, rv = FLAP_V, peak = 0;
    for (let i = 0; i < 2000 && rv < 0; i++) {
      const s = stepPhysics(ry, rv, STEP); ry = s.y; rv = s.vy;
      peak = Math.min(peak, ry);
    }
    ok('one flap out-climbs the tightest gap', -peak > gapFor(999) * 0.5);

    // Scoring
    ok('pipe not scored while ahead of bird', !passedPipe({ x: 200 }, BIRD_X));
    ok('pipe not scored while overlapping',   !passedPipe({ x: BIRD_X - PIPE_W + 1 }, BIRD_X));
    ok('pipe scored once fully behind',        passedPipe({ x: BIRD_X - PIPE_W - 1 }, BIRD_X));

    // Pipe collision
    const pipe = { x: BIRD_X - PIPE_W / 2, top: 200 };
    ok('bird inside the gap is safe',   !pipeHitsBird(pipe, BIRD_X, 200 + 160 / 2, BIRD_R, 160));
    ok('bird above the gap is hit',      pipeHitsBird(pipe, BIRD_X, 150, BIRD_R, 160));
    ok('bird below the gap is hit',      pipeHitsBird(pipe, BIRD_X, 200 + 160 + 20, BIRD_R, 160));
    ok('distant pipe cannot hit',       !pipeHitsBird({ x: W + 50, top: 200 }, BIRD_X, 300, BIRD_R, 160));

    // Spawn placement always leaves room for the gap and the ground
    let placementOK = true;
    reset();
    for (let i = 0; i < 400; i++) {
      gap = gapFor(i % 60);
      pipes.length = 0;
      spawnPipe();
      const p = pipes[0];
      if (p.top < 40 || p.top + gap > GROUND_Y - 40) placementOK = false;
    }
    ok('spawned gaps stay reachable on screen', placementOK);

    // reset() clears a dirty run
    reset(); score = 9; pipes.push({ x: 1, top: 1, scored: true }); state = OVER;
    reset();
    ok('reset clears score and pipes', score === 0 && pipes.length === 0 && state === READY);

    lines.unshift('Puffy Bird — logic tests\n' + '='.repeat(40));
    lines.push('='.repeat(40));
    lines.push(pass + ' passed, ' + fail + ' failed');
    lines.push('\nRemove #test from the URL to play.');
    log.textContent = lines.join('\n');
    (fail ? console.error : console.log)(lines.join('\n'));
  }

  /* ============================================================
     Boot
     ============================================================ */
  resize();
  reset();

  if (location.hash === '#test' || location.search.indexOf('test') > -1) {
    runTests();
  } else {
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
